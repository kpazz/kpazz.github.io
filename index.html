<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Kpazz - Trang Chủ Chính</title>
    <style>
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            min-height: 100vh;
            background-color: #000000;
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", Arial, sans-serif;
            overflow-x: hidden;
            color: #ffffff;
            -webkit-text-size-adjust: 100%;
            transition: background-color 0.65s ease, color 0.65s ease;
        }

        body {
            display: flex;
            flex-direction: column;
        }

        /* ================= CHẾ ĐỘ SÁNG (LIGHT MODE) ================= */
        body.light-theme {
            background-color: #f2f4f8;
            color: #111318;
        }

        body.light-theme .site-header {
            background-color: #ffffff;
            border-bottom-color: rgba(15, 23, 42, 0.08);
            color: #111318;
        }

        body.light-theme .site-header.scrolled {
            background: linear-gradient(
                135deg,
                rgba(255, 255, 255, 0.82) 0%,
                rgba(255, 255, 255, 0.62) 50%,
                rgba(255, 255, 255, 0.76) 100%
            );
            border: 1px solid rgba(15, 23, 42, 0.12);
            box-shadow:
                0 14px 36px rgba(15, 23, 42, 0.14),
                inset 0 1px 1px rgba(255, 255, 255, 0.9);
        }

        body.light-theme .brand-box,
        body.light-theme .brand-name {
            color: #111318;
        }

        body.light-theme .nav-icon-btn {
            background: rgba(15, 23, 42, 0.06);
            color: #111318;
        }

        body.light-theme .nav-icon-btn:hover {
            background: rgba(15, 23, 42, 0.12);
        }

        body.light-theme .activity-history-panel,
        body.light-theme .kpazz-modal-card,
        body.light-theme .notify-suggest-tooltip,
        body.light-theme .kpazz-search-overlay,
        body.light-theme .kpazz-drawer-menu {
            background: linear-gradient(
                145deg,
                rgba(255, 255, 255, 0.96) 0%,
                rgba(248, 250, 252, 0.98) 55%,
                rgba(255, 255, 255, 0.94) 100%
            );
            border: 1px solid rgba(15, 23, 42, 0.14);
            color: #111318;
            box-shadow: 0 20px 52px rgba(15, 23, 42, 0.18);
        }

        body.light-theme .activity-item-meta,
        body.light-theme .kpazz-modal-meta,
        body.light-theme .notify-tooltip-sub,
        body.light-theme .card-sheet-sub,
        body.light-theme .card-spec-sub,
        body.light-theme .drawer-section-sub,
        body.light-theme .drawer-child-sub {
            color: #475569;
            border-bottom-color: rgba(15, 23, 42, 0.08);
        }

        body.light-theme .activity-panel-title,
        body.light-theme .activity-item-name,
        body.light-theme .kpazz-modal-title,
        body.light-theme .notify-tooltip-title,
        body.light-theme .card-sheet-title,
        body.light-theme .card-spec-val,
        body.light-theme .drawer-brand-title,
        body.light-theme .drawer-section-title,
        body.light-theme .drawer-child-title {
            color: #111318;
        }

        body.light-theme .notify-suggest-tooltip:hover {
            background: rgba(15, 23, 42, 0.06);
        }

        body.light-theme .card-sheet-desc {
            color: #334155;
        }

        body.light-theme .activity-item,
        body.light-theme .kpazz-auth-tabs,
        body.light-theme .kpazz-input,
        body.light-theme .card-specs-strip,
        body.light-theme .kpazz-search-input-wrap,
        body.light-theme .search-history-chip,
        body.light-theme .search-history-clear-btn,
        body.light-theme .drawer-section-item,
        body.light-theme .drawer-child-item,
        body.light-theme .popup-suggest-card,
        body.light-theme .drawer-auth-btn {
            background: rgba(15, 23, 42, 0.05);
            color: #111318;
            border-color: rgba(15, 23, 42, 0.12);
        }

        body.light-theme .drawer-top-bar {
            background: linear-gradient(180deg, rgba(255, 255, 255, 0.96), rgba(248, 250, 252, 0.92));
            border-bottom-color: rgba(15, 23, 42, 0.1);
        }

        body.light-theme .kpazz-search-input {
            color: #111318;
        }

        body.light-theme .kpazz-auth-tab.active {
            background: #ffffff;
            color: #111318;
        }

        body.light-theme main,
        body.light-theme #tabs-container,
        body.light-theme .status-msg {
            background-color: #f2f4f8;
            color: #1e293b;
        }

        body.light-theme .site-footer {
            background-color: #e9edf3;
            border-top-color: rgba(15, 23, 42, 0.08);
            color: #475569;
        }

        /* ================= ICON TRONG NÚT BẤM ================= */
        .btn-left-icon {
            width: 15px;
            height: 15px;
            flex-shrink: 0;
            stroke: currentColor;
            fill: none;
            stroke-width: 2;
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        /* ================= LỚP NỀN LIQUID GLASS iOS 27 KHI MỞ POPUP ================= */
        .popup-backdrop {
            position: fixed;
            inset: 0;
            z-index: 950;
            background:
                radial-gradient(circle at 18% 20%, rgba(56, 189, 248, 0.28), transparent 44%),
                radial-gradient(circle at 82% 22%, rgba(168, 85, 247, 0.26), transparent 46%),
                radial-gradient(circle at 30% 78%, rgba(45, 212, 191, 0.20), transparent 50%),
                radial-gradient(circle at 76% 76%, rgba(251, 146, 60, 0.16), transparent 48%),
                rgba(10, 12, 18, 0.48);
            backdrop-filter: blur(28px) saturate(210%) contrast(1.06);
            -webkit-backdrop-filter: blur(28px) saturate(210%) contrast(1.06);
            box-shadow: inset 0 0 120px rgba(255, 255, 255, 0.06);
            opacity: 0;
            visibility: hidden;
            pointer-events: none;
            transition: opacity 0.5s cubic-bezier(0.22, 1, 0.36, 1), visibility 0.5s ease, backdrop-filter 0.35s ease, background 0.35s ease;
        }

        .popup-backdrop.active {
            opacity: 1;
            visibility: visible;
            pointer-events: auto;
        }

        .popup-backdrop.drawer-backdrop-deep {
            z-index: 1032;
            background: rgba(4, 6, 10, 0.72);
            backdrop-filter: blur(36px) saturate(180%) brightness(0.72);
            -webkit-backdrop-filter: blur(36px) saturate(180%) brightness(0.72);
        }

        /* Đảm bảo popup card của từng section (như #tweak-card-popup.is-open) luôn nổi trên backdrop khi mở */
        #tabs-container [id$='card-popup'].is-open,
        #tabs-container [id$='card-popup'].active,
        #tabs-container [id$='card-popup'].open,
        #tabs-container .tweak-popup-backdrop.is-open,
        #tabs-container [class*='popup-backdrop'].is-open,
        #tabs-container [class*='popup-backdrop'].active,
        #tabs-container [class*='popup-backdrop'].open,
        #tabs-container [class*='card-popup'].is-open,
        #tabs-container [class*='card-popup'].active,
        #tabs-container [class*='card-popup'].open {
            position: fixed !important;
            inset: 0 !important;
            z-index: 1040 !important;
            opacity: 1 !important;
            visibility: visible !important;
            pointer-events: auto !important;
        }

        /* ================= MENU DRAWER LIQUID GLASS ================= */
        .kpazz-drawer-menu {
            position: fixed;
            top: 0;
            left: 0;
            width: min(340px, 86vw);
            height: 100vh;
            z-index: 1035;
            display: flex;
            flex-direction: column;
            box-sizing: border-box;
            background: linear-gradient(
                160deg,
                rgba(26, 29, 40, 0.96) 0%,
                rgba(13, 15, 21, 0.98) 100%
            );
            backdrop-filter: blur(30px) saturate(210%);
            -webkit-backdrop-filter: blur(30px) saturate(210%);
            border-right: 1px solid rgba(255, 255, 255, 0.2);
            box-shadow: 20px 0 60px rgba(0, 0, 0, 0.78);
            transform: translateX(-100%);
            opacity: 0;
            visibility: hidden;
            pointer-events: none;
            transition: transform 0.38s cubic-bezier(0.22, 1, 0.36, 1), opacity 0.28s ease, visibility 0.38s ease;
        }

        .kpazz-drawer-menu.active {
            transform: translateX(0);
            opacity: 1;
            visibility: visible;
            pointer-events: auto;
        }

        .drawer-top-bar {
            position: sticky;
            top: 0;
            z-index: 2;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
            padding: 14px 16px;
            background: linear-gradient(180deg, rgba(24, 27, 38, 0.98), rgba(16, 18, 26, 0.94));
            border-bottom: 1px solid rgba(255, 255, 255, 0.12);
            flex-shrink: 0;
        }

        .drawer-brand-group {
            display: flex;
            align-items: center;
            gap: 10px;
            min-width: 0;
        }

        .drawer-brand-title {
            font-size: 1.08rem;
            font-weight: 700;
            letter-spacing: -0.2px;
            white-space: nowrap;
        }

        .drawer-clear-cache-btn {
            border: none;
            border-radius: 12px;
            padding: 7px 11px;
            background: linear-gradient(135deg, #ff453a, #ff6b6b);
            color: #ffffff;
            font-size: 0.78rem;
            font-weight: 600;
            cursor: pointer;
            white-space: nowrap;
            flex-shrink: 0;
            display: inline-flex;
            align-items: center;
            gap: 5px;
            transition: transform 0.15s ease, opacity 0.2s ease;
        }

        .drawer-clear-cache-btn:active {
            transform: scale(0.95);
        }

        .drawer-auth-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
            padding: 10px 14px 4px;
            flex-shrink: 0;
        }

        .drawer-auth-btn {
            border-radius: 12px;
            padding: 8px 10px;
            font-size: 0.82rem;
            font-weight: 600;
            cursor: pointer;
            border: 1px solid rgba(255, 255, 255, 0.14);
            background: rgba(255, 255, 255, 0.07);
            color: #ffffff;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            transition: background-color 0.2s ease, transform 0.15s ease;
        }

        .drawer-auth-btn:hover {
            background: rgba(255, 255, 255, 0.14);
        }

        .drawer-auth-btn.primary {
            background: linear-gradient(135deg, #0a84ff, #5e5ce6);
            border-color: transparent;
            color: #ffffff;
        }

        .drawer-auth-btn:active {
            transform: scale(0.97);
        }

        .drawer-sections-list {
            flex: 1;
            overflow-y: auto;
            padding: 10px 14px 20px;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .drawer-group-block {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .drawer-section-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
            padding: 11px 13px;
            border-radius: 14px;
            background: rgba(255, 255, 255, 0.06);
            border: 1px solid rgba(255, 255, 255, 0.1);
            cursor: pointer;
            transition: background-color 0.2s ease, transform 0.15s ease;
        }

        .drawer-section-item:hover {
            background: rgba(255, 255, 255, 0.13);
        }

        .drawer-section-item:active {
            transform: scale(0.99);
        }

        .drawer-section-title {
            font-size: 0.92rem;
            font-weight: 600;
            line-height: 1.3;
        }

        .drawer-section-sub {
            font-size: 0.73rem;
            color: #9aa5b1;
            margin-top: 2px;
            display: flex;
            align-items: center;
            gap: 6px;
            flex-wrap: wrap;
        }

        .drawer-section-count {
            font-weight: 600;
            color: #38bdf8;
            flex-shrink: 0;
        }

        .drawer-chevron {
            font-size: 0.85rem;
            opacity: 0.65;
            transition: transform 0.24s ease;
            flex-shrink: 0;
        }

        .drawer-section-item.expanded .drawer-chevron {
            transform: rotate(90deg);
        }

        .drawer-children-list {
            display: none;
            flex-direction: column;
            gap: 5px;
            padding-left: 10px;
        }

        .drawer-children-list.open {
            display: flex;
        }

        .drawer-child-item {
            display: flex;
            align-items: center;
            gap: 9px;
            padding: 8px 10px;
            border-radius: 12px;
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid rgba(255, 255, 255, 0.07);
            cursor: pointer;
            transition: background-color 0.2s ease;
        }

        .drawer-child-item:hover {
            background: rgba(255, 255, 255, 0.11);
        }

        .drawer-child-icon {
            width: 28px;
            height: 28px;
            border-radius: 7px;
            object-fit: cover;
            flex-shrink: 0;
            background: rgba(255, 255, 255, 0.08);
        }

        .drawer-child-info {
            min-width: 0;
            flex: 1;
        }

        .drawer-child-title {
            font-size: 0.84rem;
            font-weight: 600;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .drawer-child-sub {
            font-size: 0.72rem;
            opacity: 0.7;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        /* ================= NAVBAR LIQUID GLASS ================= */
        .navbar-wrapper {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            z-index: 1000;
            pointer-events: none;
            display: flex;
            justify-content: flex-start;
        }

        .site-header {
            pointer-events: auto;
            box-sizing: border-box;
            position: relative;
            width: 100%;
            max-width: 100%;
            height: 64px;
            margin-top: 0;
            margin-left: 0;
            padding: 0 5%;
            background-color: #000000;
            border-bottom: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 0px;
            color: #ffffff;
            display: flex;
            justify-content: space-between;
            align-items: center;
            overflow: visible;
            transition:
                width 1.65s cubic-bezier(0.22, 1, 0.36, 1),
                height 1.65s cubic-bezier(0.22, 1, 0.36, 1),
                margin-top 1.65s cubic-bezier(0.22, 1, 0.36, 1),
                margin-left 1.65s cubic-bezier(0.22, 1, 0.36, 1),
                padding 1.65s cubic-bezier(0.22, 1, 0.36, 1),
                border-radius 1.65s cubic-bezier(0.22, 1, 0.36, 1),
                background 1.65s cubic-bezier(0.22, 1, 0.36, 1),
                box-shadow 1.65s cubic-bezier(0.22, 1, 0.36, 1),
                border-color 1.65s cubic-bezier(0.22, 1, 0.36, 1),
                gap 1.65s cubic-bezier(0.22, 1, 0.36, 1);
        }

        .site-header.scrolled {
            width: calc(100% - 28px);
            max-width: calc(100% - 28px);
            height: 58px;
            margin-top: 12px;
            margin-left: 14px;
            padding: 0 16px;
            border-radius: 20px;
            border-bottom-color: rgba(255, 255, 255, 0.24);

            background: linear-gradient(
                135deg,
                rgba(255, 255, 255, 0.16) 0%,
                rgba(255, 255, 255, 0.06) 50%,
                rgba(255, 255, 255, 0.12) 100%
            );
            backdrop-filter: blur(26px) saturate(200%);
            -webkit-backdrop-filter: blur(26px) saturate(200%);
            border: 1px solid rgba(255, 255, 255, 0.24);
            box-shadow:
                0 14px 38px rgba(0, 0, 0, 0.68),
                inset 0 1px 1px rgba(255, 255, 255, 0.42),
                inset 0 -1px 1px rgba(255, 255, 255, 0.08);
        }

        .site-header.compact-left {
            height: 54px;
            margin-top: 12px;
            margin-left: 14px;
            padding: 0 10px;
            border-radius: 28px;
            justify-content: flex-start;
            gap: 6px;
        }

        .nav-left {
            display: flex;
            align-items: center;
            gap: 12px;
            flex-shrink: 0;
            transition: gap 1.45s cubic-bezier(0.22, 1, 0.36, 1);
        }

        .site-header.compact-left .nav-left {
            gap: 6px;
        }

        .brand-box {
            display: flex;
            align-items: center;
            gap: 10px;
            text-decoration: none;
            color: #ffffff;
            user-select: none;
            cursor: pointer;
            max-width: 160px;
            opacity: 1;
            transform: scale(1);
            transform-origin: left center;
            overflow: hidden;
            white-space: nowrap;
            transition:
                max-width 1.45s cubic-bezier(0.22, 1, 0.36, 1),
                opacity 1.1s cubic-bezier(0.22, 1, 0.36, 1),
                transform 1.35s cubic-bezier(0.22, 1, 0.36, 1),
                margin 1.45s cubic-bezier(0.22, 1, 0.36, 1);
        }

        .site-header.compact-left .brand-box {
            max-width: 0px;
            opacity: 0;
            transform: scale(0.72);
            pointer-events: none;
        }

        .brand-logo {
            width: 32px;
            height: 32px;
            border-radius: 9px;
            background: linear-gradient(135deg, #0a84ff, #5e5ce6);
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 2px 10px rgba(10, 132, 255, 0.45);
            flex-shrink: 0;
        }

        .brand-name {
            font-size: 1.2rem;
            font-weight: 700;
            letter-spacing: -0.3px;
            color: #ffffff;
        }

        .nav-right {
            display: flex;
            align-items: center;
            gap: 8px;
            flex-shrink: 0;
            transition: gap 1.45s cubic-bezier(0.22, 1, 0.36, 1);
        }

        .site-header.compact-left .nav-right {
            gap: 6px;
        }

        .nav-icon-btn {
            position: relative;
            width: 38px;
            height: 38px;
            border: none;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.06);
            color: #f5f5f7;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            opacity: 1;
            transform: scale(1);
            flex-shrink: 0;
            transition:
                width 1.4s cubic-bezier(0.22, 1, 0.36, 1),
                margin 1.4s cubic-bezier(0.22, 1, 0.36, 1),
                background-color 0.25s ease,
                transform 1.25s cubic-bezier(0.22, 1, 0.36, 1),
                opacity 1.05s cubic-bezier(0.22, 1, 0.36, 1);
        }

        .nav-icon-btn:hover {
            background: rgba(255, 255, 255, 0.16);
        }

        .nav-icon-btn:active {
            transform: scale(0.92);
        }

        .nav-icon-btn svg {
            width: 20px;
            height: 20px;
            stroke: currentColor;
            fill: none;
            stroke-width: 1.9;
            stroke-linecap: round;
            stroke-linejoin: round;
            flex-shrink: 0;
        }

        #btn-account {
            width: 38px;
            opacity: 1;
            transform: scale(1);
            overflow: hidden;
        }

        .site-header.compact-left #btn-account {
            width: 0px;
            margin-left: -6px;
            opacity: 0;
            transform: scale(0.55);
            pointer-events: none;
        }

        #btn-history {
            width: 0px;
            margin-left: -6px;
            opacity: 0;
            transform: scale(0.6);
            overflow: hidden;
            pointer-events: none;
        }

        .site-header.compact-left #btn-history {
            width: 38px;
            margin-left: 0px;
            opacity: 1;
            transform: scale(1);
            overflow: visible;
            pointer-events: auto;
        }

        @keyframes bellRingSwing {
            0%   { transform: rotate(0deg); }
            12%  { transform: rotate(18deg); }
            24%  { transform: rotate(-16deg); }
            36%  { transform: rotate(14deg); }
            48%  { transform: rotate(-12deg); }
            60%  { transform: rotate(9deg); }
            72%  { transform: rotate(-6deg); }
            84%  { transform: rotate(3deg); }
            100% { transform: rotate(0deg); }
        }

        #btn-notify svg {
            transform-origin: top center;
        }

        #btn-notify.ringing svg {
            animation: bellRingSwing 0.95s cubic-bezier(0.36, 0.07, 0.19, 0.97) both;
            color: #ffd60a;
        }

        .notify-badge {
            position: absolute;
            top: 0px;
            right: -1px;
            min-width: 17px;
            height: 17px;
            padding: 0 4px;
            border-radius: 999px;
            background-color: #ff453a;
            border: 1.5px solid #ff3b30;
            color: #ffffff;
            font-size: 10px;
            font-weight: 700;
            line-height: 14px;
            text-align: center;
            box-sizing: border-box;
            box-shadow: 0 0 0 1.5px rgba(255, 69, 58, 0.45);
        }

        /* ================= OVERLAY TÌM KIẾM LIQUID GLASS ================= */
        .kpazz-search-overlay {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -46%) scale(0.96);
            width: calc(100% - 28px);
            max-width: 580px;
            max-height: 76vh;
            display: flex;
            flex-direction: column;
            border-radius: 24px;
            padding: 16px;
            box-sizing: border-box;
            background: linear-gradient(
                145deg,
                rgba(255, 255, 255, 0.16) 0%,
                rgba(18, 20, 28, 0.94) 55%,
                rgba(255, 255, 255, 0.08) 100%
            );
            backdrop-filter: blur(30px) saturate(210%);
            -webkit-backdrop-filter: blur(30px) saturate(210%);
            border: 1px solid rgba(255, 255, 255, 0.26);
            box-shadow:
                0 24px 64px rgba(0, 0, 0, 0.78),
                inset 0 1px 1px rgba(255, 255, 255, 0.42);
            z-index: 1030;
            opacity: 0;
            pointer-events: none;
            visibility: hidden;
            transition: opacity 0.28s ease, transform 0.36s cubic-bezier(0.22, 1, 0.36, 1), visibility 0.36s ease;
        }

        .kpazz-search-overlay.active {
            opacity: 1;
            transform: translate(-50%, -50%) scale(1);
            pointer-events: auto;
            visibility: visible;
        }

        .kpazz-search-top {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 8px;
        }

        .kpazz-search-input-wrap {
            flex: 1;
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 9px 13px;
            border-radius: 14px;
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.16);
        }

        .kpazz-search-input {
            width: 100%;
            border: none;
            background: transparent;
            color: #ffffff;

            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -46%) scale(0.96);

            max-height: 72vh;
            overflow-y: auto;
            border-radius: 24px;

                rgba(18, 20, 28, 0.92) 55%,

            box-shadow:
                0 24px 64px rgba(0, 0, 0, 0.75),
                inset 0 1px 1px rgba(255, 255, 255, 0.42);

            pointer-events: none;
            visibility: hidden;
            transition: opacity 0.28s ease, transform 0.38s cubic-bezier(0.22, 1, 0.36, 1), visibility 0.38s ease;
        }

        .activity-history-panel.active {
            opacity: 1;
            transform: translate(-50%, -50%) scale(1);
            pointer-events: auto;
            visibility: visible;
        }

        .activity-panel-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-bottom: 10px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.12);
            margin-bottom: 12px;
        }

            margin: 0;
            font-size: 1rem;
            font-weight: 700;
            color: #ffffff;
        }

        .activity-panel-actions {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .activity-section-label {
            font-size: 12px;
            font-weight: 600;

            margin: 10px 0 6px;

            border-radius: 14px;
            background: rgba(255, 255, 255, 0.05);

            display: flex;
            flex-direction: column;

            cursor: pointer;
            overflow: hidden;
            max-height: 120px;
            opacity: 1;
            transform: translateX(0) scale(1);
            transition:
                background-color 0.2s ease,
                opacity 0.32s cubic-bezier(0.22, 1, 0.36, 1),
                transform 0.32s cubic-bezier(0.22, 1, 0.36, 1),
                max-height 0.34s cubic-bezier(0.22, 1, 0.36, 1),
                margin-bottom 0.34s cubic-bezier(0.22, 1, 0.36, 1),
                padding 0.34s cubic-bezier(0.22, 1, 0.36, 1);

            gap: 8px;

        }

        .kpazz-remember-label {
            display: inline-flex;
            align-items: center;

            user-select: none;
        }

        .kpazz-link-btn {
            border: none;
            background: transparent;

        /* ================= NỘI DUNG CHÍNH ================= */
        main {

        <div id="tabs-container">

    <footer class="site-footer">
        <p>&copy; 2026 Bản quyền thuộc về Kpazz.</p>
    </footer>

    <script>
        let CURRENT_TABS_DIR = "Tabs/";
        let DISCOVERED_TAB_FILES = [];
        let CACHED_JSON_ENTRIES = null;
        let CACHED_JSON_RAW_BY_URL = new Map();
        let INFLIGHT_JSON_PROMISE = null;
        let PANEL_MODE = "history"; // "history" | "recent-updates"

        const VIEWED_HISTORY_KEY = "kpazz_viewed_history_v1";
        const DOWNLOAD_HISTORY_KEY = "kpazz_download_history_v1";
        const SEARCH_HISTORY_KEY = "kpazz_search_history_v1";
        const THEME_OVERRIDE_KEY = "kpazz_theme_override_v1";
        const AUTH_USERS_KEY = "kpazz_auth_users_v1";
        const AUTH_SESSION_KEY = "kpazz_auth_session_v1";
        const AUTH_REMEMBER_KEY = "kpazz_auth_remember_v1";
        const NOTIFY_SEEN_KEYS_KEY = "kpazz_notify_seen_keys_v1";
        const NOTIFY_DISMISSED_KEYS_KEY = "kpazz_notify_dismissed_keys_v1";
        const TOOLTIP_SUGGESTIONS_KEY = "kpazz_tooltip_suggestions_v1";

        const ITEM_STORE = new Map();
        function saveItemRef(item) {
            if (!item) return "";
            const key = `item_${ITEM_STORE.size + 1}_${Math.random().toString(36).slice(2, 7)}`;
            ITEM_STORE.set(key, item);
            return key;
        }
        function getItemRef(key) {
            return ITEM_STORE.get(key) || null;
        }

        function withFreshQuery(url) {
            if (!url || typeof url !== "string") return url;
            if (/^(?:data:|blob:|javascript:|mailto:|tel:|#)/i.test(url)) return url;
            const sep = url.includes("?") ? "&" : "?";
            return `${url}${sep}_t=${Date.now()}_${Math.random().toString(36).slice(2, 6)}`;
        }

        function fetchFresh(url, options = {}) {
            return fetch(withFreshQuery(url), {
                ...options,
                cache: "no-store"
            });
        }

        async function fetchWithTimeout(url, timeoutMs = 2500) {
            const controller = typeof AbortController !== "undefined" ? new AbortController() : null;
            const timer = controller ? setTimeout(() => controller.abort(), timeoutMs) : null;
            try {
                return await fetchFresh(url, controller ? { signal: controller.signal } : {});
            } finally {
                if (timer) clearTimeout(timer);
            }
        }

        function invalidateJsonCache() {
            CACHED_JSON_ENTRIES = null;
            CACHED_JSON_RAW_BY_URL = new Map();
            INFLIGHT_JSON_PROMISE = null;
        }

        /* ================= NHẬN DẠNG POPUP CARD THEO CẤU TRÚC SECTION TWEAK ================= */
        function getAllOpenSectionPopups() {
            const tabsContainer = document.getElementById("tabs-container");
            if (!tabsContainer) return [];
            const selector =
                "[id$='card-popup'], .tweak-popup-backdrop, .tweak-version-picker-backdrop, [class*='popup-backdrop'], [class*='card-popup']";
            return Array.from(tabsContainer.querySelectorAll(selector)).filter(el => {
                if (el.classList.contains("is-open") || el.classList.contains("active") || el.classList.contains("open")) {
                    return true;
                }
                const st = window.getComputedStyle(el);
                const rect = el.getBoundingClientRect();
                return (
                    (st.position === "fixed" || st.position === "absolute") &&
                    parseFloat(st.opacity || "1") > 0.05 &&
                    st.visibility !== "hidden" &&
                    st.display !== "none" &&
                    rect.width > 120 &&
                    rect.height > 120
                );
            });
        }

        function hasAnySectionPopupOpen() {
            return getAllOpenSectionPopups().length > 0;
        }

        function enforceVisibleSectionPopups() {
            getAllOpenSectionPopups().forEach(pop => {
                pop.style.position = "fixed";
                pop.style.inset = "0";
                pop.style.zIndex = pop.classList.contains("tweak-version-picker-backdrop") ? "1055" : "1040";
                pop.style.opacity = "1";
                pop.style.visibility = "visible";
                pop.style.pointerEvents = "auto";
            });
        }

        function updateBackdropState() {
            const backdrop = document.getElementById("popup-backdrop");
            if (!backdrop) return;
            const panel = document.getElementById("activity-history-panel");
            const authPopup = document.getElementById("account-auth-popup");
            const searchOverlay = document.getElementById("kpazz-search-overlay");
            const drawerMenu = document.getElementById("kpazz-drawer-menu");

            enforceVisibleSectionPopups();

            const isDrawerOpen = Boolean(drawerMenu && drawerMenu.classList.contains("active"));
            backdrop.classList.toggle("drawer-backdrop-deep", isDrawerOpen);

            const anyActive =
                (panel && panel.classList.contains("active")) ||
                (authPopup && authPopup.classList.contains("active")) ||
                (searchOverlay && searchOverlay.classList.contains("active")) ||
                isDrawerOpen ||
                hasAnySectionPopupOpen();

            backdrop.classList.toggle("active", Boolean(anyActive));
        }

        function getItemIdentityKey(item) {
            if (!item) return "";
            const raw = item.rawData && typeof item.rawData === "object" ? item.rawData : item;
            const title = String(raw.appName || item.title || raw.title || raw.name || "").trim().toLowerCase();
            const ver = String(raw.version || item.version || "").trim().toLowerCase();
            const dt = String(raw.releaseDate || item.dateText || raw.updatedAt || raw.date || "").trim().toLowerCase();
            const src = String(item.sourceFile || "").trim().toLowerCase();
            return `${src}|${title}|${ver}|${dt}`;
        }

        function setBellBadgeCount(count) {
            const badge = document.getElementById("notify-count-badge");
            if (!badge) return;
            const safeCount = Math.max(0, Number(count) || 0);
            badge.textContent = safeCount > 99 ? "99+" : String(safeCount);
            badge.classList.remove("is-zero");
        }

        function recordTooltipSuggestion(item) {
            if (!item || !item.title) return;
            const list = readJsonStorage(TOOLTIP_SUGGESTIONS_KEY, []);
            const key = getItemIdentityKey(item);
            if (!key) return;

            const dismissedSet = new Set(readJsonStorage(NOTIFY_DISMISSED_KEYS_KEY, []));
            if (dismissedSet.has(key)) {
                dismissedSet.delete(key);
                writeJsonStorage(NOTIFY_DISMISSED_KEYS_KEY, Array.from(dismissedSet));
            }

            const filtered = list.filter(x => getItemIdentityKey(x.item || x) !== key);
            filtered.unshift({
                ...item,
                isFromTooltip: true,
                dateText: item.dateText || new Date().toLocaleDateString("vi-VN"),
                tooltipTime: new Date().toLocaleString("vi-VN")
            });
            writeJsonStorage(TOOLTIP_SUGGESTIONS_KEY, filtered.slice(0, 30));
        }

        async function getNotificationFeedEntries(forceRefresh = false) {
            const entries = await loadAllJsonEntriesFromTabs(forceRefresh);
            const nowMs = Date.now();
            const oneMonthMs = 30 * 24 * 60 * 60 * 1000;
            const dismissedSet = new Set(readJsonStorage(NOTIFY_DISMISSED_KEYS_KEY, []));

            const recentMonthItems = entries
                .filter(entry => !/slide\.json$/i.test(entry.sourceFile || ""))
                .map(entry => ({ entry, ts: parseItemTimestamp(entry.dateText || entry.updatedAt) }))
                .filter(({ ts }) => !Number.isNaN(ts) && ts <= nowMs + 86400000 && (nowMs - ts) <= oneMonthMs)
                .sort((a, b) => b.ts - a.ts)
                .map(({ entry }) => entry);

            const tooltipItems = readJsonStorage(TOOLTIP_SUGGESTIONS_KEY, []);
            const tooltipKeySet = new Set(tooltipItems.map(t => getItemIdentityKey(t)));
            const mergedMap = new Map();

            recentMonthItems.forEach(item => {
                const k = getItemIdentityKey(item);
                if (k && !dismissedSet.has(k) && !mergedMap.has(k)) {
                    mergedMap.set(k, { ...item, isFromTooltip: tooltipKeySet.has(k) });
                }
            });

            tooltipItems.forEach(item => {
                const k = getItemIdentityKey(item);
                if (k && !dismissedSet.has(k) && !mergedMap.has(k)) {
                    mergedMap.set(k, { ...item, isFromTooltip: true });
                }
            });

            return Array.from(mergedMap.values());
        }

        async function refreshUnreadNewUpdatesBadge(forceRefresh = false) {
            const feedItems = await getNotificationFeedEntries(forceRefresh);
            const seenSet = new Set(readJsonStorage(NOTIFY_SEEN_KEYS_KEY, []));
            const unreadUpdatesCount = feedItems.filter(item => !seenSet.has(getItemIdentityKey(item))).length;
            const tooltipCount = readJsonStorage(TOOLTIP_SUGGESTIONS_KEY, []).filter(t => {
                const k = getItemIdentityKey(t);
                const dismissedSet = new Set(readJsonStorage(NOTIFY_DISMISSED_KEYS_KEY, []));
                return k && !dismissedSet.has(k);
            }).length;
            setBellBadgeCount(unreadUpdatesCount + tooltipCount);
            return feedItems;
        }

        async function markAllRecentUpdatesSeenAndResetBadge(forceRefresh = true) {
            const feedItems = await getNotificationFeedEntries(forceRefresh);
            const seenSet = new Set(readJsonStorage(NOTIFY_SEEN_KEYS_KEY, []));
            feedItems.forEach(item => {
                const k = getItemIdentityKey(item);
                if (k) seenSet.add(k);
            });
            writeJsonStorage(NOTIFY_SEEN_KEYS_KEY, Array.from(seenSet).slice(-300));
            setBellBadgeCount(0);
            return feedItems;
        }

        /* ================= DÙNG CHÍNH POPUP CARD CỦA SECTION HTML (THEO CẤU TRÚC TWEAK POPUP) ================= */
        function findSectionElementForItem(item) {
            const tabsContainer = document.getElementById("tabs-container");
            if (!tabsContainer) return null;
            const sections = Array.from(tabsContainer.querySelectorAll("section.tab-section"));
            if (!sections.length) return null;

            const srcFile = String(item?.sourceFile || "").trim().toLowerCase();
            if (srcFile) {
                const baseJson = srcFile.split("/").pop().replace(/\.json$/i, "").toLowerCase();
                for (const sec of sections) {
                    const secSource = String(sec.dataset.sourceFile || "").toLowerCase();
                    const secTabFile = String(sec.dataset.tabFile || "").toLowerCase();
                    const secMatchedJson = String(sec.dataset.matchedJson || "").toLowerCase();
                    if (
                        secMatchedJson.includes(srcFile) ||
                        (baseJson && (secTabFile.startsWith(baseJson + ".") || secSource.includes("/" + baseJson)))
                    ) {
                        return sec;
                    }
                }
            }

            const raw = item?.rawData && typeof item.rawData === "object" ? item.rawData : item;
            const targetTitle = String(raw?.appName || item?.title || raw?.title || raw?.name || "").trim().toLowerCase();
            if (targetTitle) {
                for (const sec of sections) {
                    const cards = Array.from(
                        sec.querySelectorAll(".tweak-col-app-row, .tweak-game-card, article, .card, .app-card, .tweak-card, .item-card, .grid-item, [data-title], [data-name]")
                    );
                    for (const c of cards) {
                        if (c.closest("[id$='card-popup'], .tweak-popup-backdrop, .tweak-version-picker-backdrop, [class*='popup-backdrop'], [class*='card-popup']")) continue;
                        const attrT = String(c.dataset.title || c.dataset.name || "").trim().toLowerCase();
                        const txt = String(c.textContent || "").toLowerCase();
                        if ((attrT && attrT === targetTitle) || txt.includes(targetTitle)) {
                            return sec;
                        }
                    }
                }
            }

            return sections[0];
        }

        function findPopupRootInSection(sectionEl) {
            if (!sectionEl) return null;
            return (
                sectionEl.querySelector("[id$='card-popup']") ||
                sectionEl.querySelector(".tweak-popup-backdrop") ||
                sectionEl.querySelector("[class*='popup-backdrop']") ||
                sectionEl.querySelector("[class*='card-popup']") ||
                null
            );
        }

        function findMatchingCardInSection(sectionEl, item) {
            if (!sectionEl || !item) return null;
            const raw = item.rawData && typeof item.rawData === "object" ? item.rawData : item;
            const targetTitle = String(raw.appName || item.title || raw.title || raw.name || "").trim().toLowerCase();
            if (!targetTitle) return null;

            const candidates = Array.from(
                sectionEl.querySelectorAll(".tweak-col-app-row, .tweak-game-card, article, .card, .app-card, .tweak-card, .item-card, .grid-item, [data-title], [data-name]")
            ).filter(el => !el.closest("[id$='card-popup'], .tweak-popup-backdrop, .tweak-version-picker-backdrop, [class*='popup-backdrop'], [class*='card-popup']"));

            for (const el of candidates) {
                const attrTitle = String(el.dataset.title || el.dataset.name || "").trim().toLowerCase();
                if (attrTitle && attrTitle === targetTitle) return el;
            }

            for (const el of candidates) {
                const heading = el.querySelector(".tweak-col-app-name, h1, h2, h3, h4, .title, .app-name, .card-title, .name");
                const hText = String(heading?.textContent || "").trim().toLowerCase();
                if (hText && hText === targetTitle) return el;
            }

            for (const el of candidates) {
                const text = String(el.textContent || "").toLowerCase();
                if (text.includes(targetTitle)) return el;
            }

            return candidates[0] || null;
        }

        function resetPopupElementState(pop) {
            if (!pop) return;
            pop.classList.remove("is-open", "active", "open");
            pop.setAttribute("aria-hidden", "true");
            pop.style.position = "";
            pop.style.inset = "";
            pop.style.zIndex = "";
            pop.style.opacity = "";
            pop.style.visibility = "";
            pop.style.pointerEvents = "";
            pop.style.display = "";
            document.body.style.overflow = "";
        }

        function closeAllSectionCardPopups() {
            const tabsContainer = document.getElementById("tabs-container");
            if (tabsContainer) {
                tabsContainer.querySelectorAll(
                    "[id$='card-popup'], .tweak-popup-backdrop, .tweak-version-picker-backdrop, [class*='popup-backdrop'], [class*='card-popup']"
                ).forEach(resetPopupElementState);
            }
            updateBackdropState();
        }

        function triggerNativeCardClick(cardEl) {
            if (!cardEl) return false;
            const clickable = cardEl.matches("button, a, [role='button']")
                ? cardEl
                : (cardEl.querySelector("button, a, [role='button']") || cardEl);

            if (typeof clickable.click === "function") {
                clickable.click();
            } else {
                clickable.dispatchEvent(new MouseEvent("click", { bubbles: true, cancelable: true, view: window }));
            }
            return true;
        }

        function closeTweakVersionPickerIfOpen(sectionEl) {
            const tabsContainer = document.getElementById("tabs-container");
            const pickers = [];
            if (sectionEl) {
                pickers.push(...sectionEl.querySelectorAll(".tweak-version-picker-backdrop"));
            }
            if (tabsContainer) {
                pickers.push(...tabsContainer.querySelectorAll(".tweak-version-picker-backdrop"));
            }
            pickers.forEach(picker => {
                resetPopupElementState(picker);
            });
        }

        function hydratePopupFromSectionStructure(sectionEl, item) {
            const popRoot = findPopupRootInSection(sectionEl);
            if (!popRoot || !item) return;
            const raw = item.rawData && typeof item.rawData === "object" ? item.rawData : item;

            const titleVal = String(raw.appName || item.title || raw.title || raw.name || "").trim();
            const subVal = String(raw.description || raw.subtitle || item.content || raw.genre || "").trim();
            const authorVal = String(raw.author || item.author || "Đang cập nhật").trim();
            const genreVal = String(raw.genre || item.category || "Ứng dụng").trim();
            const dateVal = String(raw.releaseDate || item.dateText || "Đang cập nhật").trim();
            const formatVal = String(raw.fileFormat || "Đang cập nhật").trim();
            const sizeVal = String(raw.fileSize || item.size || "Đang cập nhật").trim();
            const verVal = String(raw.version || item.version || "Phiên bản").trim();
            const changelogVal = String(raw.changelog || "Chưa có ghi chú cập nhật mới.").trim();
            const descVal = String(raw.fullDescription || raw.description || item.content || "Đang cập nhật mô tả.").trim();
            const reqVal = String(
                raw.systemRequirement || raw.osRequirement || raw.requirements || raw.requirement || raw.iosVersion || raw.minOs || "Đang cập nhật"
            ).trim();
            const iconVal = String(raw.icon || raw.img || item.icon || "").trim();
            const bannerVal = String(raw.banner || iconVal).trim();

            const setTextBySuffix = (suffix, val) => {
                const el = popRoot.querySelector(`[id$='${suffix}']`);
                if (el) el.textContent = val;
            };
            const setImgBySuffix = (suffix, val) => {
                const img = popRoot.querySelector(`img[id$='${suffix}']`);
                if (img && val) img.src = val;
            };

            setImgBySuffix("popup-banner", bannerVal);
            setImgBySuffix("popup-icon", iconVal);
            setImgBySuffix("popup-sticky-icon", iconVal);

            setTextBySuffix("popup-title", titleVal);
            setTextBySuffix("popup-subtitle", subVal);
            setTextBySuffix("popup-sticky-title", titleVal);
            setTextBySuffix("popup-sticky-sub", subVal);
            setTextBySuffix("popup-genre-badge", genreVal);
            setTextBySuffix("popup-version", verVal);

            setTextBySuffix("popup-author", authorVal);
            setTextBySuffix("popup-genre", genreVal);
            setTextBySuffix("popup-date", dateVal);
            setTextBySuffix("popup-format", formatVal);
            setTextBySuffix("popup-size", sizeVal);

            setTextBySuffix("popup-changelog-version", verVal);
            setTextBySuffix("popup-changelog", changelogVal);
            setTextBySuffix("popup-desc", descVal);

            setTextBySuffix("info-provider", authorVal);
            setTextBySuffix("info-size", sizeVal);
            setTextBySuffix("info-genre", genreVal);
            setTextBySuffix("info-format", formatVal);
            setTextBySuffix("info-date", dateVal);
            setTextBySuffix("info-version", verVal);
            setTextBySuffix("info-requirement", reqVal);
        }

        async function openSectionCardPopup(item, options = {}) {
            if (!item) return;

            const entries = await loadAllJsonEntriesFromTabs(false);
            const raw = item.rawData && typeof item.rawData === "object" ? item.rawData : item;
            const targetTitle = String(raw.appName || item.title || raw.title || raw.name || "").trim().toLowerCase();
            const matchedJsonEntry = targetTitle
                ? (entries.find(e => String(e.title || "").trim().toLowerCase() === targetTitle) || item)
                : item;

            const sectionEl = findSectionElementForItem(matchedJsonEntry);
            const matchedCard = findMatchingCardInSection(sectionEl, matchedJsonEntry);

            if (matchedCard) {
                triggerNativeCardClick(matchedCard);
                setTimeout(() => {
                    closeTweakVersionPickerIfOpen(sectionEl);
                    const activePop = findPopupRootInSection(sectionEl);
                    if (activePop) {
                        hydratePopupFromSectionStructure(sectionEl, matchedJsonEntry);
                        activePop.classList.add("is-open", "active", "open");
                        activePop.setAttribute("aria-hidden", "false");
                    }
                    updateBackdropState();
                }, 40);
                setTimeout(() => {
                    closeTweakVersionPickerIfOpen(sectionEl);
                    updateBackdropState();
                }, 140);
            } else {
                const popupRoot = findPopupRootInSection(sectionEl);
                if (popupRoot) {
                    closeTweakVersionPickerIfOpen(sectionEl);
                    hydratePopupFromSectionStructure(sectionEl, matchedJsonEntry);
                    popupRoot.classList.add("is-open", "active", "open");
                    popupRoot.setAttribute("aria-hidden", "false");
                    updateBackdropState();
                }
            }

            if (options.trackView !== false) {
                const mRaw = matchedJsonEntry.rawData && typeof matchedJsonEntry.rawData === "object" ? matchedJsonEntry.rawData : matchedJsonEntry;
                const title = mRaw.appName || matchedJsonEntry.title || matchedJsonEntry.name || "Chi tiết nội dung";
                const url = mRaw.buttonUrl || mRaw.downloadUrl || mRaw.url || matchedJsonEntry.link || "";

        function extractFieldValue(obj, keys = []) {
            if (!obj || typeof obj !== "object") return "";
            for (const k of keys) {
                const v = obj[k];
                if (v === undefined || v === null) continue;
                if (typeof v === "string" || typeof v === "number") {
                    const s = String(v).trim();
                    if (s) return s;
                } else if (Array.isArray(v)) {
                    const joined = v
                        .map(x => (typeof x === "object" && x !== null ? (x.text || x.label || x.title || x.name || x.value || "") : String(x || "")))
                        .map(s => s.trim())
                        .filter(Boolean)
                        .join("\n");
                    if (joined) return joined;
                } else if (typeof v === "object") {
                    const nested = extractFieldValue(v, ["text", "label", "title", "name", "value", "description", "desc"]);
                    if (nested) return nested;
                }
            }
            for (const val of Object.values(obj)) {
                if (val && typeof val === "object" && !Array.isArray(val)) {
                    const found = extractFieldValue(val, keys);
                    if (found) return found;
                }
            }
            return "";
        }

        function truncateToFiveWords(text = "") {
            const words = String(text || "")
                .trim()
                .replace(/\s+/g, " ")
                .split(" ")
                .filter(Boolean);
            if (!words.length) return "";
            if (words.length <= 5) return words.join(" ");
            return `${words.slice(0, 5).join(" ")}...`;
        }

        function getJsonBaseKey(sourceFile = "") {
            return String(sourceFile || "")
                .split("/")
                .pop()
                .replace(/\.json$/i, "")
                .trim()
                .toLowerCase();
        }

        function findSectionSubtitleInNode(node) {
            if (!node || typeof node !== "object") return "";
            if (Array.isArray(node)) {
                for (const item of node) {
                    const found = findSectionSubtitleInNode(item);
                    if (found) return found;
                }
                return "";
            }
            for (const key of ["sectionSubtitle", "sectionSubTitle", "section_subtitle", "subtitle"]) {
                if (typeof node[key] === "string" && node[key].trim()) {
                    return node[key].trim();
                }
            }
            for (const val of Object.values(node)) {
                if (val && typeof val === "object") {
                    const found = findSectionSubtitleInNode(val);
                    if (found) return found;
                }
            }
            return "";
        }

        function collectSectionGroupsFromJson(node, sourceFile, tabsDir, currentTitle = "", currentSubtitle = "", out = []) {
            if (!node || typeof node !== "object") return out;

            if (Array.isArray(node)) {
                node.forEach(item => collectSectionGroupsFromJson(item, sourceFile, tabsDir, currentTitle, currentSubtitle, out));
                return out;
            }

            const nextTitle =
                typeof node.sectionTitle === "string" && node.sectionTitle.trim()
                    ? node.sectionTitle.trim()
                    : currentTitle;

            const rawSub = extractFieldValue(node, ["sectionSubtitle", "sectionSubTitle", "section_subtitle"]);
            const nextSubtitle = rawSub ? String(rawSub).trim() : currentSubtitle;

            const hasItemFields = Boolean(node.title || node.name || node.appName || node.tweakName);
            if (hasItemFields && nextTitle) {
                let group = out.find(g => g.title.toLowerCase() === nextTitle.toLowerCase() && g.sourceFile === sourceFile);
                if (!group) {
                    group = { title: nextTitle, subtitle: nextSubtitle, sourceFile, items: [] };
                    out.push(group);
                } else if (!group.subtitle && nextSubtitle) {
                    group.subtitle = nextSubtitle;
                }
                const title = String(node.title || node.name || node.appName || node.tweakName || "").trim();
                const author = extractFieldValue(node, ["author", "developer", "creator", "by", "vendor", "provider", "publisher"]) || "";
                const version = extractFieldValue(node, ["version", "ver", "appVersion"]) || "";
                const category = extractFieldValue(node, ["category", "type", "genre", "tab"]) || "";
                const sizeText = extractFieldValue(node, ["size", "fileSize", "filesize", "appSize"]) || "";
                const content = extractFieldValue(node, ["fullDescription", "longDescription", "details", "about", "notes", "description", "desc", "content", "subtitle", "summary"]) || "";
                const link = node.url || node.link || node.download || node.downloadUrl || node.buttonUrl || node.ipa || node.deb || "#";
                const rawIcon = extractFieldValue(node, ["icon", "image", "img", "thumbnail", "cover", "logo"]) || "";
                const dateText = extractFieldValue(node, ["updatedAt", "updated_at", "lastUpdated", "releaseDate", "date", "createdAt", "time"]) || "";

                const dup = group.items.some(it => it.title.toLowerCase() === title.toLowerCase());
                if (title && !dup) {
                    group.items.push({
                        title,
                        author: String(author),
                        version: String(version),
                        category: String(category),
                        size: String(sizeText),
                        content: String(content),
                        link: String(link),
                        icon: rawIcon ? resolveTabRelativeUrl(String(rawIcon), tabsDir) : "",
                        dateText: String(dateText),
                        sourceFile,
                        rawData: node
                    });
                }
            }

            Object.values(node).forEach(val => {
                if (val && typeof val === "object") {
                    collectSectionGroupsFromJson(val, sourceFile, tabsDir, nextTitle, nextSubtitle, out);
                }
            });

            return out;
        }

        async function getOrderedSectionGroupsFromTabs() {
            await loadAllJsonEntriesFromTabs(false);
            const tabsContainer = document.getElementById("tabs-container");
            const orderedSections = tabsContainer
                ? Array.from(tabsContainer.querySelectorAll("section.tab-section")).sort(
                    (a, b) => (Number(a.style.order) || 999) - (Number(b.style.order) || 999)
                )
                : [];

            const groups = [];
            const seen = new Set();

            const addGroup = (g, fallbackSubtitle) => {
                const key = `${g.title.toLowerCase()}|${getJsonBaseKey(g.sourceFile)}`;
                if (seen.has(key)) return;
                seen.add(key);
                groups.push({
                    ...g,
                    subtitle: g.subtitle || fallbackSubtitle || ""
                });
            };

            orderedSections.forEach(sec => {
                const baseKey = getJsonBaseKey(String(sec.dataset.sourceFile || "") || sec.dataset.tabFile || "");

                for (const [url, rawJson] of CACHED_JSON_RAW_BY_URL.entries()) {
                    const urlKey = getJsonBaseKey(url);
                    if (baseKey && urlKey && (urlKey === baseKey || urlKey.startsWith(baseKey))) {
                        const rootSub = findSectionSubtitleInNode(rawJson);
                        collectSectionGroupsFromJson(rawJson, url, CURRENT_TABS_DIR, "", rootSub, []).forEach(g => addGroup(g, rootSub));
                    }
                }
            });

            if (!groups.length) {
                for (const [url, rawJson] of CACHED_JSON_RAW_BY_URL.entries()) {
                    const rootSub = findSectionSubtitleInNode(rawJson);
                    collectSectionGroupsFromJson(rawJson, url, CURRENT_TABS_DIR, "", rootSub, []).forEach(g => addGroup(g, rootSub));
                }
            }

            return groups;
        }

            const registerStatus = document.getElementById("register-status-msg");
            const rememberCheck = document.getElementById("login-remember-check");
            const forgotBtn = document.getElementById("btn-forgot-password");

            if (!btnAccount || !authPopup) return;

            function switchAuthTab(mode) {
                const isRegister = mode === "register";
                if (tabLogin) {
                    tabLogin.classList.toggle("active", !isRegister);
                    tabLogin.setAttribute("aria-selected", String(!isRegister));
                }
                if (tabRegister) {
                    tabRegister.classList.toggle("active", isRegister);
                    tabRegister.setAttribute("aria-selected", String(isRegister));
                }
                if (formLogin) formLogin.style.display = isRegister ? "none" : "flex";
                if (formRegister) formRegister.style.display = isRegister ? "flex" : "none";
                if (headingEl) {
                    headingEl.textContent = isRegister ? "Đăng ký tài khoản" : "Đăng nhập tài khoản";
                }
                if (loginStatus) loginStatus.textContent = "";
                if (registerStatus) registerStatus.textContent = "";
            }

            function loadRememberedLogin() {
                try {
                    const raw = localStorage.getItem(AUTH_REMEMBER_KEY);
                    if (!raw) return;
                    const saved = JSON.parse(raw);
                    const uInput = document.getElementById("login-username");
                    const pInput = document.getElementById("login-password");
                    if (saved && saved.username && uInput) uInput.value = saved.username;
                    if (saved && saved.password && pInput) pInput.value = saved.password;
                    if (rememberCheck) rememberCheck.checked = true;
                } catch (_) {}
            }

            function openAuthPopup(initialMode = "login") {
                switchAuthTab(initialMode);
                loadRememberedLogin();
                authPopup.classList.add("active");
                updateBackdropState();
            }

            window.openKpazzAuthPopup = openAuthPopup;

            function closeAuthPopup() {
                authPopup.classList.remove("active");
                updateBackdropState();
            }

            btnAccount.addEventListener("click", (e) => {
                e.stopPropagation();
                if (authPopup.classList.contains("active")) {
                    closeAuthPopup();
                } else {
                    openAuthPopup("login");
                }
            });

            if (tabLogin) tabLogin.addEventListener("click", () => switchAuthTab("login"));
            if (tabRegister) tabRegister.addEventListener("click", () => switchAuthTab("register"));
            if (btnClose) {
                btnClose.addEventListener("click", (e) => {
                    e.stopPropagation();
                    closeAuthPopup();
                });
            }
            if (backdrop) backdrop.addEventListener("click", () => closeAuthPopup());
            document.addEventListener("keydown", (e) => {
                if (e.key === "Escape" && authPopup.classList.contains("active")) {
                    closeAuthPopup();
                }
            });

            if (forgotBtn) {
                forgotBtn.addEventListener("click", () => {
                    const currentUser = (document.getElementById("login-username")?.value || "").trim();
                    if (loginStatus) {
                        loginStatus.textContent = currentUser
                            ? `Đã gửi hướng dẫn khôi phục mật khẩu cho "${currentUser}".`
                            : "Vui lòng nhập tên đăng nhập hoặc số điện thoại để khôi phục mật khẩu.";
                    }
                });
            }

            if (formLogin) {
                formLogin.addEventListener("submit", (e) => {
                    e.preventDefault();
                    const userVal = (document.getElementById("login-username")?.value || "").trim();
                    const passVal = (document.getElementById("login-password")?.value || "").trim();
                    if (!userVal || !passVal) return;

                    const users = readJsonStorage(AUTH_USERS_KEY, []);
                    const matched = users.find(
                        u => (u.username.toLowerCase() === userVal.toLowerCase() || String(u.phone || "").toLowerCase() === userVal.toLowerCase()) && u.password === passVal
                    );

                    try {
                        if (rememberCheck && rememberCheck.checked) {
                            localStorage.setItem(AUTH_REMEMBER_KEY, JSON.stringify({ username: userVal, password: passVal }));
                        } else {
                            localStorage.removeItem(AUTH_REMEMBER_KEY);
                        }
                    } catch (_) {}

                    if (matched) {
                        writeJsonStorage(AUTH_SESSION_KEY, { username: matched.username, phone: matched.phone, loggedAt: new Date().toLocaleString("vi-VN") });
                        if (loginStatus) loginStatus.textContent = `Đăng nhập thành công: ${matched.username}`;
                    } else {
                        writeJsonStorage(AUTH_SESSION_KEY, { username: userVal, phone: userVal, loggedAt: new Date().toLocaleString("vi-VN") });
                        if (loginStatus) loginStatus.textContent = `Đã ghi nhận phiên đăng nhập: ${userVal}`;
                    }
                });
            }

            if (formRegister) {
                formRegister.addEventListener("submit", (e) => {
                    e.preventDefault();
                    const uName = (document.getElementById("register-username")?.value || "").trim();
                    const uPhone = (document.getElementById("register-phone")?.value || "").trim();
                    const uPass = (document.getElementById("register-password")?.value || "").trim();
                    if (!uName || !uPhone || !uPass) return;

                    if (uPass.length < 6) {
                        if (registerStatus) registerStatus.textContent = "Mật khẩu cần tối thiểu 6 ký tự.";
                        return;
                    }

                    const users = readJsonStorage(AUTH_USERS_KEY, []);
                    const exists = users.some(u => u.username.toLowerCase() === uName.toLowerCase() || String(u.phone || "") === uPhone);
                    if (exists) {
                        if (registerStatus) registerStatus.textContent = "Tên tài khoản hoặc Số điện thoại đã tồn tại.";
                        return;
                    }

                    users.push({ username: uName, phone: uPhone, password: uPass });
                    writeJsonStorage(AUTH_USERS_KEY, users);
                    writeJsonStorage(AUTH_SESSION_KEY, { username: uName, phone: uPhone, loggedAt: new Date().toLocaleString("vi-VN") });
                    if (registerStatus) registerStatus.textContent = `Đăng ký thành công tài khoản ${uName}!`;
                });
            }
        })();

        (function initAutoPlus7AndManualTheme() {
            const brandToggle = document.getElementById("brand-theme-toggle");

            function getPlus7Hour() {
                const now = new Date();
                const utcMs = now.getTime() + now.getTimezoneOffset() * 60000;
                const plus7Date = new Date(utcMs + 7 * 3600000);
                return plus7Date.getHours();
            }

            function isDaytimePlus7() {
                const hour = getPlus7Hour();
                return hour >= 6 && hour < 18;
            }

            function applyTheme(isLight) {
                document.body.classList.toggle("light-theme", Boolean(isLight));
            }

            function syncThemeFromStorageOrClock() {
                let manualMode = null;
                try {
                    manualMode = localStorage.getItem(THEME_OVERRIDE_KEY);
                } catch (_) {}

                if (manualMode === "light") {
                    applyTheme(true);
                } else if (manualMode === "dark") {
                    applyTheme(false);
                } else {
                    applyTheme(isDaytimePlus7());
                }
            }

            if (brandToggle) {
                const toggleManual = (e) => {
                    e.preventDefault();
                    e.stopPropagation();
                    const nextIsLight = !document.body.classList.contains("light-theme");
                    applyTheme(nextIsLight);
                    try {
                        localStorage.setItem(THEME_OVERRIDE_KEY, nextIsLight ? "light" : "dark");
                    } catch (_) {}
                };

                brandToggle.addEventListener("click", toggleManual);
                brandToggle.addEventListener("keydown", (e) => {
                    if (e.key === "Enter" || e.key === " ") {
                        toggleManual(e);
                    }
                });
            }

            syncThemeFromStorageOrClock();
            setInterval(syncThemeFromStorageOrClock, 60000);
        })();

        function readJsonStorage(key, fallback = []) {
            try {
                const raw = localStorage.getItem(key);
                const parsed = raw ? JSON.parse(raw) : fallback;
                return Array.isArray(parsed) ? parsed : fallback;
            } catch (_) {
                return fallback;
            }
        }

        function writeJsonStorage(key, value) {
            try {
                localStorage.setItem(key, JSON.stringify(value));
            } catch (_) {}
        }

        function isDownloadTarget(nameOrUrl = "") {
            const lower = String(nameOrUrl).toLowerCase();
            return /\.(ipa|deb|apk|zip|rar|7z|tar|gz|pdf|mp3|mp4|dmg|exe|json)(\?|#|$)/i.test(lower) ||
                /download|\/dl\/|get_deb|ipa/i.test(lower);
        }

        function recordViewedItem(title, url = "", fullItem = null) {
            const cleanTitle = String(title || "").trim();
            if (!cleanTitle) return;
            const timeStr = new Date().toLocaleString("vi-VN");
            const list = readJsonStorage(VIEWED_HISTORY_KEY, []);
            const existing = list.find(item => item.title === cleanTitle);
            const mergedItem = fullItem || existing?.item || { title: cleanTitle, link: String(url || "") };
            const filtered = list.filter(item => item.title !== cleanTitle);
            filtered.unshift({
                title: cleanTitle,
                url: String(url || mergedItem.link || ""),
                time: timeStr,
                item: mergedItem
            });
            writeJsonStorage(VIEWED_HISTORY_KEY, filtered.slice(0, 25));
        }

        function recordDownloadedItem(name, url = "", fullItem = null) {
            const cleanName = String(name || "").trim();
            if (!cleanName) return;
            const timeStr = new Date().toLocaleString("vi-VN");
            const list = readJsonStorage(DOWNLOAD_HISTORY_KEY, []);
            const existing = list.find(item => item.name === cleanName || item.url === url);
            const mergedItem = fullItem || existing?.item || { title: cleanName, link: String(url || "") };
            const filtered = list.filter(item => item.name !== cleanName || item.url !== url);
            filtered.unshift({
                name: cleanName,
                url: String(url || mergedItem.link || ""),
                time: timeStr,
                item: mergedItem
            });
            writeJsonStorage(DOWNLOAD_HISTORY_KEY, filtered.slice(0, 25));
        }

        function parseItemTimestamp(rawDate) {
            if (!rawDate) return NaN;
            if (typeof rawDate === "number") {
                return rawDate < 1e12 ? rawDate * 1000 : rawDate;
            }
            const str = String(rawDate).trim();
            if (!str) return NaN;

            const dmyMatch = str.match(/^(\d{1,2})[\/\-](\d{1,2})[\/\-](\d{4})(?:\s+(\d{1,2}):(\d{2})(?::(\d{2}))?)?$/);
            if (dmyMatch) {
                const day = Number(dmyMatch[1]);
                const month = Number(dmyMatch[2]) - 1;
                const year = Number(dmyMatch[3]);
                const hr = Number(dmyMatch[4] || 0);
                const min = Number(dmyMatch[5] || 0);
                const sec = Number(dmyMatch[6] || 0);
                return new Date(year, month, day, hr, min, sec).getTime();
            }

            const parsed = Date.parse(str);
            return Number.isNaN(parsed) ? NaN : parsed;
        }

        (function initBellRingNotification() {
            const notifyBtn = document.getElementById("btn-notify");
            const tooltip = document.getElementById("notify-suggest-tooltip");
            const panel = document.getElementById("activity-history-panel");
            if (!notifyBtn) return;

            let audioCtx = null;
            let tooltipHideTimer = null;
            let currentSuggestedItem = null;

            function playRingRingSound() {
                try {
                    const AudioContextClass = window.AudioContext || window.webkitAudioContext;
                    if (!AudioContextClass) return;

                    if (!audioCtx) {
                        audioCtx = new AudioContextClass();
                    }
                    if (audioCtx.state === "suspended") {
                        audioCtx.resume().catch(() => {});
                    }
                    if (audioCtx.state !== "running") return;

                    const now = audioCtx.currentTime;
                    const bursts = [0, 0.24];

                    bursts.forEach((offset) => {
                        const start = now + offset;
                        const duration = 0.16;

                        const osc1 = audioCtx.createOscillator();
                        const osc2 = audioCtx.createOscillator();
                        const gain = audioCtx.createGain();

                        osc1.type = "sine";
                        osc2.type = "triangle";
                        osc1.frequency.setValueAtTime(1480, start);
                        osc2.frequency.setValueAtTime(2210, start);

                        gain.gain.setValueAtTime(0.0001, start);
                        gain.gain.exponentialRampToValueAtTime(0.11, start + 0.02);
                        gain.gain.exponentialRampToValueAtTime(0.0001, start + duration);

                        osc1.connect(gain);
                        osc2.connect(gain);
                        gain.connect(audioCtx.destination);

                        osc1.start(start);
                        osc2.start(start);
                        osc1.stop(start + duration + 0.01);
                        osc2.stop(start + duration + 0.01);
                    });
                } catch (_) {}
            }

                tooltipHideTimer = setTimeout(() => {

            }

            function triggerBellRing(withSound = true) {
                notifyBtn.classList.remove("ringing");
                void notifyBtn.offsetWidth;
                notifyBtn.classList.add("ringing");

                if (withSound) {
                    playRingRingSound();

            }

            if (tooltip) {

                    tooltip.classList.remove("active");
                    if (currentSuggestedItem) {
                        openSectionCardPopup(currentSuggestedItem);

                tooltip.addEventListener("click", openPicked);

            const intervalId = setInterval(() => {
