<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Kpazz - Trang Chủ Chính</title>
    <style>
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            min-height: 100vh;
            background-color: #000000;
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", Arial, sans-serif;
            overflow-x: hidden;
            color: #ffffff;
            -webkit-text-size-adjust: 100%;
            transition: background-color 0.65s ease, color 0.65s ease;
        }

        body {
            display: flex;
            flex-direction: column;
        }

        /* ================= CHẾ ĐỘ SÁNG (LIGHT MODE) ================= */
        body.light-theme {
            background-color: #f2f4f8;
            color: #111318;
        }

        body.light-theme .site-header {
            background-color: #ffffff;
            border-bottom-color: rgba(15, 23, 42, 0.08);
            color: #111318;
        }

        body.light-theme .site-header.scrolled {
            background: linear-gradient(
                135deg,
                rgba(255, 255, 255, 0.82) 0%,
                rgba(255, 255, 255, 0.62) 50%,
                rgba(255, 255, 255, 0.76) 100%
            );
            border: 1px solid rgba(15, 23, 42, 0.12);
            box-shadow:
                0 14px 36px rgba(15, 23, 42, 0.14),
                inset 0 1px 1px rgba(255, 255, 255, 0.9);
        }

        body.light-theme .brand-box,
        body.light-theme .brand-name {
            color: #111318;
        }

        body.light-theme .nav-icon-btn {
            background: rgba(15, 23, 42, 0.06);
            color: #111318;
        }

        body.light-theme .nav-icon-btn:hover {
            background: rgba(15, 23, 42, 0.12);
        }

        body.light-theme .search-results-dropdown,
        body.light-theme .activity-history-panel {
            background: linear-gradient(
                145deg,
                rgba(255, 255, 255, 0.92) 0%,
                rgba(248, 250, 252, 0.96) 55%,
                rgba(255, 255, 255, 0.9) 100%
            );
            border: 1px solid rgba(15, 23, 42, 0.14);
            color: #111318;
            box-shadow: 0 20px 52px rgba(15, 23, 42, 0.18);
        }

        body.light-theme .search-result-meta,
        body.light-theme .search-empty-msg,
        body.light-theme .activity-item-meta {
            color: #475569;
            border-bottom-color: rgba(15, 23, 42, 0.08);
        }

        body.light-theme .search-result-item,
        body.light-theme .search-result-title,
        body.light-theme .activity-panel-title,
        body.light-theme .activity-item-name {
            color: #111318;
        }

        body.light-theme .search-result-item:hover {
            background: rgba(15, 23, 42, 0.06);
        }

        body.light-theme .search-result-desc {
            color: #334155;
        }

        body.light-theme .activity-item {
            background: rgba(15, 23, 42, 0.04);
        }

        body.light-theme main,
        body.light-theme #tabs-container,
        body.light-theme .status-msg {
            background-color: #f2f4f8;
            color: #1e293b;
        }

        body.light-theme .site-footer {
            background-color: #e9edf3;
            border-top-color: rgba(15, 23, 42, 0.08);
            color: #475569;
        }

        /* ================= LỚP NỀN LIQUID GLASS iOS 27 KHI MỞ SEARCH ================= */
        .search-backdrop {
            position: fixed;
            inset: 0;
            z-index: 950;
            background:
                radial-gradient(circle at 18% 20%, rgba(56, 189, 248, 0.28), transparent 44%),
                radial-gradient(circle at 82% 22%, rgba(168, 85, 247, 0.26), transparent 46%),
                radial-gradient(circle at 30% 78%, rgba(45, 212, 191, 0.20), transparent 50%),
                radial-gradient(circle at 76% 76%, rgba(251, 146, 60, 0.16), transparent 48%),
                rgba(10, 12, 18, 0.48);
            backdrop-filter: blur(28px) saturate(210%) contrast(1.06);
            -webkit-backdrop-filter: blur(28px) saturate(210%) contrast(1.06);
            box-shadow: inset 0 0 120px rgba(255, 255, 255, 0.06);
            opacity: 0;
            visibility: hidden;
            pointer-events: none;
            transition: opacity 0.5s cubic-bezier(0.22, 1, 0.36, 1), visibility 0.5s ease;
        }

        .search-backdrop.active {
            opacity: 1;
            visibility: visible;
            pointer-events: auto;
        }

        /* ================= NAVBAR LIQUID GLASS ================= */
        .navbar-wrapper {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            z-index: 1000;
            pointer-events: none;
            display: flex;
            justify-content: flex-start;
        }

        .site-header {
            pointer-events: auto;
            box-sizing: border-box;
            position: relative;
            width: 100%;
            max-width: 100%;
            height: 64px;
            margin-top: 0;
            margin-left: 0;
            padding: 0 5%;
            background-color: #000000;
            border-bottom: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 0px;
            color: #ffffff;
            display: flex;
            justify-content: space-between;
            align-items: center;
            overflow: visible;
            transition:
                width 1.65s cubic-bezier(0.22, 1, 0.36, 1),
                height 1.65s cubic-bezier(0.22, 1, 0.36, 1),
                margin-top 1.65s cubic-bezier(0.22, 1, 0.36, 1),
                margin-left 1.65s cubic-bezier(0.22, 1, 0.36, 1),
                padding 1.65s cubic-bezier(0.22, 1, 0.36, 1),
                border-radius 1.65s cubic-bezier(0.22, 1, 0.36, 1),
                background 1.65s cubic-bezier(0.22, 1, 0.36, 1),
                box-shadow 1.65s cubic-bezier(0.22, 1, 0.36, 1),
                border-color 1.65s cubic-bezier(0.22, 1, 0.36, 1),
                gap 1.65s cubic-bezier(0.22, 1, 0.36, 1);
        }

        .site-header.search-open {
            background: transparent !important;
            border-color: transparent !important;
            box-shadow: none !important;
            backdrop-filter: none !important;
            -webkit-backdrop-filter: none !important;
        }

        .site-header.scrolled {
            width: calc(100% - 28px);
            max-width: calc(100% - 28px);
            height: 58px;
            margin-top: 12px;
            margin-left: 14px;
            padding: 0 16px;
            border-radius: 20px;
            border-bottom-color: rgba(255, 255, 255, 0.24);

            background: linear-gradient(
                135deg,
                rgba(255, 255, 255, 0.16) 0%,
                rgba(255, 255, 255, 0.06) 50%,
                rgba(255, 255, 255, 0.12) 100%
            );
            backdrop-filter: blur(26px) saturate(200%);
            -webkit-backdrop-filter: blur(26px) saturate(200%);
            border: 1px solid rgba(255, 255, 255, 0.24);
            box-shadow:
                0 14px 38px rgba(0, 0, 0, 0.68),
                inset 0 1px 1px rgba(255, 255, 255, 0.42),
                inset 0 -1px 1px rgba(255, 255, 255, 0.08);
        }

        .site-header.compact-left {
            height: 54px;
            margin-top: 12px;
            margin-left: 14px;
            padding: 0 10px;
            border-radius: 28px;
            justify-content: flex-start;
            gap: 6px;
        }

        .nav-left {
            display: flex;
            align-items: center;
            gap: 12px;
            flex-shrink: 0;
            transition: gap 1.45s cubic-bezier(0.22, 1, 0.36, 1);
        }

        .site-header.compact-left .nav-left {
            gap: 6px;
        }

        .brand-box {
            display: flex;
            align-items: center;
            gap: 10px;
            text-decoration: none;
            color: #ffffff;
            user-select: none;
            cursor: pointer;
            max-width: 160px;
            opacity: 1;
            transform: scale(1);
            transform-origin: left center;
            overflow: hidden;
            white-space: nowrap;
            transition:
                max-width 1.45s cubic-bezier(0.22, 1, 0.36, 1),
                opacity 1.1s cubic-bezier(0.22, 1, 0.36, 1),
                transform 1.35s cubic-bezier(0.22, 1, 0.36, 1),
                margin 1.45s cubic-bezier(0.22, 1, 0.36, 1);
        }

        .site-header.compact-left .brand-box {
            max-width: 0px;
            opacity: 0;
            transform: scale(0.72);
            pointer-events: none;
        }

        .brand-logo {
            width: 32px;
            height: 32px;
            border-radius: 9px;
            background: linear-gradient(135deg, #0a84ff, #5e5ce6);
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 2px 10px rgba(10, 132, 255, 0.45);
            flex-shrink: 0;
        }

        .brand-name {
            font-size: 1.2rem;
            font-weight: 700;
            letter-spacing: -0.3px;
            color: #ffffff;
        }

        .nav-right {
            display: flex;
            align-items: center;
            gap: 8px;
            flex-shrink: 0;
            transition: gap 1.45s cubic-bezier(0.22, 1, 0.36, 1);
        }

        .site-header.compact-left .nav-right {
            gap: 6px;
        }

        .nav-icon-btn {
            position: relative;
            width: 38px;
            height: 38px;
            border: none;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.06);
            color: #f5f5f7;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            opacity: 1;
            transform: scale(1);
            flex-shrink: 0;
            transition:
                width 1.4s cubic-bezier(0.22, 1, 0.36, 1),
                margin 1.4s cubic-bezier(0.22, 1, 0.36, 1),
                background-color 0.25s ease,
                transform 1.25s cubic-bezier(0.22, 1, 0.36, 1),
                opacity 1.05s cubic-bezier(0.22, 1, 0.36, 1);
        }

        .site-header.search-open .nav-left,
        .site-header.search-open .nav-right {
            opacity: 0;
            pointer-events: none;
        }

        .nav-icon-btn:hover {
            background: rgba(255, 255, 255, 0.16);
        }

        .nav-icon-btn:active {
            transform: scale(0.92);
        }

        .nav-icon-btn svg {
            width: 20px;
            height: 20px;
            stroke: currentColor;
            fill: none;
            stroke-width: 1.9;
            stroke-linecap: round;
            stroke-linejoin: round;
            flex-shrink: 0;
        }

        #btn-account {
            width: 38px;
            opacity: 1;
            transform: scale(1);
            overflow: hidden;
        }

        .site-header.compact-left #btn-account {
            width: 0px;
            margin-left: -6px;
            opacity: 0;
            transform: scale(0.55);
            pointer-events: none;
        }

        #btn-history {
            width: 0px;
            margin-left: -6px;
            opacity: 0;
            transform: scale(0.6);
            overflow: hidden;
            pointer-events: none;
        }

        .site-header.compact-left #btn-history {
            width: 38px;
            margin-left: 0px;
            opacity: 1;
            transform: scale(1);
            overflow: visible;
            pointer-events: auto;
        }

        @keyframes bellRingSwing {
            0%   { transform: rotate(0deg); }
            12%  { transform: rotate(18deg); }
            24%  { transform: rotate(-16deg); }
            36%  { transform: rotate(14deg); }
            48%  { transform: rotate(-12deg); }
            60%  { transform: rotate(9deg); }
            72%  { transform: rotate(-6deg); }
            84%  { transform: rotate(3deg); }
            100% { transform: rotate(0deg); }
        }

        #btn-notify svg {
            transform-origin: top center;
        }

        #btn-notify.ringing svg {
            animation: bellRingSwing 0.95s cubic-bezier(0.36, 0.07, 0.19, 0.97) both;
            color: #ffd60a;
        }

        .notify-badge {
            position: absolute;
            top: 8px;
            right: 9px;
            width: 7px;
            height: 7px;
            border-radius: 50%;
            background-color: #ff453a;
            box-shadow: 0 0 0 1.5px rgba(20, 20, 22, 0.9);
        }

        /* ================= KHUNG SEARCH ================= */
        .search-expand-bar {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border-radius: 28px;
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 0 14px;
            box-sizing: border-box;
            background: rgba(26, 28, 36, 0.86);
            backdrop-filter: blur(32px) saturate(190%);
            -webkit-backdrop-filter: blur(32px) saturate(190%);
            border: 1px solid rgba(255, 255, 255, 0.22);
            box-shadow:
                0 12px 32px rgba(0, 0, 0, 0.55),
                inset 0 1px 1px rgba(255, 255, 255, 0.28);
            z-index: 25;

            opacity: 0;
            transform: scaleX(0.88);
            transform-origin: left center;
            pointer-events: none;
            visibility: hidden;
            transition:
                width 0.45s cubic-bezier(0.22, 1, 0.36, 1),
                border-radius 0.45s cubic-bezier(0.22, 1, 0.36, 1),
                opacity 0.32s cubic-bezier(0.22, 1, 0.36, 1),
                transform 0.42s cubic-bezier(0.22, 1, 0.36, 1),
                visibility 0.42s ease;
        }

        .site-header:not(.compact-left).search-open .search-expand-bar {
            position: fixed;
            top: 12px;
            left: 14px;
            right: 14px;
            width: auto;
            max-width: 720px;
            height: 52px;
            margin: 0 auto;
            border-radius: 26px;
            transform: none;
            z-index: 1010;
        }

        .site-header.compact-left.search-open .search-expand-bar {
            position: absolute;
            top: 0;
            left: 0;
            right: auto;
            width: calc(100vw - 28px);
            max-width: calc(100vw - 28px);
            height: 100%;
            margin: 0;
            border-radius: 28px;
        }

        .site-header.search-open .search-expand-bar {
            opacity: 1;
            transform: scaleX(1);
            pointer-events: auto;
            visibility: visible;
        }

        .search-expand-icon {
            width: 18px;
            height: 18px;
            color: #c7c7cc;
            flex-shrink: 0;
        }

        .search-expand-input {
            flex: 1;
            min-width: 0;
            height: 38px;
            border: none;
            outline: none;
            background: transparent;
            color: #ffffff;
            font-size: 16px;
            font-family: inherit;
        }

        .search-expand-input::placeholder {
            color: #b0b3b8;
            font-size: 15px;
        }

        .search-close-btn {
            width: 32px;
            height: 32px;
            border: none;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.14);
            color: #ffffff;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            flex-shrink: 0;
            transition: background-color 0.2s ease, transform 0.15s ease;
        }

        .search-close-btn:hover {
            background: rgba(255, 255, 255, 0.24);
        }

        .search-close-btn:active {
            transform: scale(0.92);
        }

        /* ================= LỊCH SỬ TÌM KIẾM ================= */
        .search-history-below {
            position: fixed;
            top: 76px;
            left: 14px;
            right: 14px;
            width: auto;
            max-width: 720px;
            margin: 0 auto;
            border-radius: 20px;
            padding: 12px 14px;
            box-sizing: border-box;
            background: rgba(24, 26, 34, 0.84);
            backdrop-filter: blur(30px) saturate(190%);
            -webkit-backdrop-filter: blur(30px) saturate(190%);
            border: 1px solid rgba(255, 255, 255, 0.16);
            box-shadow:
                0 14px 36px rgba(0, 0, 0, 0.52),
                inset 0 1px 1px rgba(255, 255, 255, 0.2);
            z-index: 1005;
            opacity: 0;
            visibility: hidden;
            pointer-events: none;
            transform: translateY(-6px);
            transition: opacity 0.25s ease, transform 0.32s cubic-bezier(0.22, 1, 0.36, 1), visibility 0.32s ease;
        }

        .search-history-below.active {
            opacity: 1;
            visibility: visible;
            pointer-events: auto;
            transform: translateY(0);
        }

        .search-history-head {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 13px;
            color: #d1d5db;
            padding: 0 4px 8px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            margin-bottom: 8px;
        }

        .search-history-clear-btn {
            border: none;
            background: transparent;
            color: #38bdf8;
            font-size: 13px;
            cursor: pointer;
            padding: 2px 4px;
        }

        .search-history-chips {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
        }

        .search-history-chip {
            border: 1px solid rgba(255, 255, 255, 0.14);
            background: rgba(255, 255, 255, 0.1);
            color: #f5f5f7;
            border-radius: 999px;
            padding: 6px 14px;
            font-size: 13px;
            cursor: pointer;
            transition: background-color 0.2s ease;
        }

        .search-history-chip:hover {
            background: rgba(255, 255, 255, 0.18);
        }

        /* ================= KẾT QUẢ TÌM KIẾM ================= */
        .search-results-dropdown {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -46%) scale(0.96);
            width: calc(100% - 28px);
            max-width: 720px;
            max-height: 68vh;
            overflow-y: auto;
            border-radius: 24px;
            padding: 14px;
            box-sizing: border-box;
            background: linear-gradient(
                145deg,
                rgba(255, 255, 255, 0.15) 0%,
                rgba(20, 22, 30, 0.88) 50%,
                rgba(255, 255, 255, 0.08) 100%
            );
            backdrop-filter: blur(30px) saturate(210%);
            -webkit-backdrop-filter: blur(30px) saturate(210%);
            border: 1px solid rgba(255, 255, 255, 0.26);
            box-shadow:
                0 24px 64px rgba(0, 0, 0, 0.72),
                inset 0 1px 1px rgba(255, 255, 255, 0.42);
            z-index: 999;

            opacity: 0;
            pointer-events: none;
            visibility: hidden;
            transition:
                opacity 0.3s cubic-bezier(0.22, 1, 0.36, 1),
                transform 0.42s cubic-bezier(0.22, 1, 0.36, 1),
                visibility 0.42s ease;
        }

        .search-results-dropdown.active {
            opacity: 1;
            transform: translate(-50%, -50%) scale(1);
            pointer-events: auto;
            visibility: visible;
        }

        .search-result-meta {
            font-size: 12px;
            color: #b0b3b8;
            padding: 4px 8px 10px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.12);
            margin-bottom: 8px;
        }

        .search-result-item {
            display: flex;
            align-items: flex-start;
            gap: 12px;
            padding: 10px;
            border-radius: 16px;
            text-decoration: none;
            color: #ffffff;
            transition: background-color 0.2s ease;
        }

        .search-result-item:hover {
            background: rgba(255, 255, 255, 0.12);
        }

        .search-result-thumb {
            width: 48px;
            height: 48px;
            border-radius: 12px;
            object-fit: cover;
            background: rgba(255, 255, 255, 0.08);
            flex-shrink: 0;
        }

        .search-result-body {
            flex: 1;
            min-width: 0;
        }

        .search-result-title {
            font-size: 0.95rem;
            font-weight: 600;
            color: #ffffff;
            margin: 0 0 3px 0;
        }

        .search-result-sub {
            font-size: 0.8rem;
            color: #38bdf8;
            margin: 0 0 4px 0;
        }

        .search-result-desc {
            font-size: 0.82rem;
            color: #c7c7cc;
            margin: 0;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        .search-empty-msg {
            padding: 20px 12px;
            text-align: center;
            color: #b0b3b8;
            font-size: 0.92rem;
        }

        /* ================= BẢNG LỊCH SỬ ĐÃ XEM & ĐÃ TẢI ================= */
        .activity-history-panel {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -46%) scale(0.96);
            width: calc(100% - 28px);
            max-width: 560px;
            max-height: 72vh;
            overflow-y: auto;
            border-radius: 24px;
            padding: 16px;
            box-sizing: border-box;
            background: linear-gradient(
                145deg,
                rgba(255, 255, 255, 0.16) 0%,
                rgba(18, 20, 28, 0.92) 55%,
                rgba(255, 255, 255, 0.08) 100%
            );
            backdrop-filter: blur(30px) saturate(210%);
            -webkit-backdrop-filter: blur(30px) saturate(210%);
            border: 1px solid rgba(255, 255, 255, 0.26);
            box-shadow:
                0 24px 64px rgba(0, 0, 0, 0.75),
                inset 0 1px 1px rgba(255, 255, 255, 0.42);
            z-index: 1002;
            opacity: 0;
            pointer-events: none;
            visibility: hidden;
            transition: opacity 0.28s ease, transform 0.38s cubic-bezier(0.22, 1, 0.36, 1), visibility 0.38s ease;
        }

        .activity-history-panel.active {
            opacity: 1;
            transform: translate(-50%, -50%) scale(1);
            pointer-events: auto;
            visibility: visible;
        }

        .activity-panel-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-bottom: 10px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.12);
            margin-bottom: 12px;
        }

        .activity-panel-title {
            margin: 0;
            font-size: 1rem;
            font-weight: 700;
            color: #ffffff;
        }

        .activity-panel-actions {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .activity-section-label {
            font-size: 12px;
            font-weight: 600;
            color: #38bdf8;
            margin: 10px 0 6px;
            text-transform: uppercase;
            letter-spacing: 0.4px;
        }

        .activity-item {
            padding: 9px 10px;
            border-radius: 14px;
            background: rgba(255, 255, 255, 0.05);
            margin-bottom: 6px;
            display: flex;
            flex-direction: column;
            gap: 3px;
        }

        .activity-item-name {
            font-size: 0.9rem;
            font-weight: 600;
            color: #ffffff;
            word-break: break-word;
        }

        .activity-item-meta {
            font-size: 0.76rem;
            color: #a1a1a6;
            word-break: break-all;
        }

        /* ================= NỘI DUNG CHÍNH ================= */
        main {
            flex: 1;
            width: 100%;
            padding: 64px 0 0 0;
            margin: 0;
            background-color: #000000;
            transition: background-color 0.65s ease, color 0.65s ease;
        }

        #tabs-container {
            width: 100%;
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;

    <script>
        let CURRENT_TABS_DIR = "Tabs/";
        let DISCOVERED_TAB_FILES = [];
        let CACHED_JSON_ENTRIES = null;

        const SEARCH_HISTORY_KEY = "kpazz_search_history_v1";
        const VIEWED_HISTORY_KEY = "kpazz_viewed_history_v1";
        const DOWNLOAD_HISTORY_KEY = "kpazz_download_history_v1";
        const THEME_OVERRIDE_KEY = "kpazz_theme_override_v1";

        (function initAutoPlus7AndManualTheme() {
            const brandToggle = document.getElementById("brand-theme-toggle");

            function getPlus7Hour() {
                const now = new Date();
                const utcMs = now.getTime() + now.getTimezoneOffset() * 60000;
                const plus7Date = new Date(utcMs + 7 * 3600000);
                return plus7Date.getHours();
            }

            function isDaytimePlus7() {
                const hour = getPlus7Hour();
                return hour >= 6 && hour < 18;
            }

            function applyTheme(isLight) {
                document.body.classList.toggle("light-theme", Boolean(isLight));
            }

            function syncThemeFromStorageOrClock() {
                let manualMode = null;
                try {
                    manualMode = localStorage.getItem(THEME_OVERRIDE_KEY);
                } catch (_) {}

                if (manualMode === "light") {
                    applyTheme(true);
                } else if (manualMode === "dark") {
                    applyTheme(false);
                } else {
                    applyTheme(isDaytimePlus7());
                }
            }

            if (brandToggle) {
                const toggleManual = (e) => {
                    e.preventDefault();
                    e.stopPropagation();
                    const nextIsLight = !document.body.classList.contains("light-theme");
                    applyTheme(nextIsLight);
                    try {
                        localStorage.setItem(THEME_OVERRIDE_KEY, nextIsLight ? "light" : "dark");
                    } catch (_) {}
                };

                brandToggle.addEventListener("click", toggleManual);
                brandToggle.addEventListener("keydown", (e) => {
                    if (e.key === "Enter" || e.key === " ") {
                        toggleManual(e);
                    }
                });
            }

            syncThemeFromStorageOrClock();
            setInterval(syncThemeFromStorageOrClock, 60000);
        })();

        function readJsonStorage(key, fallback = []) {
            try {
                const raw = localStorage.getItem(key);
                const parsed = raw ? JSON.parse(raw) : fallback;
                return Array.isArray(parsed) ? parsed : fallback;
            } catch (_) {
                return fallback;
            }
        }

        function writeJsonStorage(key, value) {
            try {
                localStorage.setItem(key, JSON.stringify(value));
            } catch (_) {}
        }

        function recordSearchQuery(query) {
            const cleaned = String(query || "").trim();
            if (!cleaned) return;
            const list = readJsonStorage(SEARCH_HISTORY_KEY, []).filter(
                q => q.toLowerCase() !== cleaned.toLowerCase()
            );
            list.unshift(cleaned);
            writeJsonStorage(SEARCH_HISTORY_KEY, list.slice(0, 12));
        }

        function isDownloadTarget(nameOrUrl = "") {
            const lower = String(nameOrUrl).toLowerCase();
            return /\.(ipa|deb|apk|zip|rar|7z|tar|gz|pdf|mp3|mp4|dmg|exe|json)(\?|#|$)/i.test(lower) ||
                /download|\/dl\/|get_deb|ipa/i.test(lower);
        }

        function recordViewedItem(title, url = "") {
            const cleanTitle = String(title || "").trim();
            if (!cleanTitle) return;
            const timeStr = new Date().toLocaleString("vi-VN");
            const list = readJsonStorage(VIEWED_HISTORY_KEY, []);
            const filtered = list.filter(item => item.title !== cleanTitle);
            filtered.unshift({ title: cleanTitle, url: String(url || ""), time: timeStr });
            writeJsonStorage(VIEWED_HISTORY_KEY, filtered.slice(0, 25));
        }

        function recordDownloadedItem(name, url = "") {
            const cleanName = String(name || "").trim();
            if (!cleanName) return;
            const timeStr = new Date().toLocaleString("vi-VN");
            const list = readJsonStorage(DOWNLOAD_HISTORY_KEY, []);
            const filtered = list.filter(item => item.name !== cleanName || item.url !== url);
            filtered.unshift({ name: cleanName, url: String(url || ""), time: timeStr });
            writeJsonStorage(DOWNLOAD_HISTORY_KEY, filtered.slice(0, 25));
        }

        function renderSearchHistoryBelow() {
            const box = document.getElementById("search-history-below");
            const navbar = document.getElementById("main-navbar");
            const searchInput = document.getElementById("navbar-search-input");
            if (!box || !navbar || !searchInput) return;

            if (!navbar.classList.contains("search-open") || searchInput.value.trim()) {
                box.classList.remove("active");
                return;
            }

            const history = readJsonStorage(SEARCH_HISTORY_KEY, []);
            if (!history.length) {
                box.innerHTML = `
                    <div class="search-history-head">
                        <span>Lịch sử tìm kiếm</span>
                    </div>
                    <div class="search-empty-msg" style="padding: 10px 6px; font-size: 13px;">Chưa có từ khóa tìm kiếm nào.</div>
                `;
                box.classList.add("active");
                return;
            }

            const chipsHtml = history.map(term =>
                `<button type="button" class="search-history-chip" data-query="${escapeAttr(term)}">${escapeHtml(term)}</button>`
            ).join("");

            box.innerHTML = `
                <div class="search-history-head">
                    <span>Lịch sử tìm kiếm</span>
                    <button type="button" class="search-history-clear-btn" id="btn-clear-search-history">Xóa</button>
                </div>
                <div class="search-history-chips">${chipsHtml}</div>
            `;
            box.classList.add("active");

            box.querySelectorAll(".search-history-chip").forEach(chip => {
                chip.addEventListener("click", () => {
                    const q = chip.getAttribute("data-query") || "";
                    searchInput.value = q;
                    box.classList.remove("active");
                    renderSearchResults(q, true);
                });
            });

            const clearBtn = document.getElementById("btn-clear-search-history");
            if (clearBtn) {
                clearBtn.addEventListener("click", (e) => {
                    e.stopPropagation();
                    writeJsonStorage(SEARCH_HISTORY_KEY, []);
                    renderSearchHistoryBelow();
                });
            }
        }

        function renderActivityHistoryPanel() {
            const container = document.getElementById("activity-history-content");
            if (!container) return;

            const viewed = readJsonStorage(VIEWED_HISTORY_KEY, []);
            const downloaded = readJsonStorage(DOWNLOAD_HISTORY_KEY, []);

            const viewedHtml = viewed.length
                ? viewed.map(v => `
                    <div class="activity-item">
                        <span class="activity-item-name">${escapeHtml(v.title)}</span>
                        <span class="activity-item-meta">${escapeHtml(v.time)}${v.url ? ` • ${escapeHtml(v.url)}` : ""}</span>
                    </div>
                `).join("")
                : `<div class="search-empty-msg" style="padding: 8px; font-size: 13px;">Chưa ghi nhận mục nào đã xem.</div>`;

            const downloadedHtml = downloaded.length
                ? downloaded.map(d => `
                    <div class="activity-item">
                        <span class="activity-item-name">${escapeHtml(d.name)}</span>
                        <span class="activity-item-meta">${escapeHtml(d.time)}${d.url ? ` • ${escapeHtml(d.url)}` : ""}</span>
                    </div>
                `).join("")
                : `<div class="search-empty-msg" style="padding: 8px; font-size: 13px;">Chưa ghi nhận tệp hoặc mục nào đã tải.</div>`;

            container.innerHTML = `
                <div class="activity-section-label">Mục đã xem (${viewed.length})</div>
                ${viewedHtml}
                <div class="activity-section-label">Đã tải (${downloaded.length})</div>
                ${downloadedHtml}
            `;
        }

        (function initActivityTracker() {
            document.addEventListener("click", (e) => {
                const linkOrBtn = e.target.closest("a, button");
                if (!linkOrBtn) return;
                if (linkOrBtn.closest("#main-navbar, #search-history-below, #activity-history-panel")) return;

                const href = linkOrBtn.getAttribute("href") || linkOrBtn.dataset.download || linkOrBtn.dataset.url || "";
                const hasDownloadAttr = linkOrBtn.hasAttribute("download");
                const labelText = (
                    linkOrBtn.dataset.title ||
                    linkOrBtn.dataset.name ||
                    linkOrBtn.getAttribute("aria-label") ||
                    linkOrBtn.textContent ||
                    ""
                ).trim().replace(/\s+/g, " ").slice(0, 90);

                if (hasDownloadAttr || isDownloadTarget(href) || /tải|download|install|ipa|deb/i.test(labelText)) {
                    recordDownloadedItem(labelText || href || "Tệp tải xuống", href);
                } else if (labelText && href && href !== "#") {
                    recordViewedItem(labelText, href);
                }
            }, true);
        })();

        (function initHistoryPanelControls() {
            const btnHistory = document.getElementById("btn-history");
            const panel = document.getElementById("activity-history-panel");
            const backdrop = document.getElementById("search-backdrop");
            const btnClose = document.getElementById("btn-activity-close");
            const btnClear = document.getElementById("btn-clear-activity-history");

            if (!btnHistory || !panel) return;

            function openHistoryPanel() {
                renderActivityHistoryPanel();
                panel.classList.add("active");
                if (backdrop) backdrop.classList.add("active");
            }

            function closeHistoryPanel() {
                panel.classList.remove("active");
                const navbar = document.getElementById("main-navbar");
                if (backdrop && (!navbar || !navbar.classList.contains("search-open"))) {
                    backdrop.classList.remove("active");
                }
            }

            btnHistory.addEventListener("click", (e) => {
                e.stopPropagation();
                if (panel.classList.contains("active")) {
                    closeHistoryPanel();
                } else {
                    openHistoryPanel();
                }
            });

            if (btnClose) {
                btnClose.addEventListener("click", (e) => {
                    e.stopPropagation();
                    closeHistoryPanel();
                });
            }

            if (btnClear) {
                btnClear.addEventListener("click", (e) => {
                    e.stopPropagation();
                    writeJsonStorage(VIEWED_HISTORY_KEY, []);
                    writeJsonStorage(DOWNLOAD_HISTORY_KEY, []);
                    renderActivityHistoryPanel();
                });
            }

            if (backdrop) {
                backdrop.addEventListener("click", () => {
                    closeHistoryPanel();
                });
            }

            document.addEventListener("keydown", (e) => {
                if (e.key === "Escape" && panel.classList.contains("active")) {
                    closeHistoryPanel();
                }
            });
        })();

        (function initNavbarScrollEffect() {
            const navbar = document.getElementById("main-navbar");
            if (!navbar) return;

            const updateCompactWidth = (isCompact) => {
                if (!isCompact) {
                    navbar.style.width = "";
                    return;
                }
                const targetCompactWidth = Math.min(194, window.innerWidth - 28);
                navbar.style.width = `${targetCompactWidth}px`;
            };

            const handleScroll = () => {
                const scrollY = window.scrollY || window.pageYOffset || 0;
                const docHeight = Math.max(
                    document.documentElement.scrollHeight - window.innerHeight,
                    1
                );
                const oneThirdThreshold = Math.max(120, docHeight / 3);

                const isScrolled = scrollY > 30;
                const isCompact = scrollY >= oneThirdThreshold;

                navbar.classList.toggle("scrolled", isScrolled);
                navbar.classList.toggle("compact-left", isCompact);
                updateCompactWidth(isCompact);
            };

            window.addEventListener("scroll", handleScroll, { passive: true });
            window.addEventListener("resize", handleScroll, { passive: true });
            handleScroll();
        })();

        (function initBellRingNotification() {
            const notifyBtn = document.getElementById("btn-notify");
            if (!notifyBtn) return;

            let audioCtx = null;

            function playRingRingSound() {
                try {
                    const AudioContextClass = window.AudioContext || window.webkitAudioContext;
                    if (!AudioContextClass) return;

                    if (!audioCtx) {
                        audioCtx = new AudioContextClass();
                    }
                    if (audioCtx.state === "suspended") {
                        audioCtx.resume().catch(() => {});
                    }
                    if (audioCtx.state !== "running") return;

                    const now = audioCtx.currentTime;
                    const bursts = [0, 0.24];

                    bursts.forEach((offset) => {
                        const start = now + offset;
                        const duration = 0.16;

                        const osc1 = audioCtx.createOscillator();
                        const osc2 = audioCtx.createOscillator();
                        const gain = audioCtx.createGain();

                        osc1.type = "sine";
                        osc2.type = "triangle";
                        osc1.frequency.setValueAtTime(1480, start);
                        osc2.frequency.setValueAtTime(2210, start);

                        gain.gain.setValueAtTime(0.0001, start);
                        gain.gain.exponentialRampToValueAtTime(0.11, start + 0.02);
                        gain.gain.exponentialRampToValueAtTime(0.0001, start + duration);

                        osc1.connect(gain);
                        osc2.connect(gain);
                        gain.connect(audioCtx.destination);

                        osc1.start(start);
                        osc2.start(start);
                        osc1.stop(start + duration + 0.01);
                        osc2.stop(start + duration + 0.01);
                    });
                } catch (_) {}
            }

            function triggerBellRing(withSound = true) {
                notifyBtn.classList.remove("ringing");
                void notifyBtn.offsetWidth;
                notifyBtn.classList.add("ringing");

                if (withSound) {
                    playRingRingSound();
                }

                setTimeout(() => {
                    notifyBtn.classList.remove("ringing");
                }, 1000);
            }

            const intervalId = setInterval(() => {
                triggerBellRing(true);
            }, 14000);

            notifyBtn.addEventListener("click", (e) => {
                e.stopPropagation();
                triggerBellRing(true);
            });

            window.addEventListener("beforeunload", () => clearInterval(intervalId));
        })();

        function collectJsonSearchEntries(node, sourceFile, tabsDir, out = []) {
            if (!node || typeof node !== "object") return out;

            if (Array.isArray(node)) {
                node.forEach(item => collectJsonSearchEntries(item, sourceFile, tabsDir, out));
                return out;
            }

            const title =
                node.title || node.name || node.appName || node.tweakName || node.heading || "";
            const author =
                node.author || node.developer || node.creator || node.by || node.vendor || "";
            const content =
                node.description || node.desc || node.content || node.subtitle || node.summary || node.version || "";
            const link =
                node.url || node.link || node.download || node.ipa || node.deb || "#";
            const rawIcon =
                node.icon || node.image || node.img || node.thumbnail || node.cover || "";

            const searchableBlob = JSON.stringify(node).toLowerCase();
            const hasMeaningfulField =
                typeof title === "string" || typeof author === "string" || typeof content === "string";

            if (hasMeaningfulField && (title || author || content)) {
                out.push({
                    title: String(title || "Không có tiêu đề"),
                    author: String(author || ""),
                    content: String(content || ""),
                    link: String(link || "#"),
                    icon: rawIcon ? resolveTabRelativeUrl(String(rawIcon), tabsDir) : "",
                    sourceFile,
                    searchText: searchableBlob
                });
            }

            Object.values(node).forEach(val => {
                if (val && typeof val === "object") {
                    collectJsonSearchEntries(val, sourceFile, tabsDir, out);
                }
            });

            return out;
        }

        async function loadAllJsonEntriesFromTabs() {
            if (CACHED_JSON_ENTRIES) return CACHED_JSON_ENTRIES;

            const candidateUrls = new Set();
            const addUrl = (u) => {
                if (!u) return;
                candidateUrls.add(u);
            };

            DISCOVERED_TAB_FILES.forEach(file => {
                getMatchedJsonUrlsForHtmlFile(CURRENT_TABS_DIR, file).forEach(addUrl);
            });

            ["manifest.json", "tabs.json", "Appios.json", "Tweak.json"].forEach(name => {
                addUrl(`${CURRENT_TABS_DIR}${name}`);
            });

            if (listingHtmlCache) {
                const jsonMatches = listingHtmlCache.match(/[A-Za-z0-9_\-\.%À-ỹ ]+\.json\b/gi) || [];
                jsonMatches.forEach(m => addUrl(`${CURRENT_TABS_DIR}${m}`));
            }

            const entries = [];
            for (const url of candidateUrls) {
                try {
                    const res = await fetch(url, { cache: "no-store" });
                    if (!res.ok) continue;
                    const data = await res.json();
                    collectJsonSearchEntries(data, url, CURRENT_TABS_DIR, entries);
                } catch (_) {}
            }

            CACHED_JSON_ENTRIES = entries;
            return entries;
        }

        let searchSaveTimer = null;

        function renderSearchResults(query, saveImmediate = false) {
            const dropdown = document.getElementById("search-results-dropdown");
            const historyBelow = document.getElementById("search-history-below");
            const rawQuery = String(query || "");
            const trimmed = rawQuery.trim().toLowerCase();

            if (!trimmed) {
                dropdown.classList.remove("active");
                dropdown.innerHTML = "";
                renderSearchHistoryBelow();
                return;
            }

            if (historyBelow) {
                historyBelow.classList.remove("active");
            }

            clearTimeout(searchSaveTimer);
            if (saveImmediate) {
                recordSearchQuery(rawQuery.trim());
            } else {
                searchSaveTimer = setTimeout(() => {
                    recordSearchQuery(rawQuery.trim());
                }, 650);
            }

            loadAllJsonEntriesFromTabs().then(entries => {
                const terms = trimmed.split(/\s+/).filter(Boolean);
                const matches = entries.filter(item =>
                    terms.every(term => item.searchText.includes(term))
                );

                dropdown.classList.add("active");

                if (!matches.length) {
                    dropdown.innerHTML = `<div class="search-empty-msg">Không tìm thấy kết quả phù hợp với "<strong>${escapeHtml(rawQuery.trim())}</strong>" trong dữ liệu JSON của Tabs.</div>`;
                    return;
                }

                const topMatches = matches.slice(0, 25);
                const htmlItems = topMatches.map(item => {
                    const metaLine = [
                        item.author ? `Tác giả: ${item.author}` : "",
                        item.sourceFile ? item.sourceFile.split("/").pop() : ""
                    ].filter(Boolean).join(" • ");

                    const thumbHtml = item.icon
                        ? `<img class="search-result-thumb" src="${escapeAttr(item.icon)}" alt="" onerror="this.style.display='none'">`
                        : "";

                    const hrefVal = item.link && item.link !== "#" ? escapeAttr(item.link) : "#";
                    const targetAttr = hrefVal.startsWith("http") ? ` target="_blank" rel="noopener"` : "";

                    return `
                        <a class="search-result-item" href="${hrefVal}"${targetAttr} data-hist-title="${escapeAttr(item.title)}" data-hist-link="${hrefVal}">
                            ${thumbHtml}
                            <div class="search-result-body">
                                <p class="search-result-title">${escapeHtml(item.title)}</p>
                                ${metaLine ? `<p class="search-result-sub">${escapeHtml(metaLine)}</p>` : ""}
                                ${item.content ? `<p class="search-result-desc">${escapeHtml(item.content)}</p>` : ""}
                            </div>
                        </a>
                    `;
                }).join("");

                dropdown.innerHTML = `
                    <div class="search-result-meta">Tìm thấy ${matches.length} kết quả cho "${escapeHtml(rawQuery.trim())}"</div>
                    ${htmlItems}
                `;

                dropdown.querySelectorAll(".search-result-item").forEach(el => {
                    el.addEventListener("click", () => {
                        const t = el.getAttribute("data-hist-title") || "";
                        const u = el.getAttribute("data-hist-link") || "";
                        if (isDownloadTarget(u)) {
                            recordDownloadedItem(t, u);
                        } else {
                            recordViewedItem(t, u);
                        }
                    });
                });
            });
        }

        function escapeHtml(str) {
            return String(str)
                .replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;")
                .replace(/"/g, "&quot;");
        }

        function escapeAttr(str) {
            return escapeHtml(str).replace(/'/g, "&#39;");
        }

        (function initSearchExpandControls() {
            const navbar = document.getElementById("main-navbar");
            const btnSearch = document.getElementById("btn-search");
            const btnClose = document.getElementById("btn-search-close");
            const searchInput = document.getElementById("navbar-search-input");
            const dropdown = document.getElementById("search-results-dropdown");
            const historyBelow = document.getElementById("search-history-below");
            const backdrop = document.getElementById("search-backdrop");

            function openSearch() {
                navbar.classList.add("search-open");
                if (backdrop) backdrop.classList.add("active");
                setTimeout(() => {
                    searchInput.focus({ preventScroll: true });
                    if (searchInput.value.trim()) {
                        renderSearchResults(searchInput.value);
                    } else {
                        renderSearchHistoryBelow();
                    }
                }, 120);
            }

            function closeSearch() {
                navbar.classList.remove("search-open");
                dropdown.classList.remove("active");
                if (historyBelow) historyBelow.classList.remove("active");
                const historyPanel = document.getElementById("activity-history-panel");
                if (backdrop && (!historyPanel || !historyPanel.classList.contains("active"))) {
                    backdrop.classList.remove("active");
                }
                searchInput.blur();
            }

            btnSearch.addEventListener("click", (e) => {
                e.stopPropagation();
                if (navbar.classList.contains("search-open")) {
                    searchInput.focus({ preventScroll: true });
                    if (!searchInput.value.trim()) {
                        renderSearchHistoryBelow();
                    }
                } else {
                    openSearch();
                }
            });

            searchInput.addEventListener("focus", () => {
                if (!searchInput.value.trim()) {
                    renderSearchHistoryBelow();
                }
            });

            btnClose.addEventListener("click", (e) => {
                e.stopPropagation();
                searchInput.value = "";
                closeSearch();
            });

            if (backdrop) {
                backdrop.addEventListener("click", () => {
                    closeSearch();
                });
            }

            searchInput.addEventListener("input", (e) => {
                renderSearchResults(e.target.value);
            });

            searchInput.addEventListener("keydown", (e) => {
                if (e.key === "Enter" && searchInput.value.trim()) {
                    renderSearchResults(searchInput.value, true);
                }
            });

            document.addEventListener("keydown", (e) => {
                if (e.key === "Escape" && navbar.classList.contains("search-open")) {
                    closeSearch();
                }
            });
        })();

        // Khai báo tên các tệp .html nằm trong thư mục Tabs/ (bắt buộc cho host tĩnh như GitHub Pages)
        const KNOWN_TAB_FILES = [
            "Appios.html",
            "Tweak.html"
        ];

        let listingHtmlCache = "";

        function isNotFoundPage(html) {
            if (!html) return true;
            const upper = html.toUpperCase();
            return (
                upper.includes("PAGE NOT FOUND") ||
                upper.includes("404 NOT FOUND") ||
                upper.includes("CANNOT GET ") ||
                (upper.includes("<TITLE>404") && !upper.includes("IOS-GAME-SECTION"))
            );
        }

        function extractHtmlFileName(rawPath) {
            if (!rawPath || typeof rawPath !== "string") return "";
            const trimmed = rawPath.trim();
            if (!trimmed) return "";

            if (trimmed.startsWith("http://") || trimmed.startsWith("https://")) {
                try {
                    const u = new URL(trimmed);
                    const last = decodeURIComponent(u.pathname.split("/").pop() || "");
                    return last.toLowerCase().endsWith(".html") && last.toLowerCase() !== "index.html" ? last : "";
                } catch (_) {
                    return "";
                }
            }

            const noQuery = trimmed.split("?")[0].split("#")[0];
            const last = decodeURIComponent(noQuery.split("/").pop() || "");
            if (!last || last.toLowerCase() === "index.html") return "";
            return last.toLowerCase().endsWith(".html") ? last : "";
        }

        async function resolveTabsDir() {
            for (const dir of ["Tabs/", "tabs/"]) {
                try {
                    const res = await fetch(dir, { cache: "no-store" });
                    if (res.ok) {
                        const text = await res.text();
                        if (!isNotFoundPage(text)) {
                            return { dir, listingHtml: text };
                        }
                    }
                } catch (_) {}
            }
            return { dir: "Tabs/", listingHtml: "" };
        }

        async function loadManifestFiles(tabsDir) {
            for (const manifestName of ["manifest.json", "tabs.json"]) {
                try {
                    const res = await fetch(tabsDir + manifestName, { cache: "no-store" });
                    if (!res.ok) continue;
                    const data = await res.json();
                    const list = Array.isArray(data) ? data : (Array.isArray(data.files) ? data.files : []);
                    if (list.length) return list;
                } catch (_) {}
            }
            return [];
        }

        async function discoverHtmlInTabs(tabsDir, listingHtml) {
            const foundMap = new Map();

            const addFile = (name) => {
                const clean = extractHtmlFileName(name);
                if (!clean) return;
                const key = clean.toLowerCase();
                if (!foundMap.has(key)) {
                    foundMap.set(key, clean);
                }
            };

            KNOWN_TAB_FILES.forEach(addFile);

            const manifestFiles = await loadManifestFiles(tabsDir);
            manifestFiles.forEach(addFile);

            if (listingHtml) {
                const doc = new DOMParser().parseFromString(listingHtml, "text/html");

                doc.querySelectorAll("a[href]").forEach(a => {
                    addFile(a.getAttribute("href"));
                });

                const rawMatches = listingHtml.match(/[A-Za-z0-9_\-\.%À-ỹ ]+\.html\b/gi);
                if (rawMatches) {
                    rawMatches.forEach(m => addFile(m));
                }
            }

            return Array.from(foundMap.values()).sort((a, b) =>
                a.localeCompare(b, "vi", { numeric: true, sensitivity: "base" })
            );
        }

        // Tạo danh sách tệp .json tương ứng trực tiếp với tên tệp .html (ưu tiên đúng tên tệp trước)
        function getMatchedJsonUrlsForHtmlFile(tabsDir, htmlFile) {
            const candidates = [];
            const seen = new Set();
            const addCand = (p) => {
                if (!p || typeof p !== "string") return;
                const clean = p.trim();
                if (!clean || seen.has(clean.toLowerCase())) return;
                seen.add(clean.toLowerCase());
                candidates.push(clean);
            };

            const baseName = String(htmlFile || "").replace(/\.html$/i, "");
            if (!baseName) return candidates;

            // 1. Khớp tên tệp .json tương ứng trong thư mục Tabs
            addCand(`${tabsDir}${baseName}.json`);
            if (baseName.toLowerCase() !== baseName) {
                addCand(`${tabsDir}${baseName.toLowerCase()}.json`);
            }

            // 2. Fallback tìm trong listing HTML nếu tên tệp JSON có hoa/thường khác
            if (listingHtmlCache) {
                const escapedBase = baseName.replace(/[.*+?^${}()|[\]\\]/g, "\\$&");
                const regex = new RegExp(`(?:^|[^A-Za-z0-9_\\-])(${escapedBase}\\.json)(?:$|[^A-Za-z0-9_\\-])`, "gi");
                let match;
                while ((match = regex.exec(listingHtmlCache)) !== null) {
                    addCand(`${tabsDir}${match[1]}`);
                }
            }

            return candidates;
        }

        function findSlotSectionValue(node) {
            if (!node || typeof node !== "object" || Array.isArray(node)) return undefined;
            for (const key of ["slotsection", "slotSection", "slot_section", "order"]) {
                if (node[key] !== undefined && node[key] !== null && node[key] !== "") {
                    return node[key];
                }
            }
            for (const val of Object.values(node)) {
                if (val && typeof val === "object" && !Array.isArray(val)) {
                    const found = findSlotSectionValue(val);
                    if (found !== undefined) return found;
                }
            }
            return undefined;
        }

        function extractOrderNumber1To100(json) {
            if (!json || typeof json !== "object") return Number.POSITIVE_INFINITY;
            const rawVal = findSlotSectionValue(json);
            const num = Number(rawVal);
            if (Number.isFinite(num) && num >= 1 && num <= 100) {
                return num;
            }
            return Number.POSITIVE_INFINITY;
        }

        async function readSlotSectionForTab(tabsDir, file) {
            const candidates = getMatchedJsonUrlsForHtmlFile(tabsDir, file);
            for (const url of candidates) {
                try {
                    const res = await fetch(url, { cache: "no-store" });
                    if (!res.ok) continue;
                    const json = await res.json();
                    const orderNum = extractOrderNumber1To100(json);
                    if (Number.isFinite(orderNum)) {
                        return { slotsection: orderNum, jsonFile: url };
                    }
                } catch (_) {}
            }
            return { slotsection: Number.POSITIVE_INFINITY, jsonFile: "" };
        }

        function resolveTabRelativeUrl(rawUrl, tabsDir) {
            if (!rawUrl || typeof rawUrl !== "string") return rawUrl;
            const trimmed = rawUrl.trim();
            if (
                !trimmed ||
                trimmed.startsWith("http://") ||
                trimmed.startsWith("https://") ||
                trimmed.startsWith("data:") ||
                trimmed.startsWith("blob:") ||
                trimmed.startsWith("/") ||
                trimmed.startsWith("#") ||
                trimmed.toLowerCase().startsWith("tabs/")
            ) {
                return trimmed;
            }
            const clean = trimmed.replace(/^\.\//, "");
            return `${tabsDir}${clean}`;
        }

        function rewriteRelativeAssetPathsInCode(code, tabsDir) {
            const escapedDir = tabsDir.replace(/[.*+?^${}()|[\]\\]/g, "\\$&");
            return code.replace(
                /(["'])((?:\.\/)?(?:Art|debs|img|images|assets|icons|banners)\/[^"']+)\1/gi,
                (match, quote, relPath) => {
                    const clean = relPath.replace(/^\.\//, "");
                    if (new RegExp(`^${escapedDir}`, "i").test(clean)) {
                        return `${quote}${clean}${quote}`;
                    }
                    return `${quote}${tabsDir}${clean}${quote}`;
                }
            );
        }

        function injectIsolatedHTML(targetEl, htmlString, prefix, tabsDir = "Tabs/") {
            const tempDoc = new DOMParser().parseFromString(htmlString, "text/html");
            const idMap = new Map();

            tempDoc.querySelectorAll("[id]").forEach(el => {
                const oldId = el.getAttribute("id");
                const newId = `${prefix}-${oldId}`;
                idMap.set(oldId, newId);
                el.setAttribute("id", newId);
            });

            tempDoc.querySelectorAll("[src]").forEach(el => {
                const srcVal = el.getAttribute("src");
                if (srcVal) {
                    el.setAttribute("src", resolveTabRelativeUrl(srcVal, tabsDir));
                }
            });

            tempDoc.querySelectorAll("[href]").forEach(el => {
                const hrefVal = el.getAttribute("href");
                if (hrefVal && !hrefVal.startsWith("http") && !hrefVal.startsWith("#") && !hrefVal.startsWith("mailto:") && !hrefVal.startsWith("tel:")) {
                    el.setAttribute("href", resolveTabRelativeUrl(hrefVal, tabsDir));
                }
            });

            tempDoc.querySelectorAll("style").forEach(styleEl => {
                let cssText = styleEl.textContent || "";
                idMap.forEach((newId, oldId) => {
                    const escapedOld = oldId.replace(/[.*+?^${}()|[\]\\]/g, "\\$&");
                    cssText = cssText.replace(
                        new RegExp(`#${escapedOld}(?![A-Za-z0-9_-])`, "g"),
                        `#${newId}`
                    );
                });
                cssText = cssText.replace(/url\(\s*(['"]?)((?:\.\/)?(?:Art|debs|img|images|assets|icons|banners)\/[^'")]+)\1\s*\)/gi, (_, q, p) => {
                    return `url(${q}${resolveTabRelativeUrl(p, tabsDir)}${q})`;
                });
                styleEl.textContent = cssText;
            });

            const parts = [];
            tempDoc.head.querySelectorAll("link, style, script").forEach(node => {
                parts.push(node.outerHTML);
            });
            parts.push(tempDoc.body.innerHTML);

            targetEl.innerHTML = parts.join("\n");

            const scripts = Array.from(targetEl.querySelectorAll("script"));
            scripts.forEach(oldScript => {
                const newScript = document.createElement("script");
                Array.from(oldScript.attributes).forEach(attr => {
                    newScript.setAttribute(attr.name, attr.value);
                });

                if (oldScript.src) {
                    newScript.src = resolveTabRelativeUrl(oldScript.src, tabsDir);
                } else {
                    let code = oldScript.textContent || "";
                    idMap.forEach((newId, oldId) => {
                        const escapedOld = oldId.replace(/[.*+?^${}()|[\]\\]/g, "\\$&");
                        code = code.replace(
                            new RegExp(`(getElementById\\(\\s*["'])${escapedOld}(["']\\s*\\))`, "g"),
                            `$1${newId}$2`
                        );
                        code = code.replace(
                            new RegExp(`(querySelector(?:All)?\\(\\s*["'])#${escapedOld}(["']\\s*\\))`, "g"),
                            `$1#${newId}$2`
                        );
                    });
                    code = rewriteRelativeAssetPathsInCode(code, tabsDir);

                    newScript.textContent = `
                        (() => {
                            try {
                                ${code}
                            } catch (err) {
                                console.warn("Lỗi thực thi script trong ${prefix}:", err);
                            }
                        })();
                    `;
                }

                oldScript.replaceWith(newScript);
            });
        }

        function sortSectionsBySlotSection(container) {
            if (!container) return;
            const sections = Array.from(container.querySelectorAll("section.tab-section"));
            sections
                .sort((a, b) => {
                    const orderA = Number(a.dataset.tabOrder);
                    const orderB = Number(b.dataset.tabOrder);
                    const validA = Number.isFinite(orderA);
                    const validB = Number.isFinite(orderB);
                    if (validA && validB && orderA !== orderB) {
                        return orderA - orderB;
                    }
                    if (validA !== validB) {
                        return validA ? -1 : 1;
                    }
                    return Number(a.dataset.origIndex || 0) - Number(b.dataset.origIndex || 0);
                })
                .forEach((sec, idx) => {
                    sec.style.order = String(idx + 1);
                    container.appendChild(sec);
                });
        }

        async function loadAllTabsAsSections() {
            const tabsContainer = document.getElementById("tabs-container");
            const loadingStatus = document.getElementById("loading-status");

            const { dir: tabsDir, listingHtml } = await resolveTabsDir();
            CURRENT_TABS_DIR = tabsDir;
            listingHtmlCache = listingHtml;

            const files = await discoverHtmlInTabs(tabsDir, listingHtml);
            DISCOVERED_TAB_FILES = files;
            CACHED_JSON_ENTRIES = null;

            if (!files.length) {
                loadingStatus.style.color = "#ff6b6b";
                loadingStatus.textContent = "Không tìm thấy tệp .html nào trong thư mục Tabs/ (Hãy khai báo tên tệp trong KNOWN_TAB_FILES khi chạy trên GitHub Pages).";
                return;
            }

            loadingStatus.remove();

            const fetchedList = await Promise.all(
                files.map(async (file, originalIndex) => {
                    try {
                        const [res, metaInfo] = await Promise.all([
                            fetch(tabsDir + encodeURIComponent(file), { cache: "no-store" }),
                            readSlotSectionForTab(tabsDir, file)
                        ]);
                        if (!res.ok) return null;
                        const html = await res.text();
                        if (isNotFoundPage(html)) return null;
                        return {
                            file,
                            html,
                            slotsection: metaInfo.slotsection,
                            jsonFile: metaInfo.jsonFile,
                            originalIndex
                        };
                    } catch (err) {
                        console.warn("Bỏ qua tệp lỗi:", file, err);
                        return null;
                    }
                })
            );

            const sortedList = fetchedList
                .filter(Boolean)
                .sort((a, b) => {
                    if (a.slotsection !== b.slotsection) {
                        return a.slotsection - b.slotsection;
                    }
                    return a.originalIndex - b.originalIndex;
                });

            sortedList.forEach((item, index) => {
                const sectionEl = document.createElement("section");
                sectionEl.className = "tab-section";
                sectionEl.dataset.sourceFile = tabsDir + item.file;
                sectionEl.dataset.tabFile = item.file;
                sectionEl.dataset.origIndex = String(item.originalIndex);
                if (item.jsonFile) {
                    sectionEl.dataset.matchedJson = item.jsonFile;
                }
                if (Number.isFinite(item.slotsection)) {
                    sectionEl.dataset.slotsection = String(item.slotsection);
                    sectionEl.dataset.tabOrder = String(item.slotsection);
                } else {
                    sectionEl.dataset.slotsection = "none";
                }
                tabsContainer.appendChild(sectionEl);
                injectIsolatedHTML(sectionEl, item.html, `tab${index}`, tabsDir);
            });

            sortSectionsBySlotSection(tabsContainer);
            setTimeout(() => sortSectionsBySlotSection(tabsContainer), 250);
            setTimeout(() => sortSectionsBySlotSection(tabsContainer), 900);
        }

        document.addEventListener("DOMContentLoaded", loadAllTabsAsSections);
    </script>
