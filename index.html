<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trang Chủ Chính</title>
    <style>
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            min-height: 100vh;
            background-color: #000000;
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", Arial, sans-serif;
            overflow-x: hidden;
        }

        body {
            display: flex;
            flex-direction: column;
        }

        /* Header */
        .site-header {
            box-sizing: border-box;
            width: 100%;
            background-color: #2c3e50;
            color: white;
            padding: 1rem 5%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 10;
        }
        .site-header h2 {
            margin: 0;
            font-size: 1.25rem;
        }
        .site-header nav a {
            color: white;
            text-decoration: none;
            margin-left: 16px;
            font-size: 0.95rem;
        }
        .site-header nav a:hover {
            text-decoration: underline;
        }

        /* Khu vực nội dung chính */
        main {
            flex: 1;
            width: 100%;
            padding: 0;
            margin: 0;
            background-color: #000000;
        }

        #tabs-container {
            width: 100%;
            margin: 0;
            padding: 0;
        }

        /* Mỗi tệp HTML là một section nối tiếp, tràn viền */
        #tabs-container > section.tab-section {
            width: 100%;
            max-width: 100%;
            box-sizing: border-box;
            display: block;
        }

        /* Hé rộng hơn phần card tiếp theo bên phải */
        #tabs-container .ios-card-slider:not(.slide-type-fade).has-multiple .ios-game-card {
            flex: 0 0 82%;
            max-width: 82%;
        }

        @media (min-width: 640px) {
            #tabs-container .ios-card-slider:not(.slide-type-fade).has-multiple .ios-game-card {
                flex: 0 0 calc(80% - 7px);
                max-width: calc(80% - 7px);
            }
        }

        @media (min-width: 900px) {
            #tabs-container .ios-card-slider:not(.slide-type-fade).has-multiple .ios-game-card {
                flex: 0 0 calc(62% - 7px);
                max-width: calc(62% - 7px);
            }
        }

        .status-msg {
            padding: 1.5rem 5%;
            color: #9aa5b1;
            background-color: #000000;
            font-size: 14px;
            margin: 0;
        }

        /* Footer */
        .site-footer {
            box-sizing: border-box;
            width: 100%;
            background-color: #2c3e50;
            color: white;
            text-align: center;
            padding: 1rem;
            z-index: 10;
        }
        .site-footer p {
            margin: 0;
        }
    </style>
</head>
<body>

    <!-- Phần đầu trang -->
    <header class="site-header">
        <h2>LOGO WEBSITE</h2>
        <nav>
            <a href="#">Trang chủ</a>
            <a href="#">Dịch vụ</a>
            <a href="#">Liên hệ</a>
        </nav>
    </header>

    <!-- Phần thân trang chứa toàn bộ các section từ thư mục Tabs -->
    <main>
        <div id="tabs-container">
            <p class="status-msg" id="loading-status">Đang tải nội dung từ thư mục Tabs...</p>
        </div>
    </main>

    <!-- Phần chân trang -->
    <footer class="site-footer">
        <p>&copy; 2026 Bản quyền thuộc về Website của bạn.</p>
    </footer>

    <script>
        function isNotFoundPage(html) {
            if (!html) return true;
            const upper = html.toUpperCase();
            return (
                upper.includes("PAGE NOT FOUND") ||
                upper.includes("404 NOT FOUND") ||
                upper.includes("CANNOT GET ") ||
                (upper.includes("<TITLE>404") && !upper.includes("IOS-GAME-SECTION"))
            );
        }

        function extractHtmlFileName(rawPath) {
            if (!rawPath || typeof rawPath !== "string") return "";
            const trimmed = rawPath.trim();
            if (!trimmed) return "";

            if (trimmed.startsWith("http://") || trimmed.startsWith("https://")) {
                try {
                    const u = new URL(trimmed);
                    const last = decodeURIComponent(u.pathname.split("/").pop() || "");
                    return last.toLowerCase().endsWith(".html") && last.toLowerCase() !== "index.html" ? last : "";
                } catch (_) {
                    return "";
                }
            }

            const noQuery = trimmed.split("?")[0].split("#")[0];
            const last = decodeURIComponent(noQuery.split("/").pop() || "");
            if (!last || last.toLowerCase() === "index.html") return "";
            return last.toLowerCase().endsWith(".html") ? last : "";
        }

        async function resolveTabsDir() {
            for (const dir of ["Tabs/", "tabs/"]) {
                try {
                    const res = await fetch(dir, { cache: "no-store" });
                    if (res.ok) {
                        const text = await res.text();
                        if (!isNotFoundPage(text)) {
                            return { dir, listingHtml: text };
                        }
                    }
                } catch (_) {}
            }
            return { dir: "Tabs/", listingHtml: "" };
        }

        async function discoverHtmlInTabs(listingHtml) {
            const foundMap = new Map();

            const addFile = (name) => {
                const clean = extractHtmlFileName(name);
                if (!clean) return;
                const key = clean.toLowerCase();
                if (!foundMap.has(key)) {
                    foundMap.set(key, clean);
                }
            };

            if (listingHtml) {
                const doc = new DOMParser().parseFromString(listingHtml, "text/html");

                doc.querySelectorAll("a[href]").forEach(a => {
                    addFile(a.getAttribute("href"));
                });

                const rawMatches = listingHtml.match(/[A-Za-z0-9_\-\.%À-ỹ ]+\.html\b/gi);
                if (rawMatches) {
                    rawMatches.forEach(m => addFile(m));
                }
            }

            return Array.from(foundMap.values()).sort((a, b) =>
                a.localeCompare(b, "vi", { numeric: true, sensitivity: "base" })
            );
        }

        function extractJsonCandidatesFromHtml(html, tabsDir, htmlFile) {
            const candidates = [];
            const seen = new Set();
            const addCand = (p) => {
                if (!p || typeof p !== "string") return;
                const clean = p.trim();
                if (!clean || seen.has(clean.toLowerCase())) return;
                seen.add(clean.toLowerCase());
                candidates.push(clean);
            };

            const quotedJsonMatches = html.match(/["']([^"'\s]+\.json(?:\?[^"'\s]*)?)["']/gi) || [];
            quotedJsonMatches.forEach(m => {
                const raw = m.slice(1, -1).split("?")[0];
                if (raw.startsWith("http://") || raw.startsWith("https://") || raw.startsWith("/")) {
                    addCand(raw);
                } else if (raw.toLowerCase().startsWith("tabs/")) {
                    addCand(raw);
                } else {
                    addCand(tabsDir + raw);
                }
            });

            const baseName = htmlFile.replace(/\.html$/i, "");
            addCand(`${tabsDir}${baseName}.json`);
            addCand(`${baseName}.json`);
            if (baseName.toLowerCase() === "appios") {
                addCand(`${tabsDir}Appios.json`);
                addCand(`Appios.json`);
            }

            return candidates;
        }

        async function readSlotSectionForTab(tabsDir, file, html) {
            const candidates = extractJsonCandidatesFromHtml(html, tabsDir, file);
            for (const url of candidates) {
                try {
                    const res = await fetch(url, { cache: "no-store" });
                    if (!res.ok) continue;
                    const json = await res.json();
                    const rawSlot = json && json.sliderConfig && json.sliderConfig.slotsection;
                    const parsed = Number(rawSlot);
                    if (Number.isFinite(parsed)) {
                        return parsed;
                    }
                } catch (_) {}
            }
            return Number.POSITIVE_INFINITY;
        }

        function injectIsolatedHTML(targetEl, htmlString, prefix) {
            const tempDoc = new DOMParser().parseFromString(htmlString, "text/html");
            const idMap = new Map();

            tempDoc.querySelectorAll("[id]").forEach(el => {
                const oldId = el.getAttribute("id");
                const newId = `${prefix}-${oldId}`;
                idMap.set(oldId, newId);
                el.setAttribute("id", newId);
            });

            tempDoc.querySelectorAll("style").forEach(styleEl => {
                let cssText = styleEl.textContent || "";
                idMap.forEach((newId, oldId) => {
                    const escapedOld = oldId.replace(/[.*+?^${}()|[\]\\]/g, "\\$&");
                    cssText = cssText.replace(
                        new RegExp(`#${escapedOld}(?![A-Za-z0-9_-])`, "g"),
                        `#${newId}`
                    );
                });
                styleEl.textContent = cssText;
            });

            const parts = [];
            tempDoc.head.querySelectorAll("link, style, script").forEach(node => {
                parts.push(node.outerHTML);
            });
            parts.push(tempDoc.body.innerHTML);

            targetEl.innerHTML = parts.join("\n");

            const scripts = Array.from(targetEl.querySelectorAll("script"));
            scripts.forEach(oldScript => {
                const newScript = document.createElement("script");
                Array.from(oldScript.attributes).forEach(attr => {
                    newScript.setAttribute(attr.name, attr.value);
                });

                if (oldScript.src) {
                    newScript.src = oldScript.src;
                } else {
                    let code = oldScript.textContent || "";
                    idMap.forEach((newId, oldId) => {
                        const escapedOld = oldId.replace(/[.*+?^${}()|[\]\\]/g, "\\$&");
                        code = code.replace(
                            new RegExp(`(getElementById\\(\\s*["'])${escapedOld}(["']\\s*\\))`, "g"),
                            `$1${newId}$2`
                        );
                    });

                    newScript.textContent = `
                        try {
                            ${code}
                        } catch (err) {
                            console.warn("Lỗi thực thi script trong ${prefix}:", err);
                        }
                    `;
                }

                oldScript.replaceWith(newScript);
            });
        }

        async function loadAllTabsAsSections() {
            const tabsContainer = document.getElementById("tabs-container");
            const loadingStatus = document.getElementById("loading-status");

            const { dir: tabsDir, listingHtml } = await resolveTabsDir();
            const files = await discoverHtmlInTabs(listingHtml);

            if (!files.length) {
                loadingStatus.style.color = "#ff6b6b";
                loadingStatus.textContent = "Không tìm thấy tệp .html nào trong thư mục Tabs/ (Hãy chạy qua web server như Live Server có bật liệt kê thư mục).";
                return;
            }

            loadingStatus.remove();

            const fetchedList = await Promise.all(
                files.map(async (file, originalIndex) => {
                    try {
                        const res = await fetch(tabsDir + encodeURIComponent(file), { cache: "no-store" });
                        if (!res.ok) return null;
                        const html = await res.text();
                        if (isNotFoundPage(html)) return null;
                        const slotsection = await readSlotSectionForTab(tabsDir, file, html);
                        return { file, html, slotsection, originalIndex };
                    } catch (err) {
                        console.warn("Bỏ qua tệp lỗi:", file, err);
                        return null;
                    }
                })
            );

            const sortedList = fetchedList
                .filter(Boolean)
                .sort((a, b) => {
                    if (a.slotsection !== b.slotsection) {
                        return a.slotsection - b.slotsection;
                    }
                    return a.originalIndex - b.originalIndex;
                });

            sortedList.forEach((item, index) => {
                const sectionEl = document.createElement("section");
                sectionEl.className = "tab-section";
                sectionEl.dataset.sourceFile = tabsDir + item.file;
                if (Number.isFinite(item.slotsection)) {
                    sectionEl.dataset.slotsection = String(item.slotsection);
                }
                tabsContainer.appendChild(sectionEl);
                injectIsolatedHTML(sectionEl, item.html, `tab${index}`);
            });
        }

        document.addEventListener("DOMContentLoaded", loadAllTabsAsSections);
    </script>

</body>
</html>
