            }, 14000);

            notifyBtn.addEventListener("click", async (e) => {
                e.stopPropagation();
                triggerBellRing(true);

                const feedItems = await markAllRecentUpdatesSeenAndResetBadge(true);

                if (panel) {
                    if (panel.classList.contains("active") && PANEL_MODE === "recent-updates") {
                        panel.classList.remove("active");
                        updateBackdropState();
                    } else {
                        PANEL_MODE = "recent-updates";
                        renderActivityHistoryPanel(feedItems);
                        panel.classList.add("active");
                        updateBackdropState();
                    }
                }
            });

            document.addEventListener("click", (e) => {
                if (tooltip && !tooltip.contains(e.target) && !notifyBtn.contains(e.target)) {
                    tooltip.classList.remove("active");
                }
            });

            window.addEventListener("beforeunload", () => clearInterval(intervalId));
        })();

        function collectJsonEntries(node, sourceFile, tabsDir, out = []) {
            if (!node || typeof node !== "object") return out;

            if (Array.isArray(node)) {
                node.forEach(item => collectJsonEntries(item, sourceFile, tabsDir, out));
                return out;
            }

            const title =
                node.title || node.name || node.appName || node.tweakName || node.heading || "";
            const author =
                extractFieldValue(node, ["author", "developer", "creator", "by", "vendor", "provider", "publisher"]) || "";
            const version =
                extractFieldValue(node, ["version", "ver", "appVersion"]) || "";
            const category =
                extractFieldValue(node, ["category", "type", "genre", "tab"]) || "";
            const sizeText =
                extractFieldValue(node, ["size", "fileSize", "filesize", "appSize"]) || "";
            const content =
                extractFieldValue(node, ["fullDescription", "longDescription", "details", "about", "notes", "description", "desc", "content", "subtitle", "summary"]) || "";
            const link =
                node.url || node.link || node.download || node.downloadUrl || node.buttonUrl || node.ipa || node.deb || "#";
            const rawIcon =
                extractFieldValue(node, ["icon", "image", "img", "thumbnail", "cover", "logo"]) || "";
            const dateText =
                extractFieldValue(node, ["updatedAt", "updated_at", "lastUpdated", "releaseDate", "date", "createdAt", "time"]) || "";

            const hasMeaningfulField =
                typeof title === "string" || typeof author === "string" || typeof content === "string";

            if (hasMeaningfulField && (title || author || content)) {
                out.push({
                    title: String(title || "Không có tiêu đề"),
                    author: String(author || ""),
                    version: String(version || ""),
                    category: String(category || ""),
                    size: String(sizeText || ""),
                    content: String(content || ""),
                    link: String(link || "#"),
                    icon: rawIcon ? resolveTabRelativeUrl(String(rawIcon), tabsDir) : "",
                    dateText: String(dateText || ""),
                    sourceFile,
                    rawData: node
                });
            }

            Object.values(node).forEach(val => {
                if (val && typeof val === "object") {
                    collectJsonEntries(val, sourceFile, tabsDir, out);
                }
            });

            return out;
        }

        async function loadAllJsonEntriesFromTabs(forceRefresh = false) {
            if (!forceRefresh && CACHED_JSON_ENTRIES) return CACHED_JSON_ENTRIES;
            if (!forceRefresh && INFLIGHT_JSON_PROMISE) return INFLIGHT_JSON_PROMISE;

            const runFetch = async () => {
                const candidateUrls = new Set();
                const addUrl = (u) => {
                    if (!u) return;
                    candidateUrls.add(u);
                };

                DISCOVERED_TAB_FILES.forEach(file => {
                    getMatchedJsonUrlsForHtmlFile(CURRENT_TABS_DIR, file).forEach(addUrl);
                });

                ["manifest.json", "Slide.json", "Appios.json", "Tweak.json"].forEach(name => {
                    addUrl(`${CURRENT_TABS_DIR}${name}`);
                });

                if (listingHtmlCache) {
                    const jsonMatches = listingHtmlCache.match(/[A-Za-z0-9_\-\.%À-ỹ ]+\.json\b/gi) || [];
                    jsonMatches.forEach(m => addUrl(`${CURRENT_TABS_DIR}${m}`));
                }

                const urlsArray = Array.from(candidateUrls);
                const entries = [];
                const rawMap = new Map();

                const results = await Promise.all(
                    urlsArray.map(async (url) => {
                        try {
                            const res = await fetchWithTimeout(url, 3500);
                            if (!res.ok) return null;
                            const data = await res.json();
                            return { url, data };
                        } catch (_) {
                            return null;
                        }
                    })
                );

                results.forEach(item => {
                    if (!item) return;
                    rawMap.set(item.url, item.data);
                    collectJsonEntries(item.data, item.url, CURRENT_TABS_DIR, entries);
                });

                CACHED_JSON_RAW_BY_URL = rawMap;
                CACHED_JSON_ENTRIES = entries;
                INFLIGHT_JSON_PROMISE = null;
                return entries;
            };

            INFLIGHT_JSON_PROMISE = runFetch();
            return INFLIGHT_JSON_PROMISE;
        }

        function escapeHtml(str) {
            return String(str)
                .replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;")
                .replace(/"/g, "&quot;");
        }

        function escapeAttr(str) {
            return escapeHtml(str).replace(/'/g, "&#39;");
        }

        // Khai báo tên các tệp .html nằm trong thư mục Tabs/
        const KNOWN_TAB_FILES = [
            "Slide.html",
            "Appios.html",
            "Tweak.html"
        ];

        // Thứ tự ưu tiên mặc định nếu tệp JSON chưa khai báo slotsection
        const DEFAULT_SLOT_PRIORITY = {
            "slide.html": 1,
            "appios.html": 2,
            "tweak.html": 3
        };

        let listingHtmlCache = "";

        function isNotFoundPage(html) {
            if (!html) return true;
            const upper = html.toUpperCase();
            return (
                upper.includes("PAGE NOT FOUND") ||
                upper.includes("404 NOT FOUND") ||
                upper.includes("CANNOT GET ") ||
                (upper.includes("<TITLE>404") && !upper.includes("IOS-GAME-SECTION"))
            );
        }

        function extractHtmlFileName(rawPath) {
            if (!rawPath || typeof rawPath !== "string") return "";
            const trimmed = rawPath.trim();
            if (!trimmed) return "";

            if (trimmed.startsWith("http://") || trimmed.startsWith("https://")) {
                try {
                    const u = new URL(trimmed);
                    const last = decodeURIComponent(u.pathname.split("/").pop() || "");
                    return last.toLowerCase().endsWith(".html") && last.toLowerCase() !== "index.html" ? last : "";
                } catch (_) {
                    return "";
                }
            }

            const noQuery = trimmed.split("?")[0].split("#")[0];
            const last = decodeURIComponent(noQuery.split("/").pop() || "");
            if (!last || last.toLowerCase() === "index.html") return "";
            return last.toLowerCase().endsWith(".html") ? last : "";
        }

        async function resolveTabsDir() {
            const results = await Promise.all(
                ["Tabs/", "tabs/"].map(async (dir) => {
                    try {
                        const res = await fetchWithTimeout(dir, 2500);
                        if (res.ok) {
                            const text = await res.text();
                            if (!isNotFoundPage(text)) {
                                return { dir, listingHtml: text };
                            }
                        }
                    } catch (_) {}
                    return null;
                })
            );
            return results.find(Boolean) || { dir: "Tabs/", listingHtml: "" };
        }

        async function loadManifestFiles(tabsDir) {
            for (const manifestName of ["manifest.json"]) {
                try {
                    const res = await fetchWithTimeout(tabsDir + manifestName, 2500);
                    if (!res.ok) continue;
                    const data = await res.json();
                    const list = Array.isArray(data) ? data : (Array.isArray(data.files) ? data.files : []);
                    if (list.length) return list;
                } catch (_) {}
            }
            return [];
        }

        async function discoverHtmlInTabs(tabsDir, listingHtml) {
            const foundMap = new Map();

            const addFile = (name) => {
                const clean = extractHtmlFileName(name);
                if (!clean) return;
                const key = clean.toLowerCase();
                if (!foundMap.has(key)) {
                    foundMap.set(key, clean);
                }
            };

            KNOWN_TAB_FILES.forEach(addFile);

            const manifestFiles = await loadManifestFiles(tabsDir);
            manifestFiles.forEach(addFile);

            if (listingHtml) {
                const doc = new DOMParser().parseFromString(listingHtml, "text/html");

                doc.querySelectorAll("a[href]").forEach(a => {
                    addFile(a.getAttribute("href"));
                });

                const rawMatches = listingHtml.match(/[A-Za-z0-9_\-\.%À-ỹ ]+\.html\b/gi);
                if (rawMatches) {
                    rawMatches.forEach(m => addFile(m));
                }
            }

            return Array.from(foundMap.values()).sort((a, b) => {
                const pA = DEFAULT_SLOT_PRIORITY[a.toLowerCase()] ?? 50;
                const pB = DEFAULT_SLOT_PRIORITY[b.toLowerCase()] ?? 50;
                if (pA !== pB) return pA - pB;
                return a.localeCompare(b, "vi", { numeric: true, sensitivity: "base" });
            });
        }

        function getMatchedJsonUrlsForHtmlFile(tabsDir, htmlFile) {
            const candidates = [];
            const seen = new Set();
            const addCand = (p) => {
                if (!p || typeof p !== "string") return;
                const clean = p.trim();
                if (!clean || seen.has(clean.toLowerCase())) return;
                seen.add(clean.toLowerCase());
                candidates.push(clean);
            };

            const baseName = String(htmlFile || "").replace(/\.html$/i, "");
            if (!baseName) return candidates;

            addCand(`${tabsDir}${baseName}.json`);
            if (baseName.toLowerCase() !== baseName) {
                addCand(`${tabsDir}${baseName.toLowerCase()}.json`);
            }

            if (listingHtmlCache) {
                const escapedBase = baseName.replace(/[.*+?^${}()|[\]\\]/g, "\\$&");
                const regex = new RegExp(`(?:^|[^A-Za-z0-9_\\-])(${escapedBase}\\.json)(?:$|[^A-Za-z0-9_\\-])`, "gi");
                let match;
                while ((match = regex.exec(listingHtmlCache)) !== null) {
                    addCand(`${tabsDir}${match[1]}`);
                }
            }

            return candidates;
        }

        function findSlotSectionValue(node) {
            if (!node || typeof node !== "object" || Array.isArray(node)) return undefined;
            for (const key of ["slotsection", "slotSection", "slot_section", "order"]) {
                if (node[key] !== undefined && node[key] !== null && node[key] !== "") {
                    return node[key];
                }
            }
            for (const val of Object.values(node)) {
                if (val && typeof val === "object" && !Array.isArray(val)) {
                    const found = findSlotSectionValue(val);
                    if (found !== undefined) return found;
                }
            }
            return undefined;
        }

        function extractOrderNumber1To100(json) {
            if (!json || typeof json !== "object") return Number.POSITIVE_INFINITY;
            const rawVal = findSlotSectionValue(json);
            const num = Number(rawVal);
            if (Number.isFinite(num) && num >= 1 && num <= 100) {
                return num;
            }
            return Number.POSITIVE_INFINITY;
        }

        async function readSlotSectionForTab(tabsDir, file) {
            const candidates = getMatchedJsonUrlsForHtmlFile(tabsDir, file);
            const checks = await Promise.all(
                candidates.map(async (url) => {
                    try {
                        const res = await fetchWithTimeout(url, 3000);
                        if (!res.ok) return null;
                        const json = await res.json();
                        const orderNum = extractOrderNumber1To100(json);
                        if (Number.isFinite(orderNum)) {
                            return { slotsection: orderNum, jsonFile: url };
                        }
                    } catch (_) {}
                    return null;
                })
            );
            const hit = checks.find(Boolean);
            if (hit) return hit;

            const fallbackPriority = DEFAULT_SLOT_PRIORITY[String(file || "").toLowerCase()];
            return {
                slotsection: Number.isFinite(fallbackPriority) ? fallbackPriority : Number.POSITIVE_INFINITY,
                jsonFile: ""
            };
        }

        function resolveTabRelativeUrl(rawUrl, tabsDir) {
            if (!rawUrl || typeof rawUrl !== "string") return rawUrl;
            const trimmed = rawUrl.trim();
            if (
                !trimmed ||
                trimmed.startsWith("http://") ||
                trimmed.startsWith("https://") ||
                trimmed.startsWith("data:") ||
                trimmed.startsWith("blob:") ||
                trimmed.startsWith("/") ||
                trimmed.startsWith("#") ||
                trimmed.toLowerCase().startsWith("tabs/")
            ) {
                return trimmed;
            }
            const clean = trimmed.replace(/^\.\//, "");
            return `${tabsDir}${clean}`;
        }

        function rewriteRelativeAssetPathsInCode(code, tabsDir) {
            const escapedDir = tabsDir.replace(/[.*+?^${}()|[\]\\]/g, "\\$&");
            return code.replace(
                /(["'])((?:\.\/)?(?:[A-Za-z0-9_\-\.%À-ỹ]+\.json|(?:Art|debs|img|images|assets|icons|banners|slides|media)\/[^"']+))\1/gi,
                (match, quote, relPath) => {
                    if (/^(?:https?:|data:|blob:|\/|#)/i.test(relPath)) return match;
                    const clean = relPath.replace(/^\.\//, "");
                    if (new RegExp(`^${escapedDir}`, "i").test(clean)) {
                        return `${quote}${clean}${quote}`;
                    }
                    return `${quote}${tabsDir}${clean}${quote}`;
                }
            );
        }

        function scopeCssRules(cssText, scopeSelector) {
            return cssText.replace(/(^|\})\s*([^{}@]+)\{/g, (match, brace, selectorGroup) => {
                const trimmedGroup = selectorGroup.trim();
                if (!trimmedGroup || trimmedGroup.startsWith("@") || /^(from|to|\d+%)$/i.test(trimmedGroup)) {
                    return match;
                }
                const scopedSelectors = trimmedGroup
                    .split(",")
                    .map(sel => {
                        const s = sel.trim();
                        if (!s) return s;
                        if (/^(html|body|:root)$/i.test(s)) {
                            return scopeSelector;
                        }
                        if (/^(html|body)\s+/i.test(s)) {
                            return s.replace(/^(html|body)\s+/i, `${scopeSelector} `);
                        }
                        if (s.startsWith(scopeSelector)) {
                            return s;
                        }
                        return `${scopeSelector} ${s}`;
                    })
                    .join(", ");
                return `${brace}\n${scopedSelectors} {`;
            });
        }

        function injectIsolatedHTML(targetEl, htmlString, prefix, tabsDir = "Tabs/") {
            const tempDoc = new DOMParser().parseFromString(htmlString, "text/html");
            const idMap = new Map();
            const scopeClass = `scope-${prefix}`;
            targetEl.classList.add(scopeClass);

            tempDoc.querySelectorAll("[id]").forEach(el => {
                const oldId = el.getAttribute("id");
                const newId = `${prefix}-${oldId}`;
                idMap.set(oldId, newId);
                el.setAttribute("id", newId);
            });

            tempDoc.querySelectorAll("[src]").forEach(el => {
                const srcVal = el.getAttribute("src");
                if (srcVal) {
                    el.setAttribute("src", resolveTabRelativeUrl(srcVal, tabsDir));
                }
            });

            tempDoc.querySelectorAll("[href]").forEach(el => {
                const hrefVal = el.getAttribute("href");
                if (hrefVal && !hrefVal.startsWith("http") && !hrefVal.startsWith("#") && !hrefVal.startsWith("mailto:") && !hrefVal.startsWith("tel:")) {
                    el.setAttribute("href", resolveTabRelativeUrl(hrefVal, tabsDir));
                }
            });

            tempDoc.querySelectorAll("style").forEach(styleEl => {
                let cssText = styleEl.textContent || "";
                idMap.forEach((newId, oldId) => {
                    const escapedOld = oldId.replace(/[.*+?^${}()|[\]\\]/g, "\\$&");
                    cssText = cssText.replace(
                        new RegExp(`#${escapedOld}(?![A-Za-z0-9_-])`, "g"),
                        `#${newId}`
                    );
                });
                cssText = cssText.replace(/url\(\s*(['"]?)((?:\.\/)?(?:Art|debs|img|images|assets|icons|banners|slides|media)\/[^'")]+)\1\s*\)/gi, (_, q, p) => {
                    return `url(${q}${resolveTabRelativeUrl(p, tabsDir)}${q})`;
                });
                cssText = scopeCssRules(cssText, `.${scopeClass}`);
                styleEl.textContent = cssText;
            });

            const parts = [];
            tempDoc.head.querySelectorAll("link, style, script").forEach(node => {
                parts.push(node.outerHTML);
            });
            parts.push(tempDoc.body.innerHTML);

            targetEl.innerHTML = parts.join("\n");

            const scripts = Array.from(targetEl.querySelectorAll("script"));
            scripts.forEach(oldScript => {
                const newScript = document.createElement("script");
                Array.from(oldScript.attributes).forEach(attr => {
                    newScript.setAttribute(attr.name, attr.value);
                });

                if (oldScript.src) {
                    newScript.src = resolveTabRelativeUrl(oldScript.src, tabsDir);
                } else {
                    let code = oldScript.textContent || "";
                    idMap.forEach((newId, oldId) => {
                        const escapedOld = oldId.replace(/[.*+?^${}()|[\]\\]/g, "\\$&");
                        code = code.replace(
                            new RegExp(`(getElementById\\(\\s*["'])${escapedOld}(["']\\s*\\))`, "g"),
                            `$1${newId}$2`
                        );
                        code = code.replace(
                            new RegExp(`(querySelector(?:All)?\\(\\s*["'])#${escapedOld}(["']\\s*\\))`, "g"),
                            `$1#${newId}$2`
                        );
                    });
                    code = rewriteRelativeAssetPathsInCode(code, tabsDir);

                    newScript.textContent = `
                        (() => {
                            try {
                                const __origDocAddEvent = document.addEventListener.bind(document);
                                const __origWinAddEvent = window.addEventListener.bind(window);
                                const __scopedDoc = new Proxy(document, {
                                    get(target, prop) {
                                        if (prop === "addEventListener") {
                                            return (type, listener, options) => {
                                                if (type === "DOMContentLoaded" && typeof listener === "function") {
                                                    setTimeout(() => listener.call(document, new Event("DOMContentLoaded")), 0);
                                                    return;
                                                }
                                                return __origDocAddEvent(type, listener, options);
                                            };
                                        }
                                        const val = target[prop];
                                        return typeof val === "function" ? val.bind(target) : val;
                                    }
                                });
                                const __scopedWin = new Proxy(window, {
                                    get(target, prop) {
                                        if (prop === "addEventListener") {
                                            return (type, listener, options) => {
                                                if ((type === "DOMContentLoaded" || type === "load") && typeof listener === "function") {
                                                    setTimeout(() => listener.call(window, new Event(type)), 0);
                                                    return;
                                                }
                                                return __origWinAddEvent(type, listener, options);
                                            };
                                        }
                                        const val = target[prop];
                                        return typeof val === "function" ? val.bind(target) : val;
                                    }
                                });
                                ((document, window) => {
                                    ${code}
                                })(__scopedDoc, __scopedWin);
                            } catch (err) {
                                console.warn("Lỗi thực thi script trong ${prefix}:", err);
                            }
                        })();
                    `;
                }

                oldScript.replaceWith(newScript);
            });
        }

        function sortSectionsBySlotSection(container) {
            if (!container) return;
            const sections = Array.from(container.querySelectorAll("section.tab-section"));
            sections
                .sort((a, b) => {
                    const orderA = Number(a.dataset.tabOrder);
                    const orderB = Number(b.dataset.tabOrder);
                    const validA = Number.isFinite(orderA);
                    const validB = Number.isFinite(orderB);
                    if (validA && validB && orderA !== orderB) {
                        return orderA - orderB;
                    }
                    if (validA !== validB) {
                        return validA ? -1 : 1;
                    }
                    return Number(a.dataset.origIndex || 0) - Number(b.dataset.origIndex || 0);
                })
                .forEach((sec, idx) => {
                    sec.style.order = String(idx + 1);
                    container.appendChild(sec);
                });
        }

        async function loadAllTabsAsSections() {
            const tabsContainer = document.getElementById("tabs-container");
            const loadingStatus = document.getElementById("loading-status");

            try {
                invalidateJsonCache();

                const { dir: tabsDir, listingHtml } = await resolveTabsDir();
                CURRENT_TABS_DIR = tabsDir;
                listingHtmlCache = listingHtml;

                const files = await discoverHtmlInTabs(tabsDir, listingHtml);
                DISCOVERED_TAB_FILES = files;

                if (!files.length) {
                    if (loadingStatus) {
                        loadingStatus.style.color = "#ff6b6b";
                        loadingStatus.textContent = "Không tìm thấy tệp .html nào trong thư mục Tabs/ (Hãy khai báo tên tệp trong KNOWN_TAB_FILES khi chạy trên GitHub Pages).";
                    }
                    return;
                }

                if (loadingStatus) {
                    loadingStatus.remove();
                }

                const fetchedList = await Promise.all(
                    files.map(async (file, originalIndex) => {
                        try {
                            const [res, metaInfo] = await Promise.all([
                                fetchWithTimeout(tabsDir + encodeURIComponent(file), 4000),
                                readSlotSectionForTab(tabsDir, file)
                            ]);
                            if (!res.ok) return null;
                            const html = await res.text();
                            if (isNotFoundPage(html)) return null;
                            return {
                                file,
                                html,
                                slotsection: metaInfo.slotsection,
                                jsonFile: metaInfo.jsonFile,
                                originalIndex
                            };
                        } catch (err) {
                            console.warn("Bỏ qua tệp lỗi:", file, err);
                            return null;
                        }
                    })
                );

                const sortedList = fetchedList
                    .filter(Boolean)
                    .sort((a, b) => {
                        if (a.slotsection !== b.slotsection) {
                            return a.slotsection - b.slotsection;
                        }
                        return a.originalIndex - b.originalIndex;
                    });

                sortedList.forEach((item, index) => {
                    const sectionEl = document.createElement("section");
                    sectionEl.className = "tab-section";
                    sectionEl.dataset.sourceFile = tabsDir + item.file;
                    sectionEl.dataset.tabFile = item.file;
                    sectionEl.dataset.origIndex = String(item.originalIndex);
                    if (item.jsonFile) {
                        sectionEl.dataset.matchedJson = item.jsonFile;
                    }
                    if (Number.isFinite(item.slotsection)) {
                        sectionEl.dataset.slotsection = String(item.slotsection);
                        sectionEl.dataset.tabOrder = String(item.slotsection);
                    } else {
                        sectionEl.dataset.slotsection = "none";
                    }
                    tabsContainer.appendChild(sectionEl);
                    injectIsolatedHTML(sectionEl, item.html, `tab${index}`, tabsDir);
                });

                sortSectionsBySlotSection(tabsContainer);
                setTimeout(() => sortSectionsBySlotSection(tabsContainer), 180);
                await refreshUnreadNewUpdatesBadge(true);
            } catch (err) {
                console.error("Lỗi tải nội dung Tabs:", err);
                if (loadingStatus) {
                    loadingStatus.style.color = "#ff6b6b";
                    loadingStatus.textContent = "Không thể tải nội dung từ thư mục Tabs/. Vui lòng kiểm tra Console.";
                }
            }
        }

        document.addEventListener("DOMContentLoaded", () => {
            loadAllTabsAsSections();
        });
    </script>
