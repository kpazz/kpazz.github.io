<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>KPazz Store - Liquid Glass Ecosystem</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" />
    <style>
        :root {
            --bg-page: #eef2f7;
            --bg-gradient: radial-gradient(circle at 15% 20%, #dbeafe 0%, transparent 45%),
                radial-gradient(circle at 85% 80%, #fce7f3 0%, transparent 45%),
                #eef2f7;
            --text-primary: #0f172a;
            --text-secondary: #475569;
            --glass-bg: rgba(255, 255, 255, 0.58);
            --glass-bg-strong: rgba(255, 255, 255, 0.78);
            --glass-border: rgba(255, 255, 255, 0.85);
            --glass-shadow: 0 8px 32px rgba(15, 23, 42, 0.08), inset 0 1px 1px rgba(255, 255, 255, 0.9);
            --accent: #2563eb;
            --accent-glow: rgba(37, 99, 235, 0.28);
            --danger: #ef4444;
        }

        html.dark {
            --bg-page: #070b14;
            --bg-gradient: radial-gradient(circle at 15% 20%, rgba(30, 58, 138, 0.35) 0%, transparent 45%),
                radial-gradient(circle at 85% 80%, rgba(88, 28, 135, 0.3) 0%, transparent 45%),
                #070b14;
            --text-primary: #f8fafc;
            --text-secondary: #94a3b8;
            --glass-bg: rgba(15, 23, 42, 0.55);
            --glass-bg-strong: rgba(15, 23, 42, 0.82);
            --glass-border: rgba(255, 255, 255, 0.14);
            --glass-shadow: 0 12px 36px rgba(0, 0, 0, 0.45), inset 0 1px 1px rgba(255, 255, 255, 0.15);
            --accent: #38bdf8;
            --accent-glow: rgba(56, 189, 248, 0.3);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            touch-action: manipulation;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", Roboto, sans-serif;
            background: var(--bg-gradient);
            background-attachment: fixed;
            color: var(--text-primary);
            min-height: 100vh;
            transition: background 0.45s ease, color 0.35s ease;
            overflow-x: hidden;
            touch-action: manipulation;
        }

        /* Hiệu ứng Liquid Glass dùng chung toàn hệ thống */
        .liquid-glass {
            background: var(--glass-bg);
            backdrop-filter: blur(22px) saturate(185%);
            -webkit-backdrop-filter: blur(22px) saturate(185%);
            border: 1px solid var(--glass-border);
            box-shadow: var(--glass-shadow);
        }

        .liquid-glass-strong {
            background: var(--glass-bg-strong);
            backdrop-filter: blur(28px) saturate(200%);
            -webkit-backdrop-filter: blur(28px) saturate(200%);
            border: 1px solid var(--glass-border);
            box-shadow: var(--glass-shadow);
        }

        /* NAVBAR THÔNG MINH */
        #kp-navbar {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 62px;
            z-index: 1000;
            border-radius: 0px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 18px;
            transition:
                top 0.5s cubic-bezier(0.22, 1, 0.36, 1),
                left 0.5s cubic-bezier(0.22, 1, 0.36, 1),
                width 0.55s cubic-bezier(0.22, 1, 0.36, 1),
                border-radius 0.5s cubic-bezier(0.22, 1, 0.36, 1),
                padding 0.45s ease;
            overflow: visible;
        }

        /* Trạng thái lướt trang: tách khỏi nền, cách lề 5px, bo 4 góc */
        #kp-navbar.nav-floating {
            top: 5px;
            left: 5px;
            width: calc(100% - 10px);
            border-radius: 18px;
        }

        /* Trạng thái cuộn >= 40%: thu gọn mượt từ phải qua trái chỉ còn cụm icon */
        #kp-navbar.nav-compact {
            top: 5px;
            left: 5px;
            width: 224px;
            border-radius: 30px;
            padding: 0 10px;
        }

        .nav-left,
        .nav-right {
            display: flex;
            align-items: center;
            gap: 10px;
            transition: opacity 0.35s ease, transform 0.45s cubic-bezier(0.22, 1, 0.36, 1);
        }

        .brand-trigger {
            display: flex;
            align-items: center;
            gap: 9px;
            cursor: pointer;
            user-select: none;
            position: relative;
            padding: 4px 8px;
            border-radius: 12px;
            transition: transform 0.25s ease, opacity 0.3s ease;
        }

        .brand-trigger:active {
            transform: scale(0.95);
        }

        .brand-trigger img {
            width: 32px;
            height: 32px;
            border-radius: 8px;
            object-fit: cover;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.2);
        }

        .brand-name {
            font-weight: 800;
            font-size: 1.18rem;
            letter-spacing: -0.3px;
            background: linear-gradient(135deg, var(--accent), #a855f7);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        /* Dòng thông báo trạng thái ngay tại vị trí Logo & KPazz */
        #nav-brand-tooltip {
            position: absolute;
            left: 0;
            top: 50%;
            transform: translateY(-50%) scale(0.9);
            opacity: 0;
            pointer-events: none;
            white-space: nowrap;
            font-size: 0.78rem;
            font-weight: 600;
            padding: 6px 12px;
            border-radius: 999px;
            background: var(--accent);
            color: #fff;
            box-shadow: 0 6px 18px var(--accent-glow);
            transition: opacity 0.35s ease, transform 0.35s cubic-bezier(0.22, 1, 0.36, 1);
            z-index: 20;
        }

        #nav-brand-tooltip.show {
            opacity: 1;
            transform: translateY(-50%) scale(1);
        }

        #kp-navbar.nav-compact .brand-trigger {
            width: 0;
            opacity: 0;
            padding: 0;
            overflow: hidden;
            pointer-events: none;
        }

        .icon-btn {
            position: relative;
            width: 38px;
            height: 38px;
            border-radius: 12px;
            border: 1px solid var(--glass-border);
            background: rgba(255, 255, 255, 0.18);
            color: var(--text-primary);
            display: inline-flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.22, 1, 0.36, 1);
            font-size: 0.95rem;
        }

        .icon-btn:hover {
            background: var(--accent);
            color: #fff;
            transform: translateY(-1px);
        }

        /* Khi thu gọn 40%, ẩn nút account và hiện nút lịch sử */
        #btn-nav-history {
            display: none;
        }

        #kp-navbar.nav-compact #btn-nav-history {
            display: inline-flex;
        }

        #kp-navbar.nav-compact #btn-nav-account {
            display: none;
        }

        #kp-navbar.nav-compact .nav-right {
            gap: 6px;
        }

        /* Badge số thông báo */
        .notif-badge {
            position: absolute;
            top: -4px;
            right: -4px;
            min-width: 18px;
            height: 18px;
            padding: 0 5px;
            border-radius: 999px;
            background: var(--danger);
            color: #fff;
            font-size: 0.68rem;
            font-weight: 700;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 2px 6px rgba(239, 68, 68, 0.5);
            transition: transform 0.3s ease;
        }

        .notif-badge.hidden {
            display: none;
        }

        /* Thanh loading chỉ hiện ngay bên dưới navbar */
        #navbar-loader {
            position: absolute;
            bottom: -2px;
            left: 0;
            width: 100%;
            height: 3px;
            overflow: hidden;
            border-radius: 0 0 18px 18px;
            opacity: 1;
            transition: opacity 0.5s ease;
        }

        #navbar-loader.done {
            opacity: 0;
            pointer-events: none;
        }

        #navbar-loader::before {
            content: "";
            position: absolute;
            left: -40%;
            width: 40%;
            height: 100%;
            background: linear-gradient(90deg, transparent, var(--accent), #ec4899, transparent);
            animation: navLoadBar 1.1s infinite ease-in-out;
        }

        @keyframes navLoadBar {
            0% {
                left: -40%;
            }

            100% {
                left: 100%;
            }
        }

        /* Tooltip ngẫu nhiên 5-20s */
        #random-toast-tooltip {
            position: fixed;
            top: 74px;
            right: 16px;
            max-width: 300px;
            padding: 12px 14px;
            border-radius: 16px;
            z-index: 990;
            display: flex;
            align-items: center;
            gap: 10px;
            cursor: pointer;
            opacity: 0;
            transform: translateY(-14px) scale(0.95);
            pointer-events: none;
            transition: opacity 0.5s ease, transform 0.5s cubic-bezier(0.22, 1, 0.36, 1);
        }

        #random-toast-tooltip.visible {
            opacity: 1;
            transform: translateY(0) scale(1);
            pointer-events: auto;
        }

        #random-toast-tooltip img {
            width: 38px;
            height: 38px;
            border-radius: 10px;
            object-fit: cover;
        }

        /* POPUP CHUNG VỚI HIỆU ỨNG ĐÓNG MỞ TỪ TỪ CHẬM RÃI */
        .kp-modal-backdrop {
            position: fixed;
            inset: 0;
            background: rgba(2, 6, 23, 0.48);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            z-index: 1500;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 16px;
            opacity: 0;
            visibility: hidden;
            transition: opacity 0.55s cubic-bezier(0.22, 1, 0.36, 1), visibility 0.55s ease;
        }

        .kp-modal-backdrop.open {
            opacity: 1;
            visibility: visible;
        }

        .kp-modal-box {
            width: 100%;
            max-width: 680px;
            max-height: 86vh;
            overflow-y: auto;
            border-radius: 24px;
            padding: 22px;
            transform: translateY(28px) scale(0.93);
            opacity: 0;
            transition: transform 0.6s cubic-bezier(0.16, 1, 0.3, 1), opacity 0.55s ease;
        }

        .kp-modal-backdrop.open .kp-modal-box {
            transform: translateY(0) scale(1);
            opacity: 1;
        }

        /* Popup Thông báo: header cố định khi lướt nội dung bên dưới */
        .notif-modal-box {
            display: flex;
            flex-direction: column;
            overflow: hidden;
            padding: 0;
        }

        .notif-modal-header {
            position: sticky;
            top: 0;
            z-index: 10;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 10px;
            padding: 16px 20px;
            border-bottom: 1px solid var(--glass-border);
            background: var(--glass-bg-strong);
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            flex-shrink: 0;
        }

        .notif-modal-scroll {
            flex: 1;
            overflow-y: auto;
            padding: 14px 20px 20px;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .notif-item-row {
            padding: 11px 13px;
            border-radius: 14px;
            display: flex;
            align-items: center;
            gap: 12px;
            cursor: pointer;
            flex-shrink: 0;
            min-height: 64px;
            overflow: hidden;
            transition: opacity 0.28s ease, transform 0.28s ease, max-height 0.28s ease, margin 0.28s ease, padding 0.28s ease;
        }

        .notif-item-row.removing {
            opacity: 0;
            transform: translateX(28px) scale(0.95);
            max-height: 0;
            min-height: 0;
            padding-top: 0;
            padding-bottom: 0;
            margin-bottom: -10px;
            pointer-events: none;
        }

        /* Lịch sử tìm kiếm trong popup Search */
        .search-history-bar {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin-top: 8px;
        }

        .search-history-chip {
            padding: 5px 11px;
            border-radius: 999px;
            border: 1px solid var(--glass-border);
            background: rgba(255, 255, 255, 0.16);
            color: var(--text-primary);
            font-size: 0.78rem;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            transition: background 0.2s ease;
        }

        .search-history-chip:hover {
            background: rgba(255, 255, 255, 0.28);
        }

        /* Popup Chi tiết nội dung: banner tràn 3 góc trên */
        .detail-modal-box {
            padding: 0 22px 22px;
            overflow-x: hidden;
            overflow-y: auto;
        }

        .detail-top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 14px 0 10px;
        }

        .detail-banner-bleed {
            display: block;
            width: calc(100% + 44px);
            margin: 0 -22px 14px;
            height: 200px;
            object-fit: cover;
            border-radius: 24px 24px 0 0;
        }

        .detail-main-row {
            display: flex;
            gap: 14px;
            align-items: flex-start;
            margin-bottom: 12px;
        }

        .detail-main-icon {
            width: 78px;
            height: 78px;
            border-radius: 18px;
            object-fit: cover;
            flex-shrink: 0;
        }

        .detail-title-action-col {
            flex: 1;
            min-width: 0;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .detail-action-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
        }

        .detail-short-desc {
            flex: 1;
            min-width: 0;
            font-size: 0.82rem;
            line-height: 1.4;
            color: var(--text-secondary);
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        .detail-meta-grid {
            display: grid;
            grid-template-columns: repeat(4, minmax(0, 1fr));
            gap: 8px;
            margin-bottom: 14px;
        }

        .detail-meta-cell {
            padding: 8px 9px;
            border-radius: 12px;
            border: 1px solid var(--glass-border);
            background: rgba(255, 255, 255, 0.14);
            min-width: 0;
            display: flex;
            flex-direction: column;
            gap: 3px;
        }

        .detail-meta-label {
            font-size: 0.7rem;
            color: var(--text-secondary);
            display: flex;
            align-items: center;
            gap: 5px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .detail-meta-value {
            font-size: 0.78rem;
            font-weight: 600;
            color: var(--text-primary);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        /* MENU DRAWER TỪ TRÁI SANG */
        #menu-drawer-backdrop {
            justify-content: flex-start;
            padding: 0;
        }

        #menu-drawer {
            width: 330px;
            max-width: 88vw;
            height: 100vh;
            border-radius: 0 24px 24px 0;
            display: flex;
            flex-direction: column;
            transform: translateX(-105%);
            transition: transform 0.6s cubic-bezier(0.16, 1, 0.3, 1);
            overflow: hidden;
        }

        #menu-drawer-backdrop.open #menu-drawer {
            transform: translateX(0);
        }

        .drawer-header {
            padding: 12px 14px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 8px;
            border-bottom: 1px solid var(--glass-border);
            position: relative;
            min-height: 58px;
        }

        .drawer-header-right {
            position: relative;
            flex: 1;
            min-width: 0;
            display: flex;
            justify-content: flex-end;
            align-items: center;
        }

        .drawer-search-input {
            width: 100%;
            max-width: 175px;
            padding: 7px 11px;
            border-radius: 12px;
            border: 1px solid var(--glass-border);
            background: rgba(255, 255, 255, 0.2);
            color: var(--text-primary);
            font-size: 16px;
            line-height: 1.2;
            outline: none;
            transition: opacity 0.45s ease, transform 0.45s ease;
        }

        .drawer-auth-sticky {
            position: absolute;
            right: 0;
            display: flex;
            align-items: center;
            gap: 5px;
            opacity: 0;
            transform: translateY(-8px);
            pointer-events: none;
            transition: opacity 0.45s ease, transform 0.45s cubic-bezier(0.22, 1, 0.36, 1);
        }

        .drawer-auth-sticky .btn-pill {
            padding: 5px 9px;
            font-size: 0.72rem;
            border-radius: 9px;
            gap: 4px;
            white-space: nowrap;
        }

        .drawer-header.show-sticky-auth .drawer-search-input {
            opacity: 0;
            pointer-events: none;
            transform: translateY(8px);
        }

        .drawer-header.show-sticky-auth .drawer-auth-sticky {
            opacity: 1;
            pointer-events: auto;
            transform: translateY(0);
        }

        .drawer-scroll-body {
            flex: 1;
            overflow-y: auto;
            padding: 14px 16px 30px;
        }

        .drawer-auth-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-bottom: 16px;
            transition: opacity 0.4s ease;
        }

        .btn-pill {
            padding: 8px 12px;
            border-radius: 12px;
            border: 1px solid var(--glass-border);
            background: var(--accent);
            color: #fff;
            font-size: 0.82rem;
            font-weight: 600;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            transition: transform 0.25s ease, filter 0.25s ease;
        }

        .btn-pill.secondary {
            background: rgba(255, 255, 255, 0.18);
            color: var(--text-primary);
        }

        .btn-pill:hover {
            filter: brightness(1.08);
            transform: translateY(-1px);
        }

        /* Accordion trong Menu */
        .menu-acc-item {
            margin-bottom: 10px;
            border-radius: 14px;
            overflow: hidden;
            border: 1px solid var(--glass-border);
            background: rgba(255, 255, 255, 0.12);
        }

        .menu-acc-title {
            width: 100%;
            padding: 12px 14px;
            background: transparent;
            border: none;
            color: var(--text-primary);
            font-weight: 700;
            font-size: 0.9rem;
            display: flex;
            align-items: center;
            justify-content: space-between;
            cursor: pointer;
        }

        .menu-acc-title span {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .menu-acc-list {
            max-height: 0;
            overflow: hidden;
            transition: max-height 0.55s cubic-bezier(0.22, 1, 0.36, 1), padding 0.4s ease;
            padding: 0 10px;
        }

        .menu-acc-item.expanded .menu-acc-list {
            max-height: 360px;
            /* Tối đa 8 item, dài hơn sẽ cuộn */
            overflow-y: auto;
            padding: 4px 10px 10px;
        }

        .menu-sub-entry {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 7px 8px;
            border-radius: 10px;
            cursor: pointer;
            font-size: 0.84rem;
            transition: background 0.25s ease;
        }

        .menu-sub-entry:hover {
            background: rgba(255, 255, 255, 0.22);
        }

        .menu-sub-entry img {
            width: 28px;
            height: 28px;
            border-radius: 7px;
            object-fit: cover;
        }

        /* Nút cuộn lên đầu trang ở trang chính */
        #btn-scroll-top {
            position: fixed;
            right: 18px;
            bottom: 22px;
            width: 44px;
            height: 44px;
            border-radius: 15px;
            z-index: 980;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            color: var(--text-primary);
            cursor: pointer;
            opacity: 0;
            transform: translateY(14px) scale(0.92);
            pointer-events: none;
            transition: opacity 0.35s ease, transform 0.35s cubic-bezier(0.22, 1, 0.36, 1), background 0.25s ease, color 0.25s ease;
        }

        #btn-scroll-top.visible {
            opacity: 1;
            transform: translateY(0) scale(1);
            pointer-events: auto;
        }

        #btn-scroll-top:hover {
            background: var(--accent);
            color: #fff;
        }

        /* MAIN CONTENT */
        main {
            padding-top: 66px;
            max-width: 1320px;
            margin: 0 auto;
            padding-bottom: 60px;
        }

        .appstore-banner {
            width: 100%;
            height: 190px;
            object-fit: cover;
            border-radius: 16px;
            margin-bottom: 14px;
        }

        .appstore-head {
            display: flex;
            gap: 14px;
            align-items: center;
            margin-bottom: 14px;
        }

        .appstore-head img {
            width: 74px;
            height: 74px;
            border-radius: 18px;
            object-fit: cover;
        }

        .screenshot-strip {
            display: flex;
            gap: 10px;
            overflow-x: auto;
            padding: 8px 0;
        }

        .screenshot-strip img {
            height: 180px;
            border-radius: 12px;
            object-fit: cover;
        }
    </style>
</head>

<body>

    <!-- NAVBAR -->
    <header id="kp-navbar" class="liquid-glass">
        <div class="nav-left">
            <button class="icon-btn" id="btn-open-menu" aria-label="Menu">
                <i class="fa-solid fa-bars"></i>
            </button>
            <div class="brand-trigger" id="brand-theme-toggle" title="Chạm để đổi Sáng/Tối">
                <img src="CydiaIcon.png" onerror="this.src='https://placehold.co/64x64/2563eb/ffffff?text=KP'"
                    alt="KPazz Logo" />
                <span class="brand-name">KPazz</span>
                <div id="nav-brand-tooltip"></div>
            </div>
        </div>

        <div class="nav-right">
            <button class="icon-btn" id="btn-nav-search" title="Tìm kiếm">
                <i class="fa-solid fa-magnifying-glass"></i>
            </button>
            <button class="icon-btn" id="btn-nav-history" title="Lịch sử xem và tải">
                <i class="fa-solid fa-clock-rotate-left"></i>
            </button>
            <button class="icon-btn" id="btn-nav-notif" title="Thông báo">
                <i class="fa-solid fa-bell"></i>
                <span class="notif-badge hidden" id="notif-badge-count">0</span>
            </button>
            <button class="icon-btn" id="btn-nav-account" title="Tài khoản">
                <i class="fa-solid fa-user-astronaut"></i>
            </button>
        </div>

    <script>
        // Chặn các thao tác tự động cuộn trang ngoài ý muốn khi nạp/chạy slide
        (function guardUnintendedAutoScroll() {
            let allowProgrammaticScroll = false;
            window.__kpAllowScroll = (fn) => {
                allowProgrammaticScroll = true;
                try {
                    return fn();
                } finally {
                    setTimeout(() => {
                        allowProgrammaticScroll = false;
                    }, 120);
                }
            };

            const origScrollTo = window.scrollTo.bind(window);
            window.scrollTo = function (...args) {
                if (!allowProgrammaticScroll) return;
                return origScrollTo(...args);
            };

            const origScrollBy = window.scrollBy.bind(window);
            window.scrollBy = function (...args) {
                if (!allowProgrammaticScroll) return;
                return origScrollBy(...args);
            };

            const origScrollIntoView = Element.prototype.scrollIntoView;
            Element.prototype.scrollIntoView = function (...args) {
                const insideDrawerOrModal = this.closest("#drawer-scroll-body, .kp-modal-box");
                if (!allowProgrammaticScroll && !insideDrawerOrModal) return;
                return origScrollIntoView.apply(this, args);
            };

            if ("scrollRestoration" in history) {
                history.scrollRestoration = "manual";
            }
        })();

        /**
         * Cấu hình danh sách các Section trong thư mục Tabs (Đoạn 3 đến Đoạn 20)
         * Mỗi section có file HTML và file JSON tương ứng (ví dụ APPios.html -> sec_APPios.json)
         */
        const SECTION_REGISTRY = [{
                html: "Tabs/CoverflowShowcase.html",
                json: "Tabs/sec_CoverflowShowcase.json",
                icon: "fa-solid fa-layer-group",
                color: "#6366f1"
            },
            {
                html: "Tabs/CubeRotateCards.html",
                json: "Tabs/sec_CubeRotateCards.json",
                icon: "fa-solid fa-cube",
                color: "#8b5cf6"
            },
            {
                html: "Tabs/FlipInfoCards.html",
                json: "Tabs/sec_FlipInfoCards.json",
                icon: "fa-solid fa-repeat",
                color: "#14b8a6"
            },
            {
                html: "Tabs/ParallaxHorizonCards.html",
                json: "Tabs/sec_ParallaxHorizonCards.json",
                icon: "fa-solid fa-panorama",
                color: "#f43f5e"
            },
            {
                html: "Tabs/TickerFeedCards.html",

            {

            {

                icon: "fa-solid fa-certificate",
                color: "#f97316"
            },
            {
                html: "Tabs/CompactPillRows.html",
                json: "Tabs/sec_CompactPillRows.json",

            },
            {
                html: "Tabs/SpotlightHeroCards.html",

            },
            {
                html: "Tabs/MagazineOverlayCards.html",
                json: "Tabs/sec_MagazineOverlayCards.json",
                icon: "fa-solid fa-newspaper",
                color: "#ec4899"
            },
            {
                html: "Tabs/AppstoreFeatured.html",
                json: "Tabs/sec_AppstoreFeatured.json",
                icon: "fa-solid fa-crown",
                color: "#2563eb"
            },
            {
                html: "Tabs/SplitBannerCards.html",
                json: "Tabs/sec_SplitBannerCards.json",
                icon: "fa-solid fa-table-columns",
                color: "#0ea5e9"
            },
            {
                html: "Tabs/MinimalBentoTiles.html",
                json: "Tabs/sec_MinimalBentoTiles.json",
                icon: "fa-solid fa-border-all",
                color: "#6366f1"
            },
            {
                html: "Tabs/APPios.html",
                json: "Tabs/sec_APPios.json",
                icon: "fa-brands fa-apple",
                color: "#3b82f6"
            },
            {
                html: "Tabs/Jailbreak.html",
                json: "Tabs/sec_Jailbreak.json",
                icon: "fa-solid fa-unlock-keyhole",
                color: "#8b5cf6"
            },
            {
                html: "Tabs/Media.html",
                json: "Tabs/sec_Media.json",
                icon: "fa-solid fa-film",
                color: "#ec4899"
            },
            {
                html: "Tabs/TechTips.html",
                json: "Tabs/sec_TechTips.json",
                icon: "fa-solid fa-lightbulb",
                color: "#f59e0b"
            }
            // Bạn có thể khai báo tiếp đến đoạn 20 tại đây theo đúng quy tắc tên file
        ];

        window.KPazzApp = {
            allSectionsData: [],
            searchableItems: [],
            notifications: JSON.parse(localStorage.getItem("kp_notifications") || "[]"),
            unreadCount: parseInt(localStorage.getItem("kp_unread_count") || "0", 10),
            downloadHistory: JSON.parse(localStorage.getItem("kp_dl_history") || "[]"),
            viewHistory: JSON.parse(localStorage.getItem("kp_view_history") || "[]"),
            searchHistory: JSON.parse(localStorage.getItem("kp_search_history") || "[]"),
            _isClearingNotifs: false,

            initTheme() {
                const saved = localStorage.getItem("kp_theme");
                if (saved) {
                    document.documentElement.classList.toggle("dark", saved === "dark");
                } else {
                    const hour = new Date().getHours();
                    const isNight = hour >= 18 || hour < 6;
                    document.documentElement.classList.toggle("dark", isNight);
                }
            },

            showBrandTooltip(text) {
                const el = document.getElementById("nav-brand-tooltip");
                el.textContent = text;
                el.classList.add("show");
                clearTimeout(this._brandTipTimer);
                this._brandTipTimer = setTimeout(() => el.classList.remove("show"), 2200);
            },

            toggleTheme() {
                const isDark = document.documentElement.classList.toggle("dark");
                const mode = isDark ? "dark" : "light";
                localStorage.setItem("kp_theme", mode);
                this.showBrandTooltip(isDark ? "🌙 Đã chuyển: Chế độ Tối" : "☀️ Đã chuyển: Chế độ Sáng");
                window.dispatchEvent(new CustomEvent("kpazz-theme-changed", {
                    detail: {
                        theme: mode
                    }
                }));
            },

            openModal(id) {
                document.getElementById(id).classList.add("open");
            },
            closeModal(id) {
                document.getElementById(id).classList.remove("open");
            },

            renderDrawerCategories(filterText = "") {
                const q = filterText.trim().toLowerCase();
                const drawerContainer = document.getElementById("drawer-categories-container");
                const sections = this.allSectionsData || [];

                const html = sections.map((sec, sIdx) => {
                    const secTitleMatch = (sec.sectionTitle || "").toLowerCase().includes(q);
                    const matchingItems = !q ?
                        (sec.items || []) :
                        (sec.items || []).filter(it =>
                            (it.title || "").toLowerCase().includes(q) ||
                            (it.author || "").toLowerCase().includes(q) ||
                            secTitleMatch
                        );

                    if (q && !secTitleMatch && matchingItems.length === 0) {
                        return "";
                    }

                    const expandedClass = q && matchingItems.length > 0 ? "expanded" : "";
                    return `
          <div class="menu-acc-item ${expandedClass}" id="menu-acc-${sIdx}">
            <button class="menu-acc-title" onclick="document.getElementById('menu-acc-${sIdx}').classList.toggle('expanded')">
              <span><i class="${sec._icon}" style="color:${sec._color};font-size:1.05rem;"></i> ${sec.sectionTitle}</span>
              <i class="fa-solid fa-chevron-down" style="font-size:0.75rem;"></i>
            </button>
            <div class="menu-acc-list">
              ${matchingItems.map(it => `
                <div class="menu-sub-entry" onclick='KPazzApp.closeModal("menu-drawer-backdrop");KPazzApp.openItemDetail(${JSON.stringify(it).replace(/'/g, "&apos;")})'>
                  <img src="${it.icon}" alt="" />
                  <span style="white-space:nowrap;overflow:hidden;text-overflow:ellipsis;">${it.title}</span>
                </div>
              `).join("")}
            </div>
          </div>
        `;
                }).join("");

                drawerContainer.innerHTML = html || `<p style="color:var(--text-secondary);font-size:0.84rem;text-align:center;padding:16px 8px;">Không tìm thấy mục phù hợp trong menu.</p>`;
            },

            renderSearchHistory() {
                const container = document.getElementById("search-history-container");
                if (!container) return;
                if (!this.searchHistory.length) {
                    container.innerHTML = "";
                    return;
                }
                container.innerHTML = `
          <div style="display:flex;justify-content:space-between;align-items:center;font-size:0.78rem;color:var(--text-secondary);">
            <span><i class="fa-solid fa-clock-rotate-left"></i> Lịch sử tìm kiếm</span>
            <button type="button" onclick="KPazzApp.clearSearchHistory()" style="background:none;border:none;color:var(--danger);font-size:0.76rem;font-weight:600;cursor:pointer;">
              Xoá lịch sử
            </button>
          </div>
          <div class="search-history-bar">
            ${this.searchHistory.map(term => `
              <button type="button" class="search-history-chip" onclick="KPazzApp.applySearchTerm('${term.replace(/'/g, "\\'")}')">
                <i class="fa-solid fa-magnifying-glass" style="font-size:0.7rem;opacity:0.75;"></i>
                <span>${term}</span>
              </button>
            `).join("")}
          </div>
        `;
            },

            recordSearchTerm(term) {
                const clean = term.trim();
                if (!clean) return;
                this.searchHistory = [clean, ...this.searchHistory.filter(t => t.toLowerCase() !== clean.toLowerCase())].slice(0, 10);
                localStorage.setItem("kp_search_history", JSON.stringify(this.searchHistory));
                this.renderSearchHistory();
            },

            applySearchTerm(term) {
                const input = document.getElementById("global-search-input");
                input.value = term;
                input.dispatchEvent(new Event("input"));
            },

            clearSearchHistory() {
                this.searchHistory = [];
                localStorage.removeItem("kp_search_history");
                this.renderSearchHistory();
            },

            updateNotifBadge() {
                const badge = document.getElementById("notif-badge-count");
                badge.textContent = this.unreadCount;
                badge.classList.toggle("hidden", this.unreadCount <= 0);
                localStorage.setItem("kp_unread_count", String(this.unreadCount));
                localStorage.setItem("kp_notifications", JSON.stringify(this.notifications));
            },

            pushNotification(item, showToast = true) {
                this.notifications.unshift({
                    ...item,
                    time: new Date().toLocaleTimeString("vi-VN", {
                        hour: "2-digit",
                        minute: "2-digit"
                    })
                });
                if (this.notifications.length > 50) this.notifications.pop();
                this.unreadCount += 1;
                this.updateNotifBadge();

                if (showToast) {
                    const toast = document.getElementById("random-toast-tooltip");
                    document.getElementById("toast-icon").src = item.icon || "CydiaIcon.png";
                    document.getElementById("toast-title").textContent = item.title;
                    document.getElementById("toast-desc").textContent =
                    `Mới cập nhật • ${item.category || "KPazz"}`;
                    toast.onclick = () => this.openItemDetail(item);
                    toast.classList.add("visible");
                    setTimeout(() => toast.classList.remove("visible"), 4200);
                }
            },

            startRandomTooltipLoop() {
                const scheduleNext = () => {
                    const delay = Math.floor(Math.random() * (20000 - 5000 + 1)) + 5000;
                    setTimeout(() => {
                        if (this.searchableItems.length > 0) {
                            const rand = this.searchableItems[Math.floor(Math.random() * this
                                .searchableItems.length)];
                            this.pushNotification(rand, true);
                        }
                        scheduleNext();
                    }, delay);
                };
                scheduleNext();
            },

            renderNotificationsModal() {
                const container = document.getElementById("notif-list-container");
                const visibleNotifs = this.notifications.slice(0, 10);
                if (!visibleNotifs.length) {
                    container.innerHTML =
                        `<p style="color:var(--text-secondary);text-align:center;padding:20px;">Chưa có thông báo nào.</p>`;
                    return;
                }
                container.innerHTML = visibleNotifs.map((n, idx) => `
          <div class="liquid-glass notif-item-row" data-notif-idx="${idx}"
               onclick="KPazzApp.closeModal('notif-modal');KPazzApp.openItemDetail(KPazzApp.notifications[${idx}])">
            <img src="${n.icon}" style="width:42px;height:42px;border-radius:10px;object-fit:cover;flex-shrink:0;" />
            <div style="flex:1;min-width:0;">
              <strong style="display:block;line-height:1.3;">${n.title}</strong>
              <div style="font-size:0.78rem;color:var(--text-secondary);line-height:1.35;margin-top:2px;">${n.category || ""} • Lúc ${n.time}</div>
            </div>
          </div>
        `).join("");
            },

            clearNotificationsSequentially() {
                if (this._isClearingNotifs) return;
                const rows = Array.from(document.querySelectorAll("#notif-list-container .notif-item-row"));
                if (!rows.length) {
                    this.notifications = [];
                    this.unreadCount = 0;
                    this.updateNotifBadge();
                    this.renderNotificationsModal();
                    return;
                }

                this._isClearingNotifs = true;
                const stepDelay = 120;
                const animDuration = 280;

                rows.forEach((row, i) => {
                    setTimeout(() => {
                        row.classList.add("removing");
                    }, i * stepDelay);
                });

                const totalTime = (rows.length - 1) * stepDelay + animDuration + 30;
                setTimeout(() => {
                    this.notifications = [];
                    this.unreadCount = 0;
                    this.updateNotifBadge();
                    this.renderNotificationsModal();
                    this._isClearingNotifs = false;
                }, totalTime);
            },

            getCategoryIconColor(category) {
                const cat = (category || "").toLowerCase();
                const matchedSection = (this.allSectionsData || []).find(sec =>
                    (sec.sectionTitle || "").toLowerCase().includes(cat) ||
                    cat.includes((sec.sectionTitle || "").toLowerCase())
                );
                if (matchedSection && matchedSection._color) return matchedSection._color;
                return "#ec4899";
            },

            recordViewHistory(item) {
                if (!item || !item.title) return;
                const entry = {
                    ...item,
                    viewedAt: new Date().toLocaleString("vi-VN")
                };
                this.viewHistory = [
                    entry,
                    ...this.viewHistory.filter(v => v.title !== item.title)
                ].slice(0, 30);
                localStorage.setItem("kp_view_history", JSON.stringify(this.viewHistory));
            },

            openViewAndDownloadHistoryModal() {
                const views = this.viewHistory || [];
                const downloads = this.downloadHistory || [];

                document.getElementById("history-modal-content").innerHTML = `
          <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;">
            <h3><i class="fa-solid fa-clock-rotate-left"></i> Lịch sử xem và tải</h3>
            <button class="icon-btn" onclick="KPazzApp.closeModal('history-modal')"><i class="fa-solid fa-xmark"></i></button>
          </div>
          <div style="margin-bottom:16px;">
            <h4 style="margin-bottom:8px;font-size:0.9rem;"><i class="fa-solid fa-eye" style="color:var(--accent);"></i> Lịch sử xem (${views.length})</h4>
            <div style="display:grid;gap:8px;">
              ${views.length ? views.slice(0, 12).map((v, idx) => `
                <div class="liquid-glass" style="padding:9px 12px;border-radius:13px;display:flex;align-items:center;gap:10px;cursor:pointer;"
                     onclick='KPazzApp.closeModal("history-modal");KPazzApp.openItemDetail(KPazzApp.viewHistory[${idx}])'>
                  <img src="${v.icon || "CydiaIcon.png"}" style="width:36px;height:36px;border-radius:9px;object-fit:cover;flex-shrink:0;" />
                  <div style="flex:1;min-width:0;">
                    <strong style="display:block;font-size:0.85rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;">${v.title}</strong>
                    <span style="font-size:0.74rem;color:var(--text-secondary);">${v.category || "Nội dung"} • ${v.viewedAt || ""}</span>
                  </div>
                </div>
              `).join("") : `<p style="font-size:0.82rem;color:var(--text-secondary);">Chưa có nội dung nào được xem.</p>`}
            </div>
          </div>
          <div>
            <h4 style="margin-bottom:8px;font-size:0.9rem;"><i class="fa-solid fa-download" style="color:#10b981;"></i> Lịch sử tải (${downloads.length})</h4>
            <div style="display:grid;gap:8px;">
              ${downloads.length ? downloads.slice(0, 12).map(d => `
                <div class="liquid-glass" style="padding:9px 12px;border-radius:13px;display:flex;justify-content:space-between;align-items:center;gap:10px;">
                  <div style="min-width:0;">
                    <strong style="display:block;font-size:0.85rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;">${d.title}</strong>
                    <span style="font-size:0.74rem;color:var(--text-secondary);">Server: ${d.server}</span>
                  </div>
                  <span style="font-size:0.74rem;color:var(--text-secondary);flex-shrink:0;">${d.date}</span>
                </div>
              `).join("") : `<p style="font-size:0.82rem;color:var(--text-secondary);">Chưa có tệp nào được tải.</p>`}
            </div>
          </div>
        `;
                this.openModal("history-modal");
            },

            openItemDetail(item) {
                if (!item) return;
                this.recordViewHistory(item);

                const related = this.searchableItems
                    .filter(x => x.title !== item.title && Boolean(x.isApp) === Boolean(item.isApp))
                    .slice(0, 4);

                const screensHtml = (item.screenshots || []).map(src => `<img src="${src}" alt="Screenshot" />`)
                    .join("");
                const videoHtml = item.videoUrl ?
                    `<div style="margin:12px 0;"><video src="${item.videoUrl}" controls style="width:100%;border-radius:14px;max-height:240px;"></video></div>` :
                    "";

                const shortDesc = item.shortDescription || item.subtitle || item.description || "Nội dung cập nhật trên KPazz.";
                const downloadBtnHtml = item.isApp ?
                    `<button class="btn-pill" style="padding:9px 14px;font-size:0.82rem;flex-shrink:0;" onclick='KPazzApp.openDownloadLinks(${JSON.stringify(item).replace(/'/g, "&apos;")})'>
               <i class="fa-solid fa-cloud-arrow-down"></i> Tải (${item.filesize || "N/A"})
             </button>` :
                    "";

                const authorColor = "#3b82f6";
                const versionColor = "#8b5cf6";
                const dateColor = "#10b981";
                const categoryColor = this.getCategoryIconColor(item.category || item._sectionTitle);

                const bannerHtml = item.banner
                    ? `<img class="detail-banner-bleed" src="${item.banner}" alt="${item.title}" />`
                    : "";

                const topBarHtml = `
          <div style="display:flex;justify-content:space-between;align-items:center;${item.banner ? "margin-bottom:10px;" : "padding:14px 0 10px;"}">
            <span style="font-size:0.8rem;font-weight:700;color:var(--accent);"><i class="fa-solid fa-layer-group"></i> ${item.category || item._sectionTitle || "Chi tiết"}</span>
            <button class="icon-btn" onclick="KPazzApp.closeModal('detail-modal')"><i class="fa-solid fa-xmark"></i></button>
          </div>`;

                document.getElementById("detail-modal-content").innerHTML = `
          ${bannerHtml}
          ${topBarHtml}
          <div class="detail-main-row">
            <img class="detail-main-icon" src="${item.icon}" alt="${item.title}" />
            <div class="detail-title-action-col">
              <h2 style="font-size:1.2rem;line-height:1.25;">${item.title}</h2>
              <div class="detail-action-row">
                <p class="detail-short-desc">${shortDesc}</p>
                ${downloadBtnHtml}
              </div>
            </div>
          </div>
          <div class="detail-meta-grid">
            <div class="detail-meta-cell" title="${item.author || "KPazz"}">
              <span class="detail-meta-label"><i class="fa-solid fa-user-pen" style="color:${authorColor};"></i> Tác giả</span>
              <span class="detail-meta-value">${item.author || "KPazz"}</span>
            </div>
            <div class="detail-meta-cell" title="v${item.version || "1.0"}">
              <span class="detail-meta-label"><i class="fa-solid fa-code-branch" style="color:${versionColor};"></i> Phiên bản</span>
              <span class="detail-meta-value">v${item.version || "1.0"}</span>
            </div>
            <div class="detail-meta-cell" title="${item.publishDate || "2026"}">
              <span class="detail-meta-label"><i class="fa-regular fa-calendar" style="color:${dateColor};"></i> Ngày đăng</span>
              <span class="detail-meta-value">${item.publishDate || "2026"}</span>
            </div>
            <div class="detail-meta-cell" title="${item.category || "Tiện ích"}">
              <span class="detail-meta-label"><i class="fa-solid fa-tag" style="color:${categoryColor};"></i> Danh mục</span>
              <span class="detail-meta-value">${item.category || "Tiện ích"}</span>
            </div>
          </div>
          <p style="font-size:0.9rem;line-height:1.55;margin-bottom:12px;color:var(--text-secondary);">${item.description || ""}</p>
          ${videoHtml}
          ${screensHtml ? `<h4 style="margin-top:10px;"><i class="fa-solid fa-images"></i> Ảnh xem trước</h4><div class="screenshot-strip">${screensHtml}</div>` : ""}
          <h4 style="margin:16px 0 10px;"><i class="fa-solid fa-wand-magic-sparkles"></i> Đề xuất ${item.isApp ? "ứng dụng" : "nội dung"} liên quan</h4>
          <div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:10px;">
            ${related.map(r => `
              <div class="liquid-glass" style="padding:10px;border-radius:14px;display:flex;align-items:center;gap:10px;cursor:pointer;"
                   onclick='KPazzApp.openItemDetail(${JSON.stringify(r).replace(/'/g, "&apos;")})'>
                <img src="${r.icon}" style="width:40px;height:40px;border-radius:10px;object-fit:cover;" />
                <div style="overflow:hidden;">
                  <div style="font-weight:700;font-size:0.85rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;">${r.title}</div>
                  <div style="font-size:0.75rem;color:var(--text-secondary);">${r.author}</div>
                </div>
              </div>
            `).join("")}
          </div>
        `;
                this.openModal("detail-modal");
            },

            openDownloadLinks(item) {
                const links = item.downloadLinks || [];
                document.getElementById("download-modal-content").innerHTML = `
          <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;">
            <h3><i class="fa-solid fa-download"></i> Chọn liên kết tải xuống</h3>
            <button class="icon-btn" onclick="KPazzApp.closeModal('download-modal')"><i class="fa-solid fa-xmark"></i></button>
          </div>
          <p style="font-size:0.85rem;color:var(--text-secondary);margin-bottom:12px;">
            Tệp: <strong>${item.title}</strong> • Định dạng: <strong>${item.fileFormat || "IPA/APK"}</strong> • Dung lượng: <strong>${item.filesize || "N/A"}</strong>
          </p>
          <div style="display:grid;gap:10px;">
            ${links.map(l => `
              <a href="${l.url}" target="_blank" class="btn-pill" style="justify-content:space-between;text-decoration:none;padding:12px 16px;"
                 onclick="KPazzApp.recordDownload('${item.title}', '${l.server}')">
                <span><i class="fa-solid fa-server"></i> ${l.server}</span>
                <span><i class="fa-solid fa-arrow-up-right-from-square"></i> Tải ngay</span>
              </a>
            `).join("")}
          </div>
        `;
                this.openModal("download-modal");
            },

            recordDownload(title, server) {
                this.downloadHistory.unshift({
                    title,
                    server,
                    date: new Date().toLocaleString("vi-VN")
                });
                localStorage.setItem("kp_dl_history", JSON.stringify(this.downloadHistory));
                document.getElementById("dl-history-count").textContent = this.downloadHistory.length;
            },

            showDownloadHistory() {
                const list = this.downloadHistory.map(h => `• ${h.title} (${h.server}) - ${h.date}`).join("\n");
                alert(list ? "Lịch sử tải xuống:\n" + list : "Bạn chưa tải tệp nào.");
            },

            openSectionAllModal(sectionData) {
                document.getElementById("section-all-content").innerHTML = `
          <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;">
            <div>
              <h2>${sectionData.sectionTitle}</h2>
              <p style="font-size:0.85rem;color:var(--text-secondary);">${sectionData.sectionDescription}</p>
            </div>
            <button class="icon-btn" onclick="KPazzApp.closeModal('section-all-modal')"><i class="fa-solid fa-xmark"></i></button>
          </div>
          <div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:12px;">
            ${sectionData.items.map(it => `
              <div class="liquid-glass" style="padding:12px;border-radius:16px;display:flex;align-items:center;gap:12px;cursor:pointer;"
                   onclick='KPazzApp.closeModal("section-all-modal");KPazzApp.openItemDetail(${JSON.stringify(it).replace(/'/g, "&apos;")})'>
                <img src="${it.icon}" style="width:48px;height:48px;border-radius:12px;object-fit:cover;" />
                <div style="overflow:hidden;">
                  <strong style="display:block;font-size:0.9rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;">${it.title}</strong>
                  <span style="font-size:0.78rem;color:var(--text-secondary);">${it.author} • v${it.version}</span>
                </div>
              </div>
            `).join("")}
          </div>
        `;
                this.openModal("section-all-modal");
            },

            openAccountModal() {
                document.getElementById("dl-history-count").textContent = this.downloadHistory.length;
                this.openModal("account-modal");
            },

            clearAllHtmlCache() {
                localStorage.removeItem("kp_known_items_hash");
                if ("caches" in window) {
                    caches.keys().then(names => names.forEach(n => caches.delete(n)));
                }
                alert("Đã dọn sạch toàn bộ cache HTML/JSON!");
                location.reload(true);
            },

            async bootstrap() {
                this.initTheme();
                this.updateNotifBadge();
                this.renderSearchHistory();

                // 1. Nạp toàn bộ JSON của đoạn 3..20
                const loadedSections = [];
                for (const reg of SECTION_REGISTRY) {
                    try {
                        const res = await fetch(`${reg.json}?t=${Date.now()}`);
                        const data = await res.json();
                        data._htmlPath = reg.html;
                        data._icon = reg.icon;
                        data._color = reg.color;
                        loadedSections.push(data);
                    } catch (e) {
                        console.warn("Không thể tải JSON:", reg.json, e);
                    }
                }

                // Sắp xếp theo orderId (id thứ tự hiển thị section)
                loadedSections.sort((a, b) => (a.orderId || 99) - (b.orderId || 99));
                this.allSectionsData = loadedSections;

                // Gom toàn bộ item phục vụ Search (trừ Slidehero.json) & Tooltip ngẫu nhiên
                this.searchableItems = loadedSections.flatMap(sec =>
                    (sec.items || []).map(item => ({
                        ...item,
                        _sectionTitle: sec.sectionTitle
                    }))
                );

                // Kiểm tra dữ liệu mới cập nhật để hiện popup thông báo
                const currentTitles = this.searchableItems.map(i => i.title);
                const prevTitles = JSON.parse(localStorage.getItem("kp_known_items_hash") || "[]");
                const newlyAdded = this.searchableItems.filter(i => !prevTitles.includes(i.title));
                localStorage.setItem("kp_known_items_hash", JSON.stringify(currentTitles));

                if (newlyAdded.length > 0 && prevTitles.length > 0) {
                    document.getElementById("new-update-content").innerHTML = `
            <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;">
              <h3><i class="fa-solid fa-sparkles" style="color:var(--accent);"></i> Nội dung mới vừa cập nhật!</h3>
              <button class="icon-btn" onclick="KPazzApp.closeModal('new-update-modal')"><i class="fa-solid fa-xmark"></i></button>
            </div>
            <div style="display:grid;gap:10px;">
              ${newlyAdded.slice(0, 5).map(it => `
                <div class="liquid-glass" style="padding:10px;border-radius:14px;display:flex;align-items:center;gap:10px;cursor:pointer;"
                     onclick='KPazzApp.closeModal("new-update-modal");KPazzApp.openItemDetail(${JSON.stringify(it).replace(/'/g, "&apos;")})'>
                  <img src="${it.icon}" style="width:42px;height:42px;border-radius:10px;" />
                  <div><strong>${it.title}</strong><div style="font-size:0.78rem;color:var(--text-secondary);">${it.category}</div></div>
                </div>
              `).join("")}
            </div>
          `;
                    this.openModal("new-update-modal");
                }

                // 2. Render Menu Drawer (tối đa 8 item mỗi list, dài hơn tự cuộn)
                this.renderDrawerCategories(document.getElementById("drawer-search-box").value || "");

                // 3. Nạp Đoạn 2: Slidehero.html (bắt buộc hiển thị ngay dưới navbar trước các section khác)
                try {
                    const heroHtml = await (await fetch("Tabs/Slidehero.html")).text();
                    const heroMount = document.getElementById("slide-hero-mount");
                    heroMount.innerHTML = heroHtml;
                    this.executeScripts(heroMount);
                } catch (e) {
                    console.error("Lỗi tải Slidehero.html", e);
                }

                // 4. Nạp Đoạn 3 -> 20 theo đúng thứ tự orderId
                const sectionsMount = document.getElementById("sections-dynamic-mount");
                for (const sec of loadedSections) {
                    try {
                        const htmlText = await (await fetch(sec._htmlPath)).text();
                        const wrapper = document.createElement("div");
                        wrapper.innerHTML = htmlText;
                        sectionsMount.appendChild(wrapper);
                        this.executeScripts(wrapper);
                    } catch (e) {
                        console.error("Lỗi tải section:", sec._htmlPath, e);
                    }
                }

                // 5. Hoàn tất tải -> Tắt thanh progress dưới navbar
                setTimeout(() => document.getElementById("navbar-loader").classList.add("done"), 450);
                this.startRandomTooltipLoop();
            },

            executeScripts(container) {
                container.querySelectorAll("script").forEach(oldScript => {
                    const newScript = document.createElement("script");
                    newScript.textContent = oldScript.textContent;
                    document.body.appendChild(newScript);
                });
            }
        };

        // Xử lý sự kiện UI Navbar, Nút cuộn lên đầu trang & Cuộn trang
        window.addEventListener("scroll", () => {
            const navbar = document.getElementById("kp-navbar");
            const scrollTopBtn = document.getElementById("btn-scroll-top");
            const scrollY = window.scrollY;
            const docHeight = document.documentElement.scrollHeight - window.innerHeight;
            const scrollPercent = docHeight > 0 ? (scrollY / docHeight) * 100 : 0;

            if (scrollY <= 8) {
                navbar.classList.remove("nav-floating", "nav-compact");
            } else if (scrollPercent >= 40) {
                navbar.classList.add("nav-floating", "nav-compact");
            } else {
                navbar.classList.add("nav-floating");
                navbar.classList.remove("nav-compact");
            }

            if (scrollTopBtn) {
                scrollTopBtn.classList.toggle("visible", scrollY > 240);
            }
        });

        // Bấm nút cuộn lên đầu trang
        document.getElementById("btn-scroll-top").addEventListener("click", () => {
            window.__kpAllowScroll(() => {
                window.scrollTo({
                    top: 0,
                    behavior: "smooth"
                });
            });
        });

        // Chống double-tap zoom trên toàn trang
        let lastTouchEnd = 0;
        document.addEventListener("touchend", (e) => {
            const now = Date.now();
            if (now - lastTouchEnd <= 300) {
                e.preventDefault();
            }
            lastTouchEnd = now;
        }, {
            passive: false
        });

        // Tìm kiếm trực tiếp nội dung bên trong Menu Drawer
        document.getElementById("drawer-search-box").addEventListener("input", function () {
            KPazzApp.renderDrawerCategories(this.value);
        });

        // Cuộn bên trong Menu Drawer: khi 2 nút Đăng ký/Đăng nhập biến mất thì hiện lên thay ô Search
        document.getElementById("drawer-scroll-body").addEventListener("scroll", function () {
            const header = document.getElementById("drawer-header");
            if (this.scrollTop > 42) {
                header.classList.add("show-sticky-auth");
            } else {
                header.classList.remove("show-sticky-auth");
            }
        });

        // Các nút bấm Navbar
        document.getElementById("brand-theme-toggle").addEventListener("click", () => KPazzApp.toggleTheme());
        document.getElementById("btn-open-menu").addEventListener("click", () => KPazzApp.openModal(
            "menu-drawer-backdrop"));
        document.getElementById("btn-nav-search").addEventListener("click", () => {
            KPazzApp.showBrandTooltip("🔍 Đang mở tìm kiếm...");
            KPazzApp.renderSearchHistory();
            KPazzApp.openModal("search-modal");
            setTimeout(() => document.getElementById("global-search-input").focus({
                preventScroll: true
            }), 200);
        });
        document.getElementById("btn-nav-account").addEventListener("click", () => {
            KPazzApp.showBrandTooltip("👤 Đang mở tài khoản...");
            KPazzApp.openAccountModal();
        });
        document.getElementById("btn-nav-history").addEventListener("click", () => KPazzApp.openViewAndDownloadHistoryModal());
        document.getElementById("btn-nav-notif").addEventListener("click", () => {
            KPazzApp.renderNotificationsModal();
            KPazzApp.openModal("notif-modal");
        });
        document.getElementById("btn-clear-notifs").addEventListener("click", () => {
            KPazzApp.clearNotificationsSequentially();
        });

        // Tìm kiếm realtime (đọc từ các JSON trong Tabs trừ Slidehero.json)
        let _searchSaveTimer = null;
        document.getElementById("global-search-input").addEventListener("input", function () {
            const rawQ = this.value;
            const q = rawQ.trim().toLowerCase();
            const box = document.getElementById("global-search-results");
            if (!q) {
                box.innerHTML = "";
                return;
            }

            clearTimeout(_searchSaveTimer);
            _searchSaveTimer = setTimeout(() => {
                KPazzApp.recordSearchTerm(rawQ);
            }, 600);

            const matches = KPazzApp.searchableItems.filter(it =>
                (it.title || "").toLowerCase().includes(q) ||
                (it.description || "").toLowerCase().includes(q) ||
                (it.author || "").toLowerCase().includes(q)
            );
            box.innerHTML = matches.map(it => `
        <div class="liquid-glass" style="padding:10px 12px;border-radius:14px;display:flex;align-items:center;gap:12px;cursor:pointer;"
             onclick='KPazzApp.recordSearchTerm(${JSON.stringify(rawQ)});KPazzApp.closeModal("search-modal");KPazzApp.openItemDetail(${JSON.stringify(it).replace(/'/g, "&apos;")})'>
          <img src="${it.icon}" style="width:44px;height:44px;border-radius:10px;object-fit:cover;" />
          <div>
            <strong>${it.title}</strong>
            <div style="font-size:0.78rem;color:var(--text-secondary);">${it._sectionTitle} • ${it.author}</div>
          </div>
        </div>
      `).join("") || `<p style="color:var(--text-secondary);">Không tìm thấy kết quả phù hợp.</p>`;
        });

        // Đóng modal khi click ra nền mờ bên ngoài
        document.querySelectorAll(".kp-modal-backdrop").forEach(backdrop => {
            backdrop.addEventListener("click", e => {
                if (e.target === backdrop) backdrop.classList.remove("open");
            });
        });

        document.addEventListener("DOMContentLoaded", () => KPazzApp.bootstrap());
    </script>
</body>

</html>
