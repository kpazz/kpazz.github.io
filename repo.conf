# Repo settings, read by scripts/build.py.
# BASE_URL must end with "/". It is the URL users add in Sileo / Zebra.
# GitHub Pages of OmniCarRepo/omnicarrepo.github.io (only that repo name gives the root URL); change it when the repo moves to repo.<domain> (also edit static/CNAME).
BASE_URL=https://omnicarrepo.github.io/
ORIGIN=OmniCar
LABEL=OmniCar
DESCRIPTION=The power of CarPlay
SUITE=stable
CODENAME=ios
ARCHITECTURES=iphoneos-arm64 iphoneos-arm64e
COMPONENTS=main
# Written over every package's Author / Maintainer in Packages (leave empty to keep the deb's own).
AUTHOR=OmniCar <omnicartweak@gmail.com>
MAINTAINER=OmniCar <omnicartweak@gmail.com>
