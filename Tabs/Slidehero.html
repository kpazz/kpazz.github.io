<section id="kp-hero-section" style="padding:14px 16px 8px;">
  <style>
    #kp-hero-wrapper {
      position: relative;
      border-radius: 26px;
      overflow: hidden;
      height: 340px;
    }
    .kp-hero-track {
      display: flex;
      height: 100%;
      transition: transform 0.7s cubic-bezier(0.22, 1, 0.36, 1);
    }
    .kp-hero-slide {
      min-width: 100%;
      height: 100%;
      position: relative;
      display: flex;
      align-items: flex-end;
      padding: 24px;
      cursor: pointer;
    }
    .kp-hero-slide img.hero-bg {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      z-index: 1;
    }
    .kp-hero-slide::after {
      content: "";
      position: absolute;
      inset: 0;
      background: linear-gradient(to top, rgba(2, 6, 23, 0.88) 12%, rgba(2, 6, 23, 0.15) 75%);
      z-index: 2;
    }
    .kp-hero-glass-card {
      position: relative;
      z-index: 3;
      width: 100%;
      max-width: 560px;
      padding: 16px 18px;
      border-radius: 20px;
      color: #fff;
      background: rgba(15, 23, 42, 0.45);
      backdrop-filter: blur(20px) saturate(180%);
      -webkit-backdrop-filter: blur(20px) saturate(180%);
      border: 1px solid rgba(255, 255, 255, 0.25);
      display: flex;
      align-items: center;
      gap: 14px;
    }
    .kp-hero-glass-card img.hero-icon {
      width: 60px;
      height: 60px;
      border-radius: 15px;
      object-fit: cover;
      flex-shrink: 0;
    }
    .kp-hero-dots {
      position: absolute;
      bottom: 14px;
      right: 20px;
      z-index: 4;
      display: flex;
      gap: 6px;
    }
    .kp-hero-dot {
      width: 8px;
      height: 8px;
      border-radius: 999px;
      background: rgba(255,255,255,0.4);
      transition: width 0.35s ease, background 0.35s ease;
    }
    .kp-hero-dot.active {
      width: 24px;
      background: #fff;
    }
  </style>

  <div id="kp-hero-wrapper" class="liquid-glass">
    <div class="kp-hero-track" id="kp-hero-track"></div>
    <div class="kp-hero-dots" id="kp-hero-dots"></div>
  </div>

  <script>
    (async function initHeroSlider() {
      let heroConfig = { autoplay: true, slideSpeed: 4500, items: [] };
      try {
        heroConfig = await (await fetch("Tabs/Slidehero.json?t=" + Date.now())).json();
      } catch (e) {}

      // Tổng hợp tất cả item từ các section JSON + Slidehero.json và sắp xếp mới nhất trước
      const combined = [...(window.KPazzApp?.searchableItems || []), ...(heroConfig.items || [])];
      combined.sort((a, b) => new Date(b.publishDate || 0) - new Date(a.publishDate || 0));
      const latestItems = combined.slice(0, 8);

      const track = document.getElementById("kp-hero-track");
      const dotsBox = document.getElementById("kp-hero-dots");
      if (!track || !latestItems.length) return;

      track.innerHTML = latestItems.map((item) => `
        <div class="kp-hero-slide" onclick='KPazzApp.openItemDetail(${JSON.stringify(item).replace(/'/g, "&apos;")})'>
          <img class="hero-bg" src="${item.banner || item.icon}" alt="${item.title}" />
          <div class="kp-hero-glass-card">
            <img class="hero-icon" src="${item.icon}" alt="${item.title}" />
            <div style="flex:1;overflow:hidden;">
              <span style="font-size:0.72rem;text-transform:uppercase;letter-spacing:0.6px;color:#38bdf8;font-weight:700;">
                <i class="fa-solid fa-bolt"></i> Mới cập nhật • ${item.publishDate || "2026"}
              </span>
              <h2 style="font-size:1.15rem;margin:2px 0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;">${item.title}</h2>
              <p style="font-size:0.8rem;opacity:0.85;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;">${item.description || ""}</p>
            </div>
          </div>
        </div>
      `).join("");

      dotsBox.innerHTML = latestItems.map((_, idx) => `<span class="kp-hero-dot ${idx === 0 ? "active" : ""}"></span>`).join("");

      let current = 0;
      const dots = dotsBox.querySelectorAll(".kp-hero-dot");
      const goTo = (idx) => {
        current = (idx + latestItems.length) % latestItems.length;
        track.style.transform = `translateX(-${current * 100}%)`;
        dots.forEach((d, i) => d.classList.toggle("active", i === current));
      };

      if (heroConfig.autoplay !== false) {
        setInterval(() => goTo(current + 1), heroConfig.slideSpeed || 4500);
      }
    })();
  </script>
</section>
