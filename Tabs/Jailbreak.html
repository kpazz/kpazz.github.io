<section id="sec-jb-root" class="kp-sec-jb-wrap" style="padding:18px 16px;">
  <style>
    .kp-sec-jb-head {
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
      margin-bottom: 14px;
      cursor: pointer;
    }
    .kp-sec-jb-track {
      display: flex;
      gap: 16px;
      overflow-x: auto;
      scroll-behavior: smooth;
      padding: 10px 8px 14px;
      perspective: 1100px;
    }
    .kp-sec-jb-track::-webkit-scrollbar { height: 5px; }
    .kp-sec-jb-track::-webkit-scrollbar-thumb { background: rgba(148,163,184,0.35); border-radius: 99px; }

    /* Base Wrapper & Card */
    .jb-cq-wrapper {
      container-type: inline-size;
      min-width: 310px;
      max-width: 310px;
      transform-style: preserve-3d;
      transition: transform 0.55s cubic-bezier(0.22, 1, 0.36, 1), opacity 0.45s ease;
    }
    .jb-cq-card {
      border-radius: 22px;
      padding: 16px;
      display: grid;
      grid-template-columns: 72px 1fr;
      gap: 14px;
      align-items: center;
      cursor: pointer;
      position: relative;
      overflow: hidden;
      height: 100%;
      transition: transform 0.35s ease, box-shadow 0.35s ease;
    }
    .jb-cq-card:hover { transform: translateY(-4px); }
    .jb-cq-icon {
      width: 72px;
      height: 72px;
      border-radius: 18px;
      object-fit: cover;
      flex-shrink: 0;
      transition: transform 0.65s cubic-bezier(0.22, 1, 0.36, 1);
    }
    .jb-meta-tags {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      font-size: 0.74rem;
      color: var(--text-secondary);
      margin: 6px 0 10px;
    }
    .jb-dl-btn {
      padding: 7px 14px;
      border-radius: 12px;
      border: 1px solid var(--glass-border);
      background: linear-gradient(135deg, #6366f1, #8b5cf6);
      color: #fff;
      font-size: 0.78rem;
      font-weight: 700;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }

    /* ==================== CÁC KIỂU CARD (stylesection / stylecard) ==================== */
    .jb-cq-wrapper.jb-card-container-query-product {
      min-width: 310px;
      max-width: 310px;
    }

    .jb-cq-wrapper.jb-card-appstore-card .jb-cq-card,
    .jb-cq-wrapper.jb-card-appstore-featured .jb-cq-card {
      grid-template-columns: 1fr;
      align-items: stretch;
      border-left: 4px solid #8b5cf6;
    }
    .jb-cq-wrapper.jb-card-appstore-card .jb-cq-icon,
    .jb-cq-wrapper.jb-card-appstore-featured .jb-cq-icon {
      width: 56px;
      height: 56px;
      border-radius: 15px;
    }

    .jb-cq-wrapper.jb-card-glassmorphism-profile-info {
      min-width: 265px;
      max-width: 265px;
    }
    .jb-cq-wrapper.jb-card-glassmorphism-profile-info .jb-cq-card {
      grid-template-columns: 1fr;
      text-align: center;
      justify-items: center;
    }
    .jb-cq-wrapper.jb-card-glassmorphism-profile-info .jb-cq-icon {
      width: 66px;
      height: 66px;
      border-radius: 50%;
      border: 2px solid #8b5cf6;
    }
    .jb-cq-wrapper.jb-card-glassmorphism-profile-info .jb-meta-tags {
      justify-content: center;
    }

    .jb-cq-wrapper.jb-card-movie-pulp-fiction,
    .jb-cq-wrapper.jb-card-magazine-overlay-card {
      min-width: 255px;
      max-width: 255px;
    }
    .jb-cq-wrapper.jb-card-movie-pulp-fiction .jb-cq-card,
    .jb-cq-wrapper.jb-card-magazine-overlay-card .jb-cq-card {
      height: 290px;
      grid-template-columns: 1fr;
      align-content: end;
      color: #fff;
    }
    .jb-cq-wrapper.jb-card-movie-pulp-fiction .jb-cq-icon,
    .jb-cq-wrapper.jb-card-magazine-overlay-card .jb-cq-icon {
      width: 50px;
      height: 50px;
      border-radius: 13px;
    }

    .jb-cq-wrapper.jb-card-minimal-bento-tile {
      min-width: 235px;
      max-width: 235px;
    }
    .jb-cq-wrapper.jb-card-minimal-bento-tile .jb-cq-card {
      grid-template-columns: 1fr;
      min-height: 205px;
      border-radius: 26px;
    }

    .jb-cq-wrapper.jb-card-split-banner-card,
    .jb-cq-wrapper.jb-card-parallax-horizon-card,
    .jb-cq-wrapper.jb-card-spotlight-hero-card {
      min-width: 345px;
      max-width: 345px;
    }
    .jb-cq-wrapper.jb-card-split-banner-card .jb-cq-card,
    .jb-cq-wrapper.jb-card-parallax-horizon-card .jb-cq-card,
    .jb-cq-wrapper.jb-card-spotlight-hero-card .jb-cq-card {
      border-bottom: 3px solid #6366f1;
    }

    /* ==================== 10 KIỂU SLIDE (slideType / styleslide) ==================== */
    .jb-cq-wrapper.jb-slide-horizontal-scroll.is-active { transform: translateY(-3px); }
    .jb-cq-wrapper.jb-slide-coverflow-3d { transform: rotateY(-8deg) scale(0.96); opacity: 0.88; }
    .jb-cq-wrapper.jb-slide-coverflow-3d.is-active { transform: rotateY(0deg) scale(1.03); opacity: 1; }
    .jb-cq-wrapper.jb-slide-fade-cross.is-dim { opacity: 0.55; }
    .jb-cq-wrapper.jb-slide-cards-stack.is-active { transform: translateY(-5px) scale(1.02); }
    .jb-cq-wrapper.jb-slide-cube-rotate.is-active .jb-cq-icon { transform: rotateY(360deg); }
    .jb-cq-wrapper.jb-slide-flip-card.is-active { transform: rotateY(8deg); }
    .jb-cq-wrapper.jb-slide-parallax-banner.is-active .jb-cq-icon { transform: translateX(4px) scale(1.06); }
    .jb-cq-wrapper.jb-slide-center-zoom.is-active { transform: scale(1.05); }
    .jb-cq-wrapper.jb-slide-vertical-ticker.is-tick-up { transform: translateY(-4px); }
    .jb-cq-wrapper.jb-slide-vertical-ticker.is-tick-down { transform: translateY(2px); }
  </style>

  <div class="kp-sec-jb-head" id="jb-header-trigger">
    <div>
      <h2 id="jb-sec-title" style="font-size:1.25rem;"></h2>
      <p id="jb-sec-desc" style="font-size:0.84rem;color:var(--text-secondary);"></p>
    </div>
    <span style="font-size:0.8rem;color:var(--accent);font-weight:600;">Xem tất cả <i class="fa-solid fa-chevron-right"></i></span>
  </div>

  <div class="kp-sec-jb-track" id="jb-cards-track"></div>

  <script>
    (async function renderJailbreakSection() {
      const res = await fetch("Tabs/sec_Jailbreak.json?t=" + Date.now());
      const secData = await res.json();

      document.getElementById("jb-sec-title").textContent = secData.sectionTitle || "";
      document.getElementById("jb-sec-desc").textContent = secData.sectionDescription || "";
      document.getElementById("jb-header-trigger").onclick = () => KPazzApp.openSectionAllModal(secData);

      const validCards = [
        "container-query-product",
        "appstore-card",
        "appstore-featured",
        "glassmorphism-profile-info",
        "movie-pulp-fiction",
        "magazine-overlay-card",
        "minimal-bento-tile",
        "split-banner-card",
        "parallax-horizon-card",
        "spotlight-hero-card"
      ];
      const rawCard = (secData.stylesection || secData.stylecard || "container-query-product").trim();
      const cardStyle = validCards.includes(rawCard) ? rawCard : "container-query-product";

      const validSlides = [
        "horizontal-scroll",
        "coverflow-3d",
        "fade-cross",
        "cards-stack",
        "cube-rotate",
        "flip-card",
        "parallax-banner",
        "center-zoom",
        "vertical-ticker",
        "smooth-marquee"
      ];
      const rawSlide = (secData.slideType || secData.styleslide || "horizontal-scroll").trim();
      const slideType = validSlides.includes(rawSlide) ? rawSlide : "horizontal-scroll";

      const items = (secData.items || []).slice(0, 20);
      const track = document.getElementById("jb-cards-track");
      const isPosterStyle = cardStyle === "movie-pulp-fiction" || cardStyle === "magazine-overlay-card";

      track.innerHTML = items.map((item) => {
        const posterBg = isPosterStyle && (item.banner || item.icon)
          ? `style="background:linear-gradient(to top, rgba(2, 6, 23, 0.9), rgba(49, 46, 129, 0.35)), url('${item.banner || item.icon}') center/cover no-repeat;"`
          : "";

        return `
          <div class="jb-cq-wrapper jb-card-${cardStyle} jb-slide-${slideType}">
            <article class="jb-cq-card liquid-glass" ${posterBg}
                     onclick='KPazzApp.openItemDetail(${JSON.stringify(item).replace(/'/g, "&apos;")})'>
              <img class="jb-cq-icon" src="${item.icon}" alt="${item.title}" />
              <div style="overflow:hidden;width:100%;">
                <h3 style="font-size:0.96rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;">${item.title}</h3>
                <div class="jb-meta-tags" style="${isPosterStyle ? "color:rgba(255,255,255,0.84);" : ""}">
                  <span><i class="fa-solid fa-tag"></i> ${item.category}</span>
                  <span><i class="fa-regular fa-calendar"></i> ${item.publishDate}</span>
                </div>
                ${item.isApp ? `
                  <button class="jb-dl-btn" onclick='event.stopPropagation();KPazzApp.openDownloadLinks(${JSON.stringify(item).replace(/'/g, "&apos;")})'>
                    <i class="fa-solid fa-cloud-arrow-down"></i> Tải ${item.fileFormat || "IPA"}
                  </button>` : ""}
              </div>
            </article>
          </div>
        `;
      }).join("");

      const wrappers = Array.from(track.querySelectorAll(".jb-cq-wrapper"));
      if (wrappers[0] && (slideType === "coverflow-3d" || slideType === "center-zoom")) {
        wrappers[0].classList.add("is-active");
      }

      if (secData.autoplay && wrappers.length > 0) {
        const speed = secData.slideSpeed || (slideType === "smooth-marquee" ? 1800 : 4000);
        let idx = 0;
        let dir = false;

        setInterval(() => {
          idx = (idx + 1) % wrappers.length;
          dir = !dir;

          wrappers.forEach((el, i) => {
            el.classList.remove("is-active", "is-dim", "is-tick-up", "is-tick-down");
            if (slideType === "vertical-ticker") {
              const up = i % 2 === 0 ? dir : !dir;
              el.classList.add(up ? "is-tick-up" : "is-tick-down");
            } else if (slideType === "fade-cross") {
              if (i !== idx) el.classList.add("is-dim");
            } else if (i === idx) {
              el.classList.add("is-active");
            }
          });

          const step = (wrappers[0].offsetWidth || 310) + 16;
          if (track.scrollLeft + track.clientWidth >= track.scrollWidth - 10) {
            if (secData.loop !== false) {
              track.scrollTo({ left: 0, behavior: "smooth" });
            }
          } else {
            track.scrollBy({ left: slideType === "smooth-marquee" ? step * 0.65 : step, behavior: "smooth" });
          }
        }, speed);
      }
    })();
  </script>
</section>
