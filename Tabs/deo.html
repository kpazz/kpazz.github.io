<meta charset="UTF-8">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Noto+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">

<style>
    .ios-game-section {
        --slide-speed: 650ms;
        background-color: #000000;
        color: #FFFFFF;
        font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Inter", "Noto Sans", "Helvetica Neue", Arial, sans-serif;
        width: 100%;
        max-width: 100%;
        box-sizing: border-box;
        padding: clamp(14px, 3.5vw, 28px) clamp(14px, 4vw, 24px);
        margin: 0;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
        text-rendering: optimizeLegibility;
    }

    .ios-game-section *,
    .ios-game-section *::before,
    .ios-game-section *::after {
        box-sizing: border-box;
        font-family: inherit;
    }

    .ios-section-header {
        width: 100%;
        margin-bottom: 12px;
        padding-left: 2px;
    }

    .ios-section-header h2 {
        font-size: clamp(21px, 5.6vw, 28px);
        font-weight: 700;
        line-height: 1.2;
        letter-spacing: -0.025em;
        color: #FFFFFF;
        margin: 0 0 3px 0;
    }

    .ios-section-header p {
        font-size: clamp(13.5px, 3.8vw, 16px);
        font-weight: 400;
        line-height: 1.35;
        letter-spacing: -0.012em;
        color: #8E8E93;
        margin: 0;
    }

    /* Khung slide mặc định: snap / smooth / scroll / marquee */
    .ios-card-slider {
        display: flex;
        flex-direction: row;
        gap: 14px;
        width: 100%;
        overflow-x: auto;
        scroll-snap-type: x mandatory;
        scroll-behavior: smooth;
        -webkit-overflow-scrolling: touch;
        scrollbar-width: none;
        padding-bottom: 4px;
    }

    .ios-card-slider::-webkit-scrollbar {
        display: none;
    }

    .ios-card-slider.slide-type-smooth,
    .ios-card-slider.slide-type-scroll,
    .ios-card-slider.slide-type-marquee {
        scroll-snap-type: none;
    }

    .ios-game-card {
        flex: 0 0 100%;
        width: 100%;
        max-width: 100%;
        scroll-snap-align: start;
        background-color: #1D211E;
        border-radius: clamp(16px, 4.2vw, 22px);
        overflow: hidden;
        box-shadow: 0 16px 36px rgba(0, 0, 0, 0.65);
        border: 1px solid rgba(255, 255, 255, 0.06);
        transform: scale(1);
        transform-origin: center center;
        transition: transform 0.2s cubic-bezier(0.22, 1, 0.36, 1),
                    opacity var(--slide-speed) ease;
        -webkit-tap-highlight-color: transparent;
        user-select: none;
        cursor: pointer;
    }

    @media (hover: hover) {
        .ios-game-card:hover {
            transform: scale(0.975);
        }
    }

    .ios-game-card.is-pressed {
        transform: scale(0.975) !important;
    }

    /* Kiểu slide chuyển mờ dần (fade) */
    .ios-card-slider.slide-type-fade {
        position: relative;
        display: block;
        overflow: hidden;
    }

    .ios-card-slider.slide-type-fade .ios-game-card {
        display: none;
        opacity: 0;
    }

    .ios-card-slider.slide-type-fade .ios-game-card.is-active {
        display: block;
        opacity: 1;
    }

    @media (min-width: 640px) {
        .ios-card-slider:not(.slide-type-fade).has-multiple .ios-game-card {
            flex: 0 0 calc(92% - 7px);
        }
    }

    @media (min-width: 900px) {
        .ios-card-slider:not(.slide-type-fade).has-multiple .ios-game-card {
            flex: 0 0 calc(68% - 7px);
        }
    }

    /* Khi nhúng vào index.html: hé card kế tiếp giống ảnh trang chủ */
    #tabs-container .ios-card-slider:not(.slide-type-fade).has-multiple .ios-game-card {
        flex: 0 0 82%;
        max-width: 82%;
    }

    @media (min-width: 640px) {
        #tabs-container .ios-card-slider:not(.slide-type-fade).has-multiple .ios-game-card {
            flex: 0 0 calc(80% - 7px);
            max-width: calc(80% - 7px);
        }
    }

    @media (min-width: 900px) {
        #tabs-container .ios-card-slider:not(.slide-type-fade).has-multiple .ios-game-card {
            flex: 0 0 calc(62% - 7px);
            max-width: calc(62% - 7px);
        }
    }

    .ios-card-hero {
        position: relative;
        width: 100%;
        aspect-ratio: 4 / 4.35;
        min-height: 360px;
        max-height: 580px;
        overflow: hidden;
        background-color: #16241B;
    }

    .ios-card-hero img.hero-img {
        width: 100%;
        height: 100%;
        object-fit: cover;
        object-position: center;
        display: block;
    }

    .ios-card-hero::after {
        content: "";
        position: absolute;
        inset: 0;
        background: linear-gradient(
            to top,
            rgba(0, 0, 0, 0.94) 0%,
            rgba(10, 16, 12, 0.72) 28%,
            rgba(10, 16, 12, 0.14) 54%,
            rgba(0, 0, 0, 0) 78%
        );
        z-index: 1;
    }

    /* Thẻ cập nhật góc trên trái ảnh banner card */
    .ios-card-update-badge {
        position: absolute;
        top: 12px;
        left: 12px;
        z-index: 3;
        display: inline-flex;
        flex-direction: column;
        align-items: flex-start;
        padding: 7px 12px;
        border-radius: 13px;
        background-color: rgba(24, 28, 34, 0.72);
        border: none;
        box-shadow: 0 10px 26px rgba(0, 0, 0, 0.36);
        backdrop-filter: blur(18px) saturate(165%);
        -webkit-backdrop-filter: blur(18px) saturate(165%);
        line-height: 1.15;
        pointer-events: none;
        transition: background-color 0.25s ease;
    }

    .ios-card-update-label {
        font-size: 9.5px;
        font-weight: 700;
        letter-spacing: 0.03em;
        color: rgba(255, 255, 255, 0.85);
    }

    .ios-card-update-time {
        font-size: 12px;
        font-weight: 800;
        color: #FFFFFF;
        margin-top: 2px;
    }

    .ios-hero-content {
        position: absolute;
        left: 0;
        right: 0;
        bottom: 0;
        padding: clamp(16px, 4.2vw, 24px) clamp(16px, 4.5vw, 26px) clamp(14px, 3.6vw, 20px);
        z-index: 2;
    }

    .ios-hero-tag {
        font-size: clamp(10px, 2.7vw, 11.5px);
        font-weight: 700;
        text-transform: uppercase;
        letter-spacing: 0.04em;
        color: rgba(255, 255, 255, 0.78);
        margin-bottom: 5px;
    }

    .ios-hero-title {
        font-size: clamp(25px, 6.8vw, 35px);
        font-weight: 700;
        line-height: 1.13;
        letter-spacing: -0.025em;
        color: #FFFFFF;
        margin: 0 0 7px 0;
        white-space: pre-line;
    }

    .ios-hero-desc {
        font-size: clamp(13px, 3.6vw, 15px);
        font-weight: 400;
        line-height: 1.35;
        letter-spacing: -0.01em;
        color: rgba(255, 255, 255, 0.85);
        margin: 0;
    }

    .ios-card-footer {
        width: 100%;
        background-color: #232924;
        padding: clamp(11px, 3vw, 15px) clamp(14px, 3.8vw, 20px);
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
    }

    .ios-app-left {
        display: flex;
        align-items: center;
        gap: 11px;
        min-width: 0;
        flex: 1;
    }

    .ios-app-icon {
        width: clamp(44px, 11.5vw, 52px);
        height: clamp(44px, 11.5vw, 52px);
        border-radius: 11px;
        object-fit: cover;
        flex-shrink: 0;
        border: 1px solid rgba(255, 255, 255, 0.14);
    }

    .ios-app-text {
        display: flex;
        flex-direction: column;
        min-width: 0;
    }

    .ios-app-name {
        font-size: clamp(13.5px, 3.7vw, 15.5px);
        font-weight: 600;
        line-height: 1.25;
        letter-spacing: -0.015em;
        color: #FFFFFF;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
    }

    .ios-app-genre {
        font-size: clamp(12px, 3.3vw, 13.5px);
        font-weight: 400;
        line-height: 1.25;
        color: #98989F;
        margin-top: 2px;
    }

    .ios-app-right {
        display: flex;
        flex-direction: column;
        align-items: center;
        flex-shrink: 0;
    }

    .ios-btn-get {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 6px;
        background-color: #0A84FF;
        color: #FFFFFF;
        font-size: clamp(12.5px, 3.3vw, 14px);
        font-weight: 700;
        line-height: 1;
        padding: 8px 14px;
        border: none;
        border-radius: 999px;
        cursor: pointer;
        white-space: nowrap;
        transition: background-color 0.15s ease, transform 0.1s ease;
    }

    .ios-btn-get svg {
        width: 16px;
        height: 16px;
        flex-shrink: 0;
    }

    .ios-btn-get:hover {
        background-color: #2492FF;
    }

    .ios-btn-get:active {
        transform: scale(0.96);
    }

    .ios-iap-note {
        font-size: 9px;
        font-weight: 500;
        line-height: 1.2;
        color: #98989F;
        margin-top: 4px;
    }

    .ios-slider-dots {
        display: flex;
        justify-content: center;
        align-items: center;
        gap: 7px;
        margin-top: 12px;
    }

    .ios-slider-dot {
        width: 7px;
        height: 7px;
        border-radius: 999px;
        background-color: rgba(255, 255, 255, 0.28);
        border: none;
        padding: 0;
        cursor: pointer;
        transition: width 0.2s ease, background-color 0.2s ease;
    }

    .ios-slider-dot.active {
        width: 18px;
        background-color: #FFFFFF;
    }

    /* Popup bố cục App Store */
    .ios-popup-backdrop {
        position: fixed;
        inset: 0;
        background: rgba(0, 0, 0, 0.78);
        backdrop-filter: blur(10px);
        -webkit-backdrop-filter: blur(10px);
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 12px;
        z-index: 9999;
        opacity: 0;
        visibility: hidden;
        pointer-events: none;
        transition: opacity 0.28s cubic-bezier(0.22, 1, 0.36, 1),
                    visibility 0.28s cubic-bezier(0.22, 1, 0.36, 1);
        font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Inter", "Noto Sans", "Helvetica Neue", Arial, sans-serif;
    }

    .ios-popup-backdrop.is-open {
        opacity: 1;
        visibility: visible;
        pointer-events: auto;
    }

    .ios-popup-backdrop *,
    .ios-popup-backdrop *::before,
    .ios-popup-backdrop *::after {
        box-sizing: border-box;
        font-family: inherit;
    }

    .ios-popup-modal {
        position: relative;
        width: 100%;
        max-width: 440px;
        max-height: 92vh;
        overflow-y: auto;
        scrollbar-width: none;
        background: #050607;
        color: #FFFFFF;
        border: 1px solid rgba(255, 255, 255, 0.16);
        border-radius: 26px;
        box-shadow: 0 24px 64px rgba(0, 0, 0, 0.9);
        transform: translateY(22px) scale(0.95);
        opacity: 0;
        transition: transform 0.32s cubic-bezier(0.22, 1, 0.36, 1),
                    opacity 0.24s ease;
    }

    .ios-popup-modal::-webkit-scrollbar {
        display: none;
    }

    .ios-popup-backdrop.is-open .ios-popup-modal {
        transform: translateY(0) scale(1);
        opacity: 1;
    }

    .ios-popup-toast {
        position: fixed;
        left: 50%;
        bottom: 24px;
        transform: translateX(-50%) translateY(12px);
        background: rgba(34, 34, 38, 0.94);
        color: #FFFFFF;
        font-size: 13px;
        font-weight: 600;
        padding: 9px 16px;
        border-radius: 999px;
        border: 1px solid rgba(255, 255, 255, 0.14);
        box-shadow: 0 10px 28px rgba(0, 0, 0, 0.65);
        z-index: 10002;
        opacity: 0;
        pointer-events: none;
        transition: opacity 0.2s ease, transform 0.2s ease;
    }

    .ios-popup-toast.is-visible {
        opacity: 1;
        transform: translateX(-50%) translateY(0);
    }

    /* Popup chọn phiên bản / link tải */
    .ios-version-picker-backdrop {
        position: fixed;
        inset: 0;
        background: rgba(0, 0, 0, 0.68);
        backdrop-filter: blur(12px);
        -webkit-backdrop-filter: blur(12px);
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 16px;
        z-index: 10001;
        opacity: 0;
        visibility: hidden;
        pointer-events: none;
        transition: opacity 0.24s cubic-bezier(0.22, 1, 0.36, 1),
                    visibility 0.24s cubic-bezier(0.22, 1, 0.36, 1);
        font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Inter", "Noto Sans", "Helvetica Neue", Arial, sans-serif;
    }

    .ios-version-picker-backdrop.is-open {
        opacity: 1;
        visibility: visible;
        pointer-events: auto;
    }

    .ios-version-picker-backdrop *,
    .ios-version-picker-backdrop *::before,
    .ios-version-picker-backdrop *::after {
        box-sizing: border-box;
        font-family: inherit;
    }

    .ios-version-picker-modal {
        width: 100%;
        max-width: 390px;
        max-height: 82vh;
        overflow-y: auto;
        scrollbar-width: none;
        background: rgba(22, 24, 29, 0.96);
        color: #FFFFFF;
        border: 1px solid rgba(255, 255, 255, 0.16);
        border-radius: 24px;
        padding: 16px;
        box-shadow: 0 24px 60px rgba(0, 0, 0, 0.85);
        transform: translateY(16px) scale(0.96);
        opacity: 0;
        transition: transform 0.28s cubic-bezier(0.22, 1, 0.36, 1),
                    opacity 0.22s ease;
    }

    .ios-version-picker-modal::-webkit-scrollbar {
        display: none;
    }

    .ios-version-picker-backdrop.is-open .ios-version-picker-modal {
        transform: translateY(0) scale(1);
        opacity: 1;
    }

    .ios-version-picker-head {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 10px;
        margin-bottom: 12px;
    }

    .ios-version-picker-app {
        display: flex;
        align-items: center;
        gap: 10px;
        min-width: 0;
    }

    .ios-version-picker-icon {
        width: 42px;
        height: 42px;
        border-radius: 10px;
        object-fit: cover;
        flex-shrink: 0;
        border: 1px solid rgba(255, 255, 255, 0.14);
    }

    .ios-version-picker-title {
        font-size: 16px;
        font-weight: 700;
        line-height: 1.2;
        color: #FFFFFF;
        margin: 0;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
    }

    .ios-version-picker-sub {
        font-size: 12px;
        color: #98989F;
        margin: 2px 0 0 0;
    }

    .ios-version-picker-close {
        width: 30px;
        height: 30px;
        border-radius: 999px;
        border: none;
        background: rgba(255, 255, 255, 0.12);
        color: #FFFFFF;
        font-size: 16px;
        line-height: 1;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        cursor: pointer;
        flex-shrink: 0;
    }

    .ios-version-picker-close:hover {
        background: rgba(255, 255, 255, 0.2);
    }

    .ios-version-picker-list {
        display: flex;
        flex-direction: column;
        gap: 8px;
    }

    .ios-version-option {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 10px;
        width: 100%;
        padding: 11px 13px;
        border-radius: 14px;
        border: 1px solid rgba(255, 255, 255, 0.1);
        background: rgba(255, 255, 255, 0.05);
        color: #FFFFFF;
        text-align: left;
        cursor: pointer;
        transition: background-color 0.15s ease, border-color 0.15s ease;
    }

    .ios-version-option:hover {
        background: rgba(10, 132, 255, 0.18);
        border-color: rgba(10, 132, 255, 0.55);
    }

    .ios-version-option-info {
        display: flex;
        flex-direction: column;
        min-width: 0;
        flex: 1;
    }

    .ios-version-option-name {
        font-size: 14px;
        font-weight: 700;
        color: #FFFFFF;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
    }

    .ios-version-option-meta {
        font-size: 11.5px;
        color: #98989F;
        margin-top: 2px;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
    }

    .ios-version-option-cta {
        background: #0A84FF;
        color: #FFFFFF;
        font-size: 12px;
        font-weight: 700;
        padding: 6px 12px;
        border-radius: 999px;
        white-space: nowrap;
        flex-shrink: 0;
    }

    .ios-version-picker-empty {
        font-size: 13px;
        color: #98989F;
        text-align: center;
        padding: 14px 8px;
        margin: 0;
    }

    /* Thanh sticky trên cùng của popup khi cuộn qua nút tải */
    .ios-popup-sticky-bar {
        position: sticky;
        top: 0;
        z-index: 20;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 10px;
        padding: 10px 14px;
        background: rgba(24, 24, 26, 0.78);
        backdrop-filter: blur(22px) saturate(165%);
        -webkit-backdrop-filter: blur(22px) saturate(165%);
        border-bottom: 0.5px solid rgba(255, 255, 255, 0.14);
        opacity: 0;
        visibility: hidden;
        pointer-events: none;
        transform: translateY(-16px);
        transition: opacity 0.5s cubic-bezier(0.22, 1, 0.36, 1),
                    transform 0.56s cubic-bezier(0.22, 1, 0.36, 1),
                    visibility 0.5s linear;
        margin-bottom: -54px;
    }

    .ios-popup-sticky-bar.is-visible {
        opacity: 1;
        visibility: visible;
        pointer-events: auto;
        transform: translateY(0);
    }

    .ios-popup-sticky-bar #ios-popup-sticky-download {
        opacity: 0;
        transform: translateY(-10px) scale(0.64);
        transform-origin: right center;
        will-change: transform, opacity;
        box-shadow: 0 6px 18px rgba(10, 132, 255, 0.38);
        transition: opacity 0.46s cubic-bezier(0.22, 1, 0.36, 1) 0.12s,
                    transform 0.68s cubic-bezier(0.28, 1.42, 0.52, 1) 0.12s,
                    box-shadow 0.46s ease 0.12s,
                    background-color 0.15s ease;
    }

    .ios-popup-sticky-bar.is-visible #ios-popup-sticky-download {
        opacity: 1;
        transform: translateY(0) scale(1);
    }

    .ios-popup-sticky-icon {
        width: 30px;
        height: 30px;
        border-radius: 7px;
        object-fit: cover;
        border: 1px solid rgba(255, 255, 255, 0.14);
    }

    /* Banner đầu trang hòa trộn mờ liền mạch xuống nền bên dưới */
    .ios-store-hero {
        position: relative;
        width: 100%;
        aspect-ratio: 16 / 11.4;
        overflow: hidden;
        background: #050607;
    }

    .ios-store-hero img {
        width: 100%;
        height: 100%;
        object-fit: cover;
        display: block;
    }

    .ios-store-hero::before {
        content: "";
        position: absolute;
        left: -16px;
        right: -16px;
        bottom: -16px;
        height: 62%;
        backdrop-filter: blur(28px) saturate(165%);
        -webkit-backdrop-filter: blur(28px) saturate(165%);
        -webkit-mask-image: linear-gradient(
            to top,
            rgba(0, 0, 0, 1) 0%,
            rgba(0, 0, 0, 0.85) 55%,
            rgba(0, 0, 0, 0) 100%
        );
        mask-image: linear-gradient(
            to top,
            rgba(0, 0, 0, 1) 0%,
            rgba(0, 0, 0, 0.85) 55%,
            rgba(0, 0, 0, 0) 100%
        );
        z-index: 1;
        pointer-events: none;
    }

    .ios-store-hero::after {
        content: "";
        position: absolute;
        inset: 0;
        background: linear-gradient(
            to bottom,
            rgba(5, 6, 7, 0.25) 0%,
            rgba(5, 6, 7, 0) 32%,
            rgba(5, 6, 7, 0.28) 60%,
            rgba(5, 6, 7, 0.78) 84%,
            rgba(5, 6, 7, 0.98) 100%
        );
        z-index: 1;
        pointer-events: none;
    }

    .ios-popup-body-glass {
        position: relative;
        z-index: 2;
        background: linear-gradient(
            to bottom,
            rgba(5, 6, 7, 0.52) 0%,
            rgba(5, 6, 7, 0.82) 48px,
            rgba(5, 6, 7, 0.96) 110px,
            #050607 160px
        );
        backdrop-filter: blur(24px) saturate(155%);
        -webkit-backdrop-filter: blur(24px) saturate(155%);
        box-shadow: 0 -24px 36px 12px rgba(5, 6, 7, 0.72);
    }

    .ios-store-topbar {
        position: absolute;
        top: 12px;
        left: 12px;
        right: 12px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        z-index: 2;
    }

    .ios-store-circle-btn {
        width: 34px;
        height: 34px;
        border-radius: 999px;
        border: 0.5px solid rgba(255, 255, 255, 0.16);
        background: rgba(34, 37, 42, 0.62);
        backdrop-filter: blur(18px) saturate(160%);
        -webkit-backdrop-filter: blur(18px) saturate(160%);
        color: #FFFFFF;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        cursor: pointer;
        flex-shrink: 0;
        transition: background-color 0.15s ease, transform 0.1s ease;
    }

    .ios-store-circle-btn:hover {
        background: rgba(60, 64, 70, 0.85);
    }

    .ios-store-circle-btn:active {
        transform: scale(0.94);
    }

    .ios-store-circle-btn svg {
        width: 18px;
        height: 18px;
    }

                <text x="120" y="220" text-anchor="middle" fill="#ffffff" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="800" letter-spacing="2">${ic.sub}</text>
            </svg>
            `);
        }

        function escapeHtmlText(str) {
            return String(str || "")
                .replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;")
                .replace(/"/g, "&quot;")
                .replace(/'/g, "&#39;");
        }

        function formatShortLinkLabel(rawUrl) {
            try {
                const parsed = new URL(rawUrl);
                let host = parsed.hostname.replace(/^www\./i, "");
                const parts = host.split(".").filter(Boolean);
                if (parts.length === 2) {
                    return parts[0];
                }
                return host;
            } catch (_) {
                const cleaned = String(rawUrl || "").replace(/^https?:\/\//i, "").split("/")[0];
                return cleaned || rawUrl;
            }
        }

        function isDirectImageUrl(rawUrl) {
            const clean = String(rawUrl || "").split(/[?#]/)[0];
            return /\.(?:jpe?g|png|webp|gif|avif|bmp|svg)$/i.test(clean);
        }

        function renderDescriptionWithShortLinks(containerEl, rawText, allowInlineImages = false) {
            if (!containerEl) return;
            const text = String(rawText || "");
            const tokenRegex = allowInlineImages
                ? /(\{\{\s*(?:img|image)\s*:\s*[^}\s]+\s*\}\}|https?:\/\/[^\s<]+)/gi
                : /(https?:\/\/[^\s<]+)/gi;

            let lastIndex = 0;
            let html = "";
            let match;

            while ((match = tokenRegex.exec(text)) !== null) {
                const matchedToken = match[0];
                const start = match.index;
                html += escapeHtmlText(text.slice(lastIndex, start));

                const tagMatch = allowInlineImages
                    ? matchedToken.match(/^\{\{\s*(?:img|image)\s*:\s*([^}\s]+)\s*\}\}$/i)
                    : null;

                if (tagMatch) {
                    const imgUrl = tagMatch[1].trim();
                    if (/^https?:\/\//i.test(imgUrl) || /^data:image\//i.test(imgUrl) || /^\//i.test(imgUrl)) {
                        html += `<img class="ios-inline-content-img" src="${escapeHtmlText(imgUrl)}" alt="Ảnh nội dung" loading="lazy">`;
                    } else {
                        html += escapeHtmlText(matchedToken);
                    }
                } else {
                    let cleanUrl = matchedToken;
                    let trailing = "";
                    const trailMatch = cleanUrl.match(/([.,!?;:]+)$/);
                    if (trailMatch) {
                        trailing = trailMatch[1];
                        cleanUrl = cleanUrl.slice(0, -trailing.length);
                    }

                    if (allowInlineImages && isDirectImageUrl(cleanUrl)) {
                        html += `<img class="ios-inline-content-img" src="${escapeHtmlText(cleanUrl)}" alt="Ảnh nội dung" loading="lazy">${escapeHtmlText(trailing)}`;
                    } else {
                        const label = formatShortLinkLabel(cleanUrl);
                        html += `<a class="ios-desc-link" href="${escapeHtmlText(cleanUrl)}" target="_blank" rel="noopener noreferrer">${escapeHtmlText(label)}</a>${escapeHtmlText(trailing)}`;
                    }
                }

                lastIndex = start + matchedToken.length;
            }

            html += escapeHtmlText(text.slice(lastIndex));
            containerEl.innerHTML = html;
        }

        function parseReleaseDateValue(rawDate) {
            if (!rawDate) return null;
            const s = String(rawDate).trim();
            if (!s) return null;

            const dmy = s.match(/^(\d{1,2})[\/\-](\d{1,2})[\/\-](\d{4})$/);
            if (dmy) {
                const day = Number(dmy[1]);
                const month = Number(dmy[2]) - 1;
                const year = Number(dmy[3]);
                const dt = new Date(year, month, day);
                if (dt.getFullYear() === year && dt.getMonth() === month && dt.getDate() === day) {
                    return dt;
                }
            }

            const ymd = s.match(/^(\d{4})[\/\-](\d{1,2})[\/\-](\d{1,2})/);
            if (ymd) {
                const year = Number(ymd[1]);
                const month = Number(ymd[2]) - 1;
                const day = Number(ymd[3]);
                const dt = new Date(year, month, day);
                if (dt.getFullYear() === year && dt.getMonth() === month && dt.getDate() === day) {
                    return dt;
                }
            }

            const parsed = new Date(s);
            return Number.isNaN(parsed.getTime()) ? null : new Date(parsed.getFullYear(), parsed.getMonth(), parsed.getDate());
        }

        function startOfWeekMonday(dateObj) {
            const d = new Date(dateObj.getFullYear(), dateObj.getMonth(), dateObj.getDate());
            const day = d.getDay();
            const diffToMonday = (day + 6) % 7;
            d.setDate(d.getDate() - diffToMonday);
            return d;
        }

        function formatRelativeUpdateText(rawDate) {
            const target = parseReleaseDateValue(rawDate);
            if (!target) return null;

            const now = new Date();
            const today = new Date(now.getFullYear(), now.getMonth(), now.getDate());
            const dayMs = 86400000;
            const diffDays = Math.round((today.getTime() - target.getTime()) / dayMs);

            if (diffDays <= 0) return "Hôm nay";
            if (diffDays === 1) return "Hôm qua";
            if (diffDays === 2) return "Hôm kia";

            const thisWeekStart = startOfWeekMonday(today);
            const targetWeekStart = startOfWeekMonday(target);
            const diffWeeks = Math.round((thisWeekStart.getTime() - targetWeekStart.getTime()) / (7 * dayMs));

            if (diffWeeks === 0) return "Tuần này";
            if (diffWeeks > 0 && diffWeeks <= 4) return `${diffWeeks} Tuần Trước`;

            const diffMonths = (today.getFullYear() - target.getFullYear()) * 12 + (today.getMonth() - target.getMonth());
            if (diffMonths === 0) return "Tháng này";
            if (diffMonths > 0 && diffMonths < 12) return `${diffMonths} Tháng Trước`;

            const diffYears = today.getFullYear() - target.getFullYear();
            if (diffYears === 0) return "Năm nay";
            return `${diffYears} Năm Trước`;
        }

        function paintBadgeWithRgb(badgeEl, r, g, b) {
            const labelEl = badgeEl.querySelector(".ios-card-update-label");
            const timeEl = badgeEl.querySelector(".ios-card-update-time");

            const maxC = Math.max(r, g, b);
            const minC = Math.min(r, g, b);
            if (maxC - minC < 36) {
                if (maxC < 120) {
                    r = Math.min(255, r + 48);
                    g = Math.min(255, g + 36);
                    b = Math.min(255, b + 24);
                } else {
                    r = Math.min(255, Math.round(r * 1.12 + 12));
                    g = Math.max(0, Math.round(g * 0.94));
                    b = Math.max(0, Math.round(b * 0.88));
                }
            }

            const luminance = (0.299 * r + 0.587 * g + 0.114 * b) / 255;
            const isLightBg = luminance > 0.54;

            badgeEl.style.border = "none";
            badgeEl.style.backgroundColor = `rgba(${r}, ${g}, ${b}, 0.76)`;
            if (isLightBg) {
                if (labelEl) labelEl.style.color = "rgba(5, 6, 7, 0.84)";
                if (timeEl) timeEl.style.color = "#050607";
            } else {
                if (labelEl) labelEl.style.color = "rgba(255, 255, 255, 0.88)";
                if (timeEl) timeEl.style.color = "#FFFFFF";
            }
        }

        function extractDominantRgbFromSvgDataUrl(src) {
            if (!src || !src.startsWith("data:image/svg+xml")) return null;
            try {
                const decoded = decodeURIComponent(src.split(",")[1] || "");
                const hexMatches = decoded.match(/#[0-9a-fA-F]{6}\b/g) || [];
                const candidates = hexMatches.filter((h) => !/^#0[0-9a-fA-F]{5}$/i.test(h));
                const chosen = candidates[0] || hexMatches[0];
                if (!chosen) return null;
                return {
                    r: parseInt(chosen.slice(1, 3), 16),
                    g: parseInt(chosen.slice(3, 5), 16),
                    b: parseInt(chosen.slice(5, 7), 16)
                };
            } catch (_) {
                return null;
            }
        }

        function applyBannerDominantColorToBadge(imgEl, badgeEl, fallbackIndex = 0) {
            if (!imgEl || !badgeEl) return;

            const applyColor = () => {
                try {
                    const canvas = document.createElement("canvas");
                    const ctx = canvas.getContext("2d");
                    if (!ctx) return;
                    const w = 36;
                    const h = 36;
                    canvas.width = w;
                    canvas.height = h;
                    ctx.drawImage(imgEl, 0, 0, w, h);
                    const data = ctx.getImageData(0, 0, w, h).data;

                    const buckets = new Map();
                    let fallbackR = 0, fallbackG = 0, fallbackB = 0, fallbackCount = 0;

                    for (let i = 0; i < data.length; i += 4) {
                        const a = data[i + 3];
                        if (a < 128) continue;
                        const r = data[i];
                        const g = data[i + 1];
                        const b = data[i + 2];

                        fallbackR += r;
                        fallbackG += g;
                        fallbackB += b;
                        fallbackCount++;

                        const rq = Math.min(15, r >> 4);
                        const gq = Math.min(15, g >> 4);
                        const bq = Math.min(15, b >> 4);
                        const key = `${rq},${gq},${bq}`;

                        const sat = Math.max(r, g, b) - Math.min(r, g, b);
                        const weight = 1 + sat * 0.035;

                        const entry = buckets.get(key) || { score: 0, rSum: 0, gSum: 0, bSum: 0, px: 0 };
                        entry.score += weight;
                        entry.rSum += r;
                        entry.gSum += g;
                        entry.bSum += b;
                        entry.px += 1;
                        buckets.set(key, entry);
                    }

                    let best = null;
                    buckets.forEach((entry) => {
                        if (!best || entry.score > best.score) {
                            best = entry;
                        }
                    });

                    if (best && best.px > 0) {
                        paintBadgeWithRgb(
                            badgeEl,
                            Math.round(best.rSum / best.px),
                            Math.round(best.gSum / best.px),
                            Math.round(best.bSum / best.px)
                        );
                        return;
                    }

                    if (fallbackCount > 0) {
                        paintBadgeWithRgb(
                            badgeEl,
                            Math.round(fallbackR / fallbackCount),
                            Math.round(fallbackG / fallbackCount),
                            Math.round(fallbackB / fallbackCount)
                        );
                        return;
                    }
                } catch (_) {}

                const svgRgb = extractDominantRgbFromSvgDataUrl(imgEl.currentSrc || imgEl.src);
                if (svgRgb) {
                    paintBadgeWithRgb(badgeEl, svgRgb.r, svgRgb.g, svgRgb.b);
                    return;
                }

                const defaultPalettes = [
                    { r: 58, g: 89, b: 56 },
                    { r: 40, g: 70, b: 107 },
                    { r: 140, g: 62, b: 112 }
                ];
                const d = defaultPalettes[fallbackIndex % defaultPalettes.length];
                paintBadgeWithRgb(badgeEl, d.r, d.g, d.b);
            };

            if (!imgEl.crossOrigin && !/^data:/i.test(imgEl.src || "")) {
                imgEl.crossOrigin = "anonymous";
            }

            if (imgEl.complete && imgEl.naturalWidth > 0) {
                applyColor();
            } else {
                imgEl.addEventListener("load", applyColor, { once: true });
                imgEl.addEventListener("error", applyColor, { once: true });
            }
        }

        function extractDownloadOptions(item) {
            if (!item || typeof item !== "object") return [];
            const rawList =
                item.downloads ||
                item.versions ||
                item.downloadLinks ||
                item.links ||
                item.mirrors ||
                item.downloadOptions ||
                item.options;

            const prefix = String(
                item.downloadOptionPrefix ||
                item.optionPrefix ||
                currentSliderConfig.downloadOptionPrefix ||
                "Link tải"
            ).trim();
            const useVersionText = item.useVersionInPicker === true && isAppEntry(item);

            const options = [];
            if (Array.isArray(rawList)) {
                rawList.forEach((entry, idx) => {
                    const defaultName = `${prefix} ${idx + 1}`;
                    if (typeof entry === "string" && entry.trim() && entry.trim() !== "#") {
                        const label = useVersionText && item.version && idx === 0
                            ? String(item.version).trim()
                            : defaultName;
                        options.push({
                            label,
                            meta: [item.fileFormat, item.fileSize].filter(Boolean).join(" • "),
                            url: entry.trim()
                        });
                    } else if (entry && typeof entry === "object") {
                        const url = String(entry.url || entry.link || entry.href || entry.downloadUrl || "").trim();
                        if (!url || url === "#") return;
                        const explicitLabel = entry.label || entry.name || entry.title;
                        const label = explicitLabel
                            ? String(explicitLabel).trim()
                            : (useVersionText && entry.version
                                ? String(entry.version).trim()
                                : defaultName);
                        const metaParts = [
                            entry.note || entry.desc || entry.description || "",
                            (!useVersionText && entry.version && isAppEntry(item)) ? String(entry.version).trim() : "",
                            entry.format || entry.fileFormat || item.fileFormat || "",
                            entry.size || entry.fileSize || item.fileSize || ""
                        ].filter((x) => x && String(x).trim());
                        options.push({
                            label,
                            meta: metaParts.join(" • "),
                            url
                        });
                    }
                });
            }

            if (options.length > 0) return options;

            const singleUrl = String(item.buttonUrl || item.downloadUrl || item.url || "").trim();
            if (singleUrl && singleUrl !== "#") {
                const singleLabel = useVersionText && item.version
                    ? String(item.version).trim()
                    : `${prefix} 1`;
                return [{
                    label: singleLabel,
                    meta: [item.fileFormat, item.fileSize].filter(Boolean).join(" • ") || "Tải trực tiếp",
                    url: singleUrl
                }];
            }

            return [];
        }

        function resolveItemShareUrl(item) {
            const opts = extractDownloadOptions(item);
            if (opts.length > 0) {
                try {
                    return new URL(opts[0].url, window.location.href).href;
                } catch (_) {
                    return opts[0].url;
                }
            }
            const slug = encodeURIComponent((item && (item.appName || item.title)) || "item");

        async function shareCurrentItem(item) {
            const title = (item && (item.appName || item.title)) || "Ứng dụng";
            const text = (item && item.description) || title;
            const url = resolveItemShareUrl(item);

            if (navigator.share) {
                try {
                    await navigator.share({ title, text, url });
                    return;
                } catch (err) {
                    if (err && err.name === "AbortError") return;
                }
            }

            try {
                if (navigator.clipboard && navigator.clipboard.writeText) {
                    await navigator.clipboard.writeText(url);
                } else {
                    const tmp = document.createElement("textarea");
                    tmp.value = url;
                    document.body.appendChild(tmp);
                    tmp.select();
                    document.execCommand("copy");
                    document.body.removeChild(tmp);
                }
                showPopupToast("Đã sao chép liên kết");
            } catch (_) {
                showPopupToast(url);
            }
        }

        function toEmbedVideoUrl(rawUrl) {
            const url = String(rawUrl || "").trim();
            if (!url) return "";
            const ytMatch = url.match(/(?:youtube\.com\/(?:watch\?v=|embed\/|shorts\/)|youtu\.be\/)([A-Za-z0-9_-]{6,})/);
            if (ytMatch) {
                return `https://www.youtube.com/embed/${ytMatch[1]}`;
            }
            const vimeoMatch = url.match(/vimeo\.com\/(?:video\/)?(\d+)/);
            if (vimeoMatch) {
                return `https://player.vimeo.com/video/${vimeoMatch[1]}`;
            }
            return url;
        }

        function isIframeVideoUrl(rawUrl) {
            const url = String(rawUrl || "").trim();

        function buildMediaEntryHtml(entry, idx) {

        function shuffleArray(arr) {
            const copy = arr.slice();
            for (let i = copy.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [copy[i], copy[j]] = [copy[j], copy[i]];
            }
            return copy;
        }

        async function loadAllItemsPool(currentCards) {
            const seen = new Set();
            const pool = [];

            const addItems = (list) => {
                if (!Array.isArray(list)) return;
                list.forEach((it, idx) => {
                    if (!it || typeof it !== "object") return;
                    const key = `${it.appName || it.title || ""}__${isAppEntry(it) ? "app" : "nonapp"}__${idx}`;
                    if (!seen.has(key)) {
                        seen.add(key);
                        pool.push({ item: it, seedIndex: idx });
                    }
                });
            };

            addItems(currentCards);

            for (const url of EXTRA_JSON_URLS) {
                try {
                    const res = await fetch(url, { cache: "no-store" });
                    if (!res.ok) continue;
                    const json = await res.json();
                    const list = Array.isArray(json.cards) ? json.cards : (json.card ? [json.card] : []);
                    list.forEach((it, idx) => {
                        const exists = pool.some(
                            (entry) =>
                                (entry.item.appName || entry.item.title) === (it.appName || it.title) &&
                                isAppEntry(entry.item) === isAppEntry(it)
                        );
                        if (!exists) {
                            pool.push({ item: it, seedIndex: pool.length + idx });
                        }
                    });
                } catch (_) {}
            }

            allItemsPool = pool;
        }

        function stopPopupGalleryAutoplay() {
            if (popupGalleryTimer) {
                clearInterval(popupGalleryTimer);
                popupGalleryTimer = null;

            if (popupGalleryRafId) {
                cancelAnimationFrame(popupGalleryRafId);

                clearTimeout(popupGalleryResumeTimer);
                popupGalleryResumeTimer = null;
            }

        function bindHoldAndSwipePause(targetEl, getState, setState, getTimer, setTimer) {
            const pauseNow = () => {
                const st = getState();
                st.isHolding = true;
                st.isResumeDelayed = false;
                const existingTimer = getTimer();
                if (existingTimer) {
                    clearTimeout(existingTimer);
                    setTimer(null);
                }
            };

            const delayResume = () => {
                const st = getState();
                st.isHolding = false;
                st.isResumeDelayed = true;
                const existingTimer = getTimer();
                if (existingTimer) {
                    clearTimeout(existingTimer);
                }
                const nextTimer = setTimeout(() => {
                    st.isResumeDelayed = false;
                    setTimer(null);
                }, TOUCH_RESUME_DELAY_MS);
                setTimer(nextTimer);
            };

            targetEl.addEventListener("mouseenter", () => {
                getState().isHovering = true;
            });
            targetEl.addEventListener("mouseleave", () => {
                getState().isHovering = false;
            });
            targetEl.addEventListener("pointerdown", pauseNow, { passive: true });
            targetEl.addEventListener("pointerup", delayResume, { passive: true });
            targetEl.addEventListener("pointercancel", delayResume, { passive: true });
            targetEl.addEventListener("touchstart", pauseNow, { passive: true });
            targetEl.addEventListener("touchmove", pauseNow, { passive: true });
            targetEl.addEventListener("touchend", delayResume, { passive: true });
            targetEl.addEventListener("touchcancel", delayResume, { passive: true });
            targetEl.addEventListener("scroll", () => {
                if (getState().isHolding) {
                    pauseNow();
                } else {
                    delayResume();
                }
            }, { passive: true });
        }

        function setupPopupGallery(galleryEl, mediaList, config) {
            stopPopupGalleryAutoplay();
            galleryEl.innerHTML = "";
            if (!Array.isArray(mediaList) || mediaList.length === 0) return;

            mediaList.forEach((entry, idx) => {
                const itemEl = document.createElement("div");
                itemEl.className = "ios-popup-gallery-item";
                itemEl.innerHTML = buildMediaEntryHtml(entry, idx);
                galleryEl.appendChild(itemEl);
            });

            if (mediaList.length <= 1) return;

            const autoplay = config.autoplay !== false;
            if (!autoplay) return;

            const slideType = resolveSlideType(config.slideType);
            const slideSpeed = Number(config.slideSpeed) > 0 ? Number(config.slideSpeed) : 650;
            const marqueeSpeedPxPerSec = Number(config.marqueeSpeed) > 0 ? Number(config.marqueeSpeed) : 38;
            const loop = config.loop !== false;
            const autoplayInterval = Number(config.autoplayInterval) >= 1000 ? Number(config.autoplayInterval) : 4000;

            const pauseState = {
                isHolding: false,
                isHovering: false,
                isResumeDelayed: false
            };
            const isPaused = () => pauseState.isHolding || pauseState.isHovering || pauseState.isResumeDelayed;

            bindHoldAndSwipePause(
                galleryEl,
                () => pauseState,
                (next) => { Object.assign(pauseState, next); },
                () => popupGalleryResumeTimer,
                (t) => { popupGalleryResumeTimer = t; }
            );

            if (slideType === "marquee") {
                mediaList.forEach((entry, idx) => {
                    const clone = document.createElement("div");
                    clone.className = "ios-popup-gallery-item";
                    clone.innerHTML = buildMediaEntryHtml(entry, idx);
                    galleryEl.appendChild(clone);
                });

                let lastTime = performance.now();
                function tick(now) {
                    const dt = (now - lastTime) / 1000;
                    lastTime = now;
                    if (!isPaused()) {
                        const cycleWidth = galleryEl.scrollWidth / 2;
                        if (cycleWidth > 0) {
                            galleryEl.scrollLeft += marqueeSpeedPxPerSec * dt;
                            if (galleryEl.scrollLeft >= cycleWidth) {
                                galleryEl.scrollLeft -= cycleWidth;
                            }
                        }
                    }
                    popupGalleryRafId = requestAnimationFrame(tick);
                }
                popupGalleryRafId = requestAnimationFrame(tick);
                return;
            }

            let idx = 0;
            popupGalleryTimer = setInterval(() => {
                if (isPaused()) return;
                const items = Array.from(galleryEl.children);
                if (items.length <= 1) return;
                if (loop) {
                    idx = (idx + 1) % items.length;
                } else if (idx < items.length - 1) {
                    idx += 1;
                } else {
                    return;
                }
                const target = items[idx];
                animateHorizontalScroll(galleryEl, target.offsetLeft - galleryEl.offsetLeft, slideSpeed);
            }, autoplayInterval);
        }

        function animateHorizontalScroll(sliderEl, targetLeft, durationMs) {
            const startLeft = sliderEl.scrollLeft;
            const distance = targetLeft - startLeft;
            if (Math.abs(distance) < 1 || durationMs <= 0) {
                sliderEl.scrollLeft = targetLeft;
                return;
            }

            const startTime = performance.now();
            const prevBehavior = sliderEl.style.scrollBehavior;
            sliderEl.style.scrollBehavior = "auto";

            function step(now) {
                const elapsed = now - startTime;
                const progress = Math.min(elapsed / durationMs, 1);
                const ease = 1 - Math.pow(1 - progress, 3);
                sliderEl.scrollLeft = startLeft + distance * ease;

                if (progress < 1) {
                    requestAnimationFrame(step);
                } else {
                    sliderEl.style.scrollBehavior = prevBehavior;
                }
            }

            requestAnimationFrame(step);
        }

        function resolveSlideType(rawType) {
            const cleaned = String(rawType || "snap").trim().toLowerCase();
            return ALLOWED_SLIDE_TYPES.has(cleaned) ? cleaned : "snap";
        }

        function setupSliderController(sectionEl, sliderEl, dotsEl, cardsData, config) {
            if (autoplayTimer) {
                clearInterval(autoplayTimer);
                autoplayTimer = null;
            }
            if (marqueeRafId) {
                cancelAnimationFrame(marqueeRafId);
                marqueeRafId = null;
            }
            if (sliderResumeTimer) {
                clearTimeout(sliderResumeTimer);
                sliderResumeTimer = null;
            }

            dotsEl.innerHTML = "";
            const count = cardsData.length;
            if (count <= 1) return;

            const slideType = resolveSlideType(config.slideType);
            const slideSpeed = Number(config.slideSpeed) > 0 ? Number(config.slideSpeed) : 650;
            const marqueeSpeedPxPerSec = Number(config.marqueeSpeed) > 0 ? Number(config.marqueeSpeed) : 38;
            const autoplay = config.autoplay !== false;
            const loop = config.loop !== false;
            const autoplayInterval = Number(config.autoplayInterval) >= 1000 ? Number(config.autoplayInterval) : 4000;

            sectionEl.style.setProperty("--slide-speed", `${slideSpeed}ms`);
            sliderEl.classList.remove(
                "slide-type-snap",
                "slide-type-smooth",
                "slide-type-fade",
                "slide-type-scroll",
                "slide-type-marquee"
            );
            sliderEl.classList.add(`slide-type-${slideType}`);

            let currentIndex = 0;
            const pauseState = {
                isHolding: false,
                isHovering: false,
                isResumeDelayed: false
            };
            const dots = [];
            const cards = Array.from(sliderEl.children);

            const isPaused = () => pauseState.isHolding || pauseState.isHovering || pauseState.isResumeDelayed;

            bindHoldAndSwipePause(
                sliderEl,
                () => pauseState,
                (next) => { Object.assign(pauseState, next); },
                () => sliderResumeTimer,
                (t) => { sliderResumeTimer = t; }
            );

            if (slideType === "marquee") {
                dotsEl.style.display = "none";
                const originalCount = cards.length;
                cards.forEach((origCard, idx) => {
                    const clone = buildCardElement(cardsData[idx], idx);
                    clone.dataset.clone = "true";
                    sliderEl.appendChild(clone);
                });

                let lastTime = performance.now();
                sliderEl.style.scrollBehavior = "auto";

                function tickMarquee(now) {
                    const dt = (now - lastTime) / 1000;
                    lastTime = now;

                    if (autoplay && !isPaused()) {
                        const cycleWidth = sliderEl.scrollWidth / 2;
                        if (cycleWidth > 0) {
                            sliderEl.scrollLeft += marqueeSpeedPxPerSec * dt;
                            if (sliderEl.scrollLeft >= cycleWidth) {
                                sliderEl.scrollLeft -= cycleWidth;
                            }
                        }
                    }

                    marqueeRafId = requestAnimationFrame(tickMarquee);
                }

                if (originalCount > 1) {
                    marqueeRafId = requestAnimationFrame(tickMarquee);
                }
                return;
            }

            dotsEl.style.display = "";

            function applyActiveState(index, useAnimation = true) {
                if (loop) {
                    currentIndex = ((index % count) + count) % count;
                } else {
                    currentIndex = Math.max(0, Math.min(index, count - 1));
                }

                if (slideType === "fade") {
                    cards.forEach((c, idx) => {
                        c.classList.toggle("is-active", idx === currentIndex);
                    });
                } else {
                    const targetCard = cards[currentIndex];
                    if (targetCard) {
                        const targetLeft = targetCard.offsetLeft - sliderEl.offsetLeft;
                        if (useAnimation) {
                            animateHorizontalScroll(sliderEl, targetLeft, slideSpeed);
                        } else {
                            sliderEl.scrollLeft = targetLeft;
                        }
                    }
                }

                dots.forEach((d, idx) => d.classList.toggle("active", idx === currentIndex));
            }

            for (let i = 0; i < count; i++) {
                const dot = document.createElement("button");
                dot.type = "button";
                dot.className = "ios-slider-dot" + (i === 0 ? " active" : "");
                dot.setAttribute("aria-label", `Slide ${i + 1}`);
                dot.addEventListener("click", () => {
                    applyActiveState(i, true);
                    restartAutoplay();
                });
                dotsEl.appendChild(dot);
                dots.push(dot);
            }

            if (slideType === "fade") {
                applyActiveState(0, false);
            } else {
                sliderEl.addEventListener("scroll", () => {
                    const currentScroll = sliderEl.scrollLeft;
                    let closestIdx = 0;
                    let minDiff = Infinity;

                    cards.forEach((c, idx) => {
                        const diff = Math.abs(c.offsetLeft - sliderEl.offsetLeft - currentScroll);
                        if (diff < minDiff) {
                            minDiff = diff;
                            closestIdx = idx;
                        }
                    });

                    currentIndex = closestIdx;
                    dots.forEach((d, idx) => d.classList.toggle("active", idx === closestIdx));
                }, { passive: true });
            }

            function startAutoplay() {
                if (!autoplay || count <= 1) return;
                clearInterval(autoplayTimer);
                autoplayTimer = setInterval(() => {
                    if (isPaused()) return;
                    if (!loop && currentIndex >= count - 1) return;
                    applyActiveState(currentIndex + 1, true);
                }, autoplayInterval);
            }

            function restartAutoplay() {
                startAutoplay();
            }

            startAutoplay();
        }

        function renderJsonToDom(d) {
            const sectionEl = document.getElementById("ios-game-section-main");
            document.getElementById("sec-title").textContent = d.sectionTitle || "";
            document.getElementById("sec-subtitle").textContent = d.sectionSubtitle || "";

            const sliderEl = document.getElementById("ios-card-slider");
            const dotsEl = document.getElementById("ios-slider-dots");
            const cardsData = Array.isArray(d.cards) ? d.cards : (d.card ? [d.card] : []);
            const config = d.sliderConfig || {};
            currentSliderConfig = config;

            loadAllItemsPool(cardsData);

            sliderEl.innerHTML = "";
            sliderEl.classList.toggle("has-multiple", cardsData.length > 1);

            cardsData.forEach((item, idx) => {
                sliderEl.appendChild(buildCardElement(item, idx));
            });

            setupSliderController(sectionEl, sliderEl, dotsEl, cardsData, config);
        }

        async function initAppiosSlider() {
            for (const url of CANDIDATE_URLS) {
                try {
                    const res = await fetch(url, { cache: "no-store" });
                    if (!res.ok) continue;
                    const json = await res.json();
                    renderJsonToDom(json);
                    return;
                } catch (_) {}
            }

            document.getElementById("sec-title").textContent = "Không tải được Appios.json";
            document.getElementById("sec-subtitle").textContent = "Hãy kiểm tra file Appios.json và chạy qua web server.";
        }

        initAppiosSlider();
    })();
</script>
