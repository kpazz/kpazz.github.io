<section id="sec-cube-root" class="kp-sec-cube-wrap" style="padding:18px 16px;">
  <style>
    .kp-sec-cube-head {
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
      margin-bottom: 14px;
      cursor: pointer;
    }
    .kp-sec-cube-track {
      display: flex;
      gap: 16px;
      overflow-x: auto;
      scroll-behavior: smooth;
      padding: 10px 8px 14px;
      perspective: 1100px;
    }
    .kp-sec-cube-track::-webkit-scrollbar { height: 5px; }
    .kp-sec-cube-track::-webkit-scrollbar-thumb { background: rgba(148,163,184,0.35); border-radius: 99px; }

    /* Base Card */
    .cube-dyn-card {
      min-width: 270px;
      max-width: 270px;
      border-radius: 24px;
      padding: 16px;
      cursor: pointer;
      position: relative;
      overflow: hidden;
      transform-style: preserve-3d;
      transition: transform 0.5s cubic-bezier(0.22, 1, 0.36, 1), opacity 0.45s ease;
    }
    .cube-dyn-card:hover { transform: translateY(-4px); }

    .cube-card-top {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 10px;
      position: relative;
      z-index: 2;
    }
    .cube-icon-spin {
      width: 50px;
      height: 50px;
      border-radius: 14px;
      object-fit: cover;
      flex-shrink: 0;
      transition: transform 0.75s cubic-bezier(0.22, 1, 0.36, 1);
    }
    .cube-card-meta {
      position: relative;
      z-index: 2;
      font-size: 0.73rem;
      color: var(--text-secondary);
      display: flex;
      justify-content: space-between;
      gap: 8px;
      flex-wrap: wrap;
    }
    .cube-dl-btn {
      margin-top: 12px;
      width: 100%;
      padding: 7px 12px;
      border-radius: 12px;
      border: none;
      background: linear-gradient(135deg, #8b5cf6, #6366f1);
      color: #fff;
      font-size: 0.77rem;
      font-weight: 700;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      position: relative;
      z-index: 2;
    }

    /* ==================== CÁC KIỂU CARD (stylesection / stylecard) ==================== */
    .cube-dyn-card.cube-card-cube-prism-card {
      min-width: 270px;
      max-width: 270px;
    }

    .cube-dyn-card.cube-card-appstore-card,
    .cube-dyn-card.cube-card-container-query-product {
      min-width: 290px;
      max-width: 290px;
      border-left: 4px solid #8b5cf6;
    }

    .cube-dyn-card.cube-card-glassmorphism-profile-info {
      min-width: 255px;
      max-width: 255px;
      text-align: center;
    }
    .cube-dyn-card.cube-card-glassmorphism-profile-info .cube-card-top {
      flex-direction: column;
      justify-content: center;
    }
    .cube-dyn-card.cube-card-glassmorphism-profile-info .cube-icon-spin {
      width: 58px;
      height: 58px;
      border-radius: 50%;
      border: 2px solid #8b5cf6;
    }
    .cube-dyn-card.cube-card-glassmorphism-profile-info .cube-card-meta {
      justify-content: center;
    }

    .cube-dyn-card.cube-card-movie-pulp-fiction,
    .cube-dyn-card.cube-card-magazine-overlay-card {
      min-width: 250px;
      max-width: 250px;
      height: 285px;
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
      color: #fff;
    }

    .cube-dyn-card.cube-card-minimal-bento-tile {
      min-width: 225px;
      max-width: 225px;
      border-radius: 26px;
    }

    .cube-dyn-card.cube-card-split-banner-card,
    .cube-dyn-card.cube-card-parallax-horizon-card,
    .cube-dyn-card.cube-card-spotlight-hero-card,
    .cube-dyn-card.cube-card-coverflow-shelf-card {
      min-width: 340px;
      max-width: 340px;
      border-bottom: 3px solid #8b5cf6;
    }

    /* ==================== 10 KIỂU SLIDE (slideType / styleslide) ==================== */
    .cube-dyn-card.cube-slide-cube-rotate.cube-step .cube-icon-spin { transform: rotateY(360deg); }
    .cube-dyn-card.cube-slide-horizontal-scroll.is-active { transform: translateY(-3px); }
    .cube-dyn-card.cube-slide-coverflow-3d { transform: rotateY(-8deg) scale(0.96); opacity: 0.88; }
    .cube-dyn-card.cube-slide-coverflow-3d.is-active { transform: rotateY(0deg) scale(1.03); opacity: 1; }
    .cube-dyn-card.cube-slide-fade-cross.is-dim { opacity: 0.55; }
    .cube-dyn-card.cube-slide-cards-stack.is-active { transform: translateY(-5px) scale(1.02); }
    .cube-dyn-card.cube-slide-flip-card.is-active { transform: rotateY(8deg); }
    .cube-dyn-card.cube-slide-parallax-banner.is-active .cube-icon-spin { transform: translateX(4px) scale(1.06); }
    .cube-dyn-card.cube-slide-center-zoom.is-active { transform: scale(1.05); }
    .cube-dyn-card.cube-slide-vertical-ticker.is-tick-up { transform: translateY(-4px); }
    .cube-dyn-card.cube-slide-vertical-ticker.is-tick-down { transform: translateY(2px); }
  </style>

  <div class="kp-sec-cube-head" id="cube-header-trigger">
    <div>
      <h2 id="cube-sec-title" style="font-size:1.25rem;"></h2>
      <p id="cube-sec-desc" style="font-size:0.84rem;color:var(--text-secondary);"></p>
    </div>
    <span style="font-size:0.8rem;color:var(--accent);font-weight:600;">Xem tất cả <i class="fa-solid fa-chevron-right"></i></span>
  </div>

  <div class="kp-sec-cube-track" id="cube-cards-track"></div>

  <script>
    (async function renderCubeRotateSection() {
      const res = await fetch("Tabs/sec_CubeRotateCards.json?t=" + Date.now());
      const secData = await res.json();

      document.getElementById("cube-sec-title").textContent = secData.sectionTitle || "";
      document.getElementById("cube-sec-desc").textContent = secData.sectionDescription || "";
      document.getElementById("cube-header-trigger").onclick = () => KPazzApp.openSectionAllModal(secData);

      const validCards = [
        "cube-prism-card",
        "appstore-card",
        "container-query-product",
        "glassmorphism-profile-info",
        "movie-pulp-fiction",
        "magazine-overlay-card",
        "minimal-bento-tile",
        "split-banner-card",
        "parallax-horizon-card",
        "spotlight-hero-card",
        "coverflow-shelf-card"
      ];
      const rawCard = (secData.stylesection || secData.stylecard || "cube-prism-card").trim();
      const cardStyle = validCards.includes(rawCard) ? rawCard : "cube-prism-card";

      const validSlides = [
        "cube-rotate",
        "horizontal-scroll",
        "coverflow-3d",
        "fade-cross",
        "cards-stack",
        "flip-card",
        "parallax-banner",
        "center-zoom",
        "vertical-ticker",
        "smooth-marquee"
      ];
      const rawSlide = (secData.slideType || secData.styleslide || "cube-rotate").trim();
      const slideType = validSlides.includes(rawSlide) ? rawSlide : "cube-rotate";

      const items = (secData.items || []).slice(0, 20);
      const track = document.getElementById("cube-cards-track");
      const isPosterStyle = cardStyle === "movie-pulp-fiction" || cardStyle === "magazine-overlay-card";

      track.innerHTML = items.map((item) => {
        const posterBg = isPosterStyle && (item.banner || item.icon)
          ? `style="background:linear-gradient(to top, rgba(2, 6, 23, 0.9), rgba(76, 29, 149, 0.35)), url('${item.banner || item.icon}') center/cover no-repeat;"`
          : "";

        return `
          <article class="cube-dyn-card liquid-glass cube-card-${cardStyle} cube-slide-${slideType}" ${posterBg}
                   onclick='KPazzApp.openItemDetail(${JSON.stringify(item).replace(/'/g, "&apos;")})'>
            <div class="cube-card-top">
              <img class="cube-icon-spin" src="${item.icon}" alt="${item.title}" />
              <div style="overflow:hidden;width:100%;">
                <h3 style="font-size:0.94rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;">${item.title}</h3>
                <span style="font-size:0.72rem;color:${isPosterStyle ? "#c4b5fd" : "#8b5cf6"};font-weight:700;">
                  <i class="fa-solid fa-tag"></i> ${item.category} • v${item.version}
                </span>
              </div>
            </div>
            <div class="cube-card-meta" style="${isPosterStyle ? "color:rgba(255,255,255,0.84);" : ""}">
              <span><i class="fa-solid fa-user-pen"></i> ${item.author}</span>
              <span><i class="fa-regular fa-calendar"></i> ${item.publishDate}</span>
            </div>
            ${item.isApp ? `
              <button class="cube-dl-btn" onclick='event.stopPropagation();KPazzApp.openDownloadLinks(${JSON.stringify(item).replace(/'/g, "&apos;")})'>
                <i class="fa-solid fa-download"></i> Tải xuống
              </button>` : ""}
          </article>
        `;
      }).join("");

      const cards = Array.from(track.querySelectorAll(".cube-dyn-card"));
      if (cards[0] && (slideType === "coverflow-3d" || slideType === "center-zoom")) {
        cards[0].classList.add("is-active");
      }

      if (secData.autoplay && cards.length > 0) {
        const speed = secData.slideSpeed || (slideType === "smooth-marquee" ? 1800 : 4200);
        let idx = 0;
        let dir = false;

        setInterval(() => {
          idx = (idx + 1) % cards.length;
          dir = !dir;

          cards.forEach((el, i) => {
            el.classList.remove("is-active", "is-dim", "is-tick-up", "is-tick-down");
            if (slideType === "cube-rotate") {
              el.classList.toggle("cube-step");
            } else if (slideType === "vertical-ticker") {
              const up = i % 2 === 0 ? dir : !dir;
              el.classList.add(up ? "is-tick-up" : "is-tick-down");
            } else if (slideType === "fade-cross") {
              if (i !== idx) el.classList.add("is-dim");
            } else if (i === idx) {
              el.classList.add("is-active");
            }
          });

          const step = (cards[0].offsetWidth || 270) + 16;
          if (track.scrollLeft + track.clientWidth >= track.scrollWidth - 10) {
            if (secData.loop !== false) {
              track.scrollTo({ left: 0, behavior: "smooth" });
            }
          } else {
            track.scrollBy({ left: slideType === "smooth-marquee" ? step * 0.65 : step, behavior: "smooth" });
          }
        }, speed);
      }
    })();
  </script>
</section>
