<section id="sec-appios-root" class="kp-sec-appios-wrap" style="padding:18px 16px;">
  <style>
    .kp-sec-appios-head {
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
      margin-bottom: 14px;
      cursor: pointer;
    }
    .kp-sec-appios-track {
      display: flex;
      gap: 14px;
      overflow-x: auto;
      scroll-behavior: smooth;
      padding: 10px 8px 14px;
      perspective: 1100px;
    }
    .kp-sec-appios-track::-webkit-scrollbar { height: 5px; }
    .kp-sec-appios-track::-webkit-scrollbar-thumb { background: rgba(148,163,184,0.35); border-radius: 99px; }

    /* Base Card */
    .appios-dyn-card {
      min-width: 285px;
      max-width: 285px;
      border-radius: 22px;
      padding: 14px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      position: relative;
      overflow: hidden;
      transform-style: preserve-3d;
      transition: transform 0.5s cubic-bezier(0.22, 1, 0.36, 1), opacity 0.45s ease;
      cursor: pointer;
    }
    .appios-dyn-card:hover { transform: translateY(-4px); }

    .appios-card-banner {
      width: 100%;
      height: 125px;
      border-radius: 14px;
      object-fit: cover;
      margin-bottom: 12px;
      position: relative;
      z-index: 2;
      transition: transform 0.65s cubic-bezier(0.22, 1, 0.36, 1);
    }
    .appios-card-row {
      display: flex;
      align-items: center;
      gap: 10px;
      position: relative;
      z-index: 2;
    }
    .appios-card-icon {
      width: 48px;
      height: 48px;
      border-radius: 12px;
      object-fit: cover;
      flex-shrink: 0;
      transition: transform 0.65s cubic-bezier(0.22, 1, 0.36, 1);
    }
    .appios-btn-get {
      padding: 6px 14px;
      border-radius: 999px;
      border: none;
      background: var(--accent);
      color: #fff;
      font-weight: 700;
      font-size: 0.78rem;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 5px;
      flex-shrink: 0;
    }

    /* ==================== CÁC KIỂU CARD (stylesection / stylecard) ==================== */
    .appios-dyn-card.appios-card-appstore-card {
      min-width: 285px;
      max-width: 285px;
    }

    .appios-dyn-card.appios-card-appstore-featured {
      min-width: 315px;
      max-width: 315px;
      border-left: 4px solid var(--accent);
    }
    .appios-dyn-card.appios-card-appstore-featured .appios-card-banner {
      height: 148px;
    }

    .appios-dyn-card.appios-card-container-query-product {
      min-width: 340px;
      max-width: 340px;
    }

    .appios-dyn-card.appios-card-glassmorphism-profile-info {
      min-width: 260px;
      max-width: 260px;
      text-align: center;
    }
    .appios-dyn-card.appios-card-glassmorphism-profile-info .appios-card-row {
      flex-direction: column;
      justify-content: center;
    }
    .appios-dyn-card.appios-card-glassmorphism-profile-info .appios-card-icon {
      width: 56px;
      height: 56px;
      border-radius: 50%;
      border: 2px solid var(--accent);
    }

    .appios-dyn-card.appios-card-movie-pulp-fiction {
      min-width: 255px;
      max-width: 255px;
      height: 300px;
      justify-content: flex-end;
      color: #fff;
    }
    .appios-dyn-card.appios-card-movie-pulp-fiction .appios-card-banner {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      margin: 0;
      border-radius: 22px;
      z-index: 0;
    }
    .appios-dyn-card.appios-card-movie-pulp-fiction::after {
      content: "";
      position: absolute;
      inset: 0;
      background: linear-gradient(to top, rgba(2, 6, 23, 0.92), rgba(15, 23, 42, 0.35));
      z-index: 1;
      pointer-events: none;
    }

    .appios-dyn-card.appios-card-neon-cyber-card {
      border: 1px solid rgba(56, 189, 248, 0.55);
      box-shadow: 0 10px 26px rgba(14, 165, 233, 0.16);
    }

    .appios-dyn-card.appios-card-minimal-bento-tile {
      min-width: 235px;
      max-width: 235px;
      border-radius: 26px;
    }

    .appios-dyn-card.appios-card-split-banner-card {
      min-width: 345px;
      max-width: 345px;
      border-bottom: 3px solid var(--accent);
    }

    .appios-dyn-card.appios-card-compact-pill-row {
      min-width: 310px;
      max-width: 310px;
      border-radius: 999px;
      padding: 8px 14px 8px 8px;
    }
    .appios-dyn-card.appios-card-compact-pill-row .appios-card-banner {
      display: none;
    }
    .appios-dyn-card.appios-card-compact-pill-row .appios-card-icon {
      border-radius: 50%;
    }

    .appios-dyn-card.appios-card-floating-3d-badge {
      min-width: 255px;
      max-width: 255px;
      border-radius: 26px;
      padding-top: 18px;
      border-top: 3px solid var(--accent);
    }

    /* ==================== 10 KIỂU SLIDE (slideType / styleslide) ==================== */
    .appios-dyn-card.appios-slide-horizontal-scroll.is-active { transform: translateY(-3px); }
    .appios-dyn-card.appios-slide-coverflow-3d { transform: rotateY(-8deg) scale(0.96); opacity: 0.88; }
    .appios-dyn-card.appios-slide-coverflow-3d.is-active { transform: rotateY(0deg) scale(1.03); opacity: 1; }
    .appios-dyn-card.appios-slide-fade-cross.is-dim { opacity: 0.55; }
    .appios-dyn-card.appios-slide-cards-stack.is-active { transform: translateY(-5px) scale(1.02); }
    .appios-dyn-card.appios-slide-cube-rotate.is-active .appios-card-icon { transform: rotateY(360deg); }
    .appios-dyn-card.appios-slide-flip-card.is-active { transform: rotateY(8deg); }
    .appios-dyn-card.appios-slide-parallax-banner.is-active .appios-card-banner { transform: scale(1.07) translateX(5px); }
    .appios-dyn-card.appios-slide-center-zoom.is-active { transform: scale(1.05); }
    .appios-dyn-card.appios-slide-vertical-ticker.is-tick-up { transform: translateY(-4px); }
    .appios-dyn-card.appios-slide-vertical-ticker.is-tick-down { transform: translateY(2px); }
  </style>

  <div class="kp-sec-appios-head" id="appios-header-trigger">
    <div>
      <h2 id="appios-sec-title" style="font-size:1.25rem;"></h2>
      <p id="appios-sec-desc" style="font-size:0.84rem;color:var(--text-secondary);"></p>
    </div>
    <span style="font-size:0.8rem;color:var(--accent);font-weight:600;">Xem tất cả <i class="fa-solid fa-chevron-right"></i></span>
  </div>

  <div class="kp-sec-appios-track" id="appios-cards-track"></div>

  <script>
    (async function renderAppIosSection() {
      const res = await fetch("Tabs/sec_APPios.json?t=" + Date.now());
      const secData = await res.json();

      document.getElementById("appios-sec-title").textContent = secData.sectionTitle || "";
      document.getElementById("appios-sec-desc").textContent = secData.sectionDescription || "";
      document.getElementById("appios-header-trigger").onclick = () => KPazzApp.openSectionAllModal(secData);

      const validCards = [
        "appstore-card",
        "appstore-featured",
        "container-query-product",
        "glassmorphism-profile-info",
        "movie-pulp-fiction",
        "neon-cyber-card",
        "minimal-bento-tile",
        "split-banner-card",
        "compact-pill-row",
        "floating-3d-badge"
      ];
      const rawCard = (secData.stylesection || secData.stylecard || "appstore-card").trim();
      const cardStyle = validCards.includes(rawCard) ? rawCard : "appstore-card";

      const validSlides = [
        "horizontal-scroll",
        "coverflow-3d",
        "fade-cross",
        "cards-stack",
        "cube-rotate",
        "flip-card",
        "parallax-banner",
        "center-zoom",
        "vertical-ticker",
        "smooth-marquee"
      ];
      const rawSlide = (secData.slideType || secData.styleslide || "horizontal-scroll").trim();
      const slideType = validSlides.includes(rawSlide) ? rawSlide : "horizontal-scroll";

      const items = (secData.items || []).slice(0, 20);
      const track = document.getElementById("appios-cards-track");
      const isMovieStyle = cardStyle === "movie-pulp-fiction";

      track.innerHTML = items.map((item) => `
        <article class="appios-dyn-card liquid-glass appios-card-${cardStyle} appios-slide-${slideType}"
                 onclick='KPazzApp.openItemDetail(${JSON.stringify(item).replace(/'/g, "&apos;")})'>
          <img class="appios-card-banner" src="${item.banner || item.icon}" alt="${item.title}" />
          <div class="appios-card-row">
            <img class="appios-card-icon" src="${item.icon}" alt="${item.title}" />
            <div style="flex:1;overflow:hidden;">
              <strong style="display:block;font-size:0.92rem;color:${isMovieStyle ? "#fff" : "inherit"};white-space:nowrap;overflow:hidden;text-overflow:ellipsis;">${item.title}</strong>
              <span style="font-size:0.75rem;color:${isMovieStyle ? "rgba(255,255,255,0.85)" : "var(--text-secondary)"};display:block;">
                <i class="fa-solid fa-user-pen"></i> ${item.author} • <i class="fa-solid fa-code-branch"></i> v${item.version}
              </span>
            </div>
            ${item.isApp ? `
              <button class="appios-btn-get" onclick='event.stopPropagation();KPazzApp.openDownloadLinks(${JSON.stringify(item).replace(/'/g, "&apos;")})'>
                <i class="fa-solid fa-download"></i> Tải
              </button>` : ""}
          </div>
        </article>
      `).join("");

      const cards = Array.from(track.querySelectorAll(".appios-dyn-card"));
      if (cards[0] && (slideType === "coverflow-3d" || slideType === "center-zoom" || slideType === "parallax-banner")) {
        cards[0].classList.add("is-active");
      }

      if (secData.autoplay && cards.length > 0) {
        const speed = secData.slideSpeed || (slideType === "smooth-marquee" ? 1800 : 3500);
        let idx = 0;
        let dir = false;

        setInterval(() => {
          idx = (idx + 1) % cards.length;
          dir = !dir;

          cards.forEach((el, i) => {
            el.classList.remove("is-active", "is-dim", "is-tick-up", "is-tick-down");
            if (slideType === "vertical-ticker") {
              const up = i % 2 === 0 ? dir : !dir;
              el.classList.add(up ? "is-tick-up" : "is-tick-down");
            } else if (slideType === "fade-cross") {
              if (i !== idx) el.classList.add("is-dim");
            } else if (i === idx) {
              el.classList.add("is-active");
            }
          });

          const step = (cards[0].offsetWidth || 285) + 14;
          if (track.scrollLeft + track.clientWidth >= track.scrollWidth - 10) {
            if (secData.loop !== false) {
              track.scrollTo({ left: 0, behavior: "smooth" });
            }
          } else {
            track.scrollBy({ left: slideType === "smooth-marquee" ? step * 0.65 : step, behavior: "smooth" });
          }
        }, speed);
      }
    })();
  </script>
</section>
