<section id="sec-badge-root" class="kp-sec-badge-wrap" style="padding:18px 16px;">
  <style>
    .kp-sec-badge-head {
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
      margin-bottom: 14px;
      cursor: pointer;
    }
    .kp-sec-badge-track {
      display: flex;
      gap: 16px;
      overflow-x: auto;
      scroll-behavior: smooth;
      padding: 10px 8px 14px;
      perspective: 1100px;
    }
    .kp-sec-badge-track::-webkit-scrollbar { height: 5px; }
    .kp-sec-badge-track::-webkit-scrollbar-thumb { background: rgba(148,163,184,0.35); border-radius: 99px; }

    /* Base Card */
    .badge-dyn-card {
      min-width: 245px;
      max-width: 245px;
      border-radius: 26px;
      padding: 18px 16px 16px;
      position: relative;
      overflow: hidden;
      cursor: pointer;
      transform-style: preserve-3d;
      transition: transform 0.5s cubic-bezier(0.22, 1, 0.36, 1), opacity 0.45s ease;
    }
    .badge-dyn-card:hover { transform: translateY(-6px) rotateX(2deg); }

    .badge-float-icon {
      width: 60px;
      height: 60px;
      border-radius: 18px;
      object-fit: cover;
      box-shadow: 0 10px 20px rgba(0,0,0,0.22);
      margin-bottom: 12px;
      flex-shrink: 0;
      transition: transform 0.65s cubic-bezier(0.22, 1, 0.36, 1);
    }
    .badge-corner-tag {
      position: absolute;
      top: 14px;
      right: 14px;
      z-index: 2;
      font-size: 0.68rem;
      font-weight: 800;
      padding: 4px 9px;
      border-radius: 999px;
      background: rgba(249, 115, 22, 0.18);
      color: #f97316;
    }
    .badge-card-content {
      position: relative;
      z-index: 2;
    }
    .badge-dl-btn {
      margin-top: 12px;
      width: 100%;
      padding: 7px 12px;
      border-radius: 12px;
      border: none;
      background: linear-gradient(135deg, #f97316, #ea580c);
      color: #fff;
      font-size: 0.77rem;
      font-weight: 700;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 5px;
      position: relative;
      z-index: 2;
    }

    /* ==================== CÁC KIỂU CARD (stylesection / stylecard) ==================== */
    .badge-dyn-card.badge-card-floating-3d-badge {
      min-width: 245px;
      max-width: 245px;
    }

    .badge-dyn-card.badge-card-appstore-card,
    .badge-dyn-card.badge-card-container-query-product {
      min-width: 295px;
      max-width: 295px;
      border-left: 4px solid #f97316;
    }
    .badge-dyn-card.badge-card-appstore-card .badge-card-content,
    .badge-dyn-card.badge-card-container-query-product .badge-card-content {
      display: grid;
      grid-template-columns: 60px 1fr;
      gap: 12px;
      align-items: center;
    }
    .badge-dyn-card.badge-card-appstore-card .badge-float-icon,
    .badge-dyn-card.badge-card-container-query-product .badge-float-icon {
      margin-bottom: 0;
    }

    .badge-dyn-card.badge-card-glassmorphism-profile-info {
      min-width: 255px;
      max-width: 255px;
      text-align: center;
    }
    .badge-dyn-card.badge-card-glassmorphism-profile-info .badge-float-icon {
      border-radius: 50%;
      border: 2px solid #f97316;
      margin-left: auto;
      margin-right: auto;
    }
    .badge-dyn-card.badge-card-glassmorphism-profile-info .badge-card-content > div:last-child {
      justify-items: center;
    }

    .badge-dyn-card.badge-card-movie-pulp-fiction,
    .badge-dyn-card.badge-card-magazine-overlay-card {
      min-width: 250px;
      max-width: 250px;
      height: 290px;
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
      color: #fff;
    }
    .badge-dyn-card.badge-card-movie-pulp-fiction .badge-corner-tag,
    .badge-dyn-card.badge-card-magazine-overlay-card .badge-corner-tag {
      background: rgba(15, 23, 42, 0.75);
      color: #fdba74;
    }

    .badge-dyn-card.badge-card-minimal-bento-tile {
      min-width: 225px;
      max-width: 225px;
      padding: 15px 14px;
    }
    .badge-dyn-card.badge-card-minimal-bento-tile .badge-float-icon {
      width: 50px;
      height: 50px;
      border-radius: 15px;
      margin-bottom: 10px;
    }

    .badge-dyn-card.badge-card-split-banner-card,
    .badge-dyn-card.badge-card-parallax-horizon-card,
    .badge-dyn-card.badge-card-spotlight-hero-card,
    .badge-dyn-card.badge-card-coverflow-shelf-card {
      min-width: 340px;
      max-width: 340px;
      border-bottom: 3px solid #f97316;
    }

    /* ==================== 10 KIỂU SLIDE (slideType / styleslide) ==================== */
    .badge-dyn-card.badge-slide-cards-stack.is-active { transform: translateY(-7px) scale(1.03); }
    .badge-dyn-card.badge-slide-horizontal-scroll.is-active { transform: translateY(-3px); }
    .badge-dyn-card.badge-slide-coverflow-3d { transform: rotateY(-8deg) scale(0.96); opacity: 0.88; }
    .badge-dyn-card.badge-slide-coverflow-3d.is-active { transform: rotateY(0deg) scale(1.03); opacity: 1; }
    .badge-dyn-card.badge-slide-fade-cross.is-dim { opacity: 0.55; }
    .badge-dyn-card.badge-slide-cube-rotate.is-active .badge-float-icon { transform: rotateY(360deg); }
    .badge-dyn-card.badge-slide-flip-card.is-active { transform: rotateY(8deg); }
    .badge-dyn-card.badge-slide-parallax-banner.is-active .badge-float-icon { transform: translateX(4px) scale(1.06); }
    .badge-dyn-card.badge-slide-center-zoom.is-active { transform: scale(1.05); }
    .badge-dyn-card.badge-slide-vertical-ticker.is-tick-up { transform: translateY(-4px); }
    .badge-dyn-card.badge-slide-vertical-ticker.is-tick-down { transform: translateY(2px); }
  </style>

  <div class="kp-sec-badge-head" id="badge-header-trigger">
    <div>
      <h2 id="badge-sec-title" style="font-size:1.25rem;"></h2>
      <p id="badge-sec-desc" style="font-size:0.84rem;color:var(--text-secondary);"></p>
    </div>
    <span style="font-size:0.8rem;color:var(--accent);font-weight:600;">Xem tất cả <i class="fa-solid fa-chevron-right"></i></span>
  </div>

  <div class="kp-sec-badge-track" id="badge-cards-track"></div>

  <script>
    (async function renderFloatingBadgeSection() {
      const res = await fetch("Tabs/sec_FloatingBadgeCards.json?t=" + Date.now());
      const secData = await res.json();

      document.getElementById("badge-sec-title").textContent = secData.sectionTitle || "";
      document.getElementById("badge-sec-desc").textContent = secData.sectionDescription || "";
      document.getElementById("badge-header-trigger").onclick = () => KPazzApp.openSectionAllModal(secData);

      const validCards = [
        "floating-3d-badge",
        "appstore-card",
        "container-query-product",
        "glassmorphism-profile-info",
        "movie-pulp-fiction",
        "magazine-overlay-card",
        "minimal-bento-tile",
        "split-banner-card",
        "parallax-horizon-card",
        "spotlight-hero-card",
        "coverflow-shelf-card"
      ];
      const rawCard = (secData.stylesection || secData.stylecard || "floating-3d-badge").trim();
      const cardStyle = validCards.includes(rawCard) ? rawCard : "floating-3d-badge";

      const validSlides = [
        "cards-stack",
        "horizontal-scroll",
        "coverflow-3d",
        "fade-cross",
        "cube-rotate",
        "flip-card",
        "parallax-banner",
        "center-zoom",
        "vertical-ticker",
        "smooth-marquee"
      ];
      const rawSlide = (secData.slideType || secData.styleslide || "cards-stack").trim();
      const slideType = validSlides.includes(rawSlide) ? rawSlide : "cards-stack";

      const items = (secData.items || []).slice(0, 20);
      const track = document.getElementById("badge-cards-track");
      const isPosterStyle = cardStyle === "movie-pulp-fiction" || cardStyle === "magazine-overlay-card";
      const isSplitHeader = cardStyle === "appstore-card" || cardStyle === "container-query-product";

      track.innerHTML = items.map((item) => {
        const posterBg = isPosterStyle && (item.banner || item.icon)
          ? `style="background:linear-gradient(to top, rgba(2, 6, 23, 0.92), rgba(67, 20, 7, 0.35)), url('${item.banner || item.icon}') center/cover no-repeat;"`
          : "";

        const metaBlock = `
          <div style="font-size:0.74rem;color:${isPosterStyle ? "rgba(255,255,255,0.85)" : "var(--text-secondary)"};display:grid;gap:3px;">
            <span><i class="fa-solid fa-user-pen"></i> ${item.author}</span>
            <span><i class="fa-solid fa-code-branch"></i> v${item.version} • <i class="fa-regular fa-calendar"></i> ${item.publishDate}</span>
            <span><i class="fa-solid fa-tag"></i> ${item.category}</span>
          </div>
        `;

        const innerBody = isSplitHeader
          ? `
            <img class="badge-float-icon" src="${item.icon}" alt="${item.title}" />
            <div style="overflow:hidden;">
              <h3 style="font-size:0.95rem;margin-bottom:5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;">${item.title}</h3>
              ${metaBlock}
            </div>
          `
          : `
            <img class="badge-float-icon" src="${item.icon}" alt="${item.title}" />
            <h3 style="font-size:0.95rem;margin-bottom:5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;">${item.title}</h3>
            ${metaBlock}
          `;

        return `
          <article class="badge-dyn-card liquid-glass badge-card-${cardStyle} badge-slide-${slideType}" ${posterBg}
                   onclick='KPazzApp.openItemDetail(${JSON.stringify(item).replace(/'/g, "&apos;")})'>
            <span class="badge-corner-tag">${item.fileFormat || item.category}</span>
            <div class="badge-card-content">
              ${innerBody}
            </div>
            ${item.isApp ? `
              <button class="badge-dl-btn" onclick='event.stopPropagation();KPazzApp.openDownloadLinks(${JSON.stringify(item).replace(/'/g, "&apos;")})'>
                <i class="fa-solid fa-download"></i> Tải xuống
              </button>` : ""}
          </article>
        `;
      }).join("");

      const cards = Array.from(track.querySelectorAll(".badge-dyn-card"));
      if (cards[0] && (slideType === "coverflow-3d" || slideType === "center-zoom" || slideType === "cards-stack")) {
        cards[0].classList.add("is-active");
      }

      if (secData.autoplay && cards.length > 0) {
        const speed = secData.slideSpeed || (slideType === "smooth-marquee" ? 1800 : 4000);
        let idx = 0;
        let dir = false;

        setInterval(() => {
          idx = (idx + 1) % cards.length;
          dir = !dir;

          cards.forEach((el, i) => {
            el.classList.remove("is-active", "is-dim", "is-tick-up", "is-tick-down");
            if (slideType === "vertical-ticker") {
              const up = i % 2 === 0 ? dir : !dir;
              el.classList.add(up ? "is-tick-up" : "is-tick-down");
            } else if (slideType === "fade-cross") {
              if (i !== idx) el.classList.add("is-dim");
            } else if (i === idx) {
              el.classList.add("is-active");
            }
          });

          const step = (cards[0].offsetWidth || 245) + 16;
          if (track.scrollLeft + track.clientWidth >= track.scrollWidth - 10) {
            if (secData.loop !== false) {
              track.scrollTo({ left: 0, behavior: "smooth" });
            }
          } else {
            track.scrollBy({ left: slideType === "smooth-marquee" ? step * 0.65 : step, behavior: "smooth" });
          }
        }, speed);
      }
    })();
  </script>
</section>
