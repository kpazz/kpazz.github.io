<section id="sec-split-root" class="kp-sec-split-wrap" style="padding:18px 16px;">
  <style>
    .kp-sec-split-head {
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
      margin-bottom: 14px;
      cursor: pointer;
    }
    .kp-sec-split-track {
      display: flex;
      gap: 16px;
      overflow-x: auto;
      scroll-behavior: smooth;
      padding: 10px 8px 14px;
      perspective: 1100px;
    }
    .kp-sec-split-track::-webkit-scrollbar { height: 5px; }
    .kp-sec-split-track::-webkit-scrollbar-thumb { background: rgba(148,163,184,0.35); border-radius: 99px; }

    /* Base Card */
    .split-dyn-card {
      min-width: 360px;
      max-width: 360px;
      border-radius: 22px;
      padding: 12px;
      display: grid;
      grid-template-columns: 120px 1fr;
      gap: 12px;
      align-items: center;
      cursor: pointer;
      position: relative;
      overflow: hidden;
      transform-style: preserve-3d;
      transition: transform 0.5s cubic-bezier(0.22, 1, 0.36, 1), opacity 0.45s ease;
    }
    .split-dyn-card:hover { transform: translateY(-4px); }

    .split-banner-img {
      width: 120px;
      height: 128px;
      border-radius: 16px;
      object-fit: cover;
      transition: transform 0.65s cubic-bezier(0.22, 1, 0.36, 1);
    }
    .split-card-body {
      overflow: hidden;
      position: relative;
      z-index: 2;
    }
    .split-dl-btn {
      margin-top: 8px;
      padding: 6px 12px;
      border-radius: 10px;
      border: none;
      background: linear-gradient(135deg, #0ea5e9, #2563eb);
      color: #fff;
      font-size: 0.76rem;
      font-weight: 700;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 5px;
    }

    /* ==================== CÁC KIỂU CARD (stylesection / stylecard) ==================== */
    .split-dyn-card.split-card-split-banner-card {
      min-width: 360px;
      max-width: 360px;
      grid-template-columns: 120px 1fr;
    }

    .split-dyn-card.split-card-appstore-card {
      min-width: 280px;
      max-width: 280px;
      grid-template-columns: 1fr;
      align-items: stretch;
    }
    .split-dyn-card.split-card-appstore-card .split-banner-img {
      width: 100%;
      height: 132px;
    }

    .split-dyn-card.split-card-container-query-product {
      min-width: 330px;
      max-width: 330px;
      grid-template-columns: 96px 1fr;
      border-left: 4px solid var(--accent);
    }
    .split-dyn-card.split-card-container-query-product .split-banner-img {
      width: 96px;
      height: 96px;
    }

    .split-dyn-card.split-card-glassmorphism-profile-info {
      min-width: 265px;
      max-width: 265px;
      grid-template-columns: 1fr;
      text-align: center;
      justify-items: center;
    }
    .split-dyn-card.split-card-glassmorphism-profile-info .split-banner-img {
      width: 68px;
      height: 68px;
      border-radius: 50%;
      border: 2px solid var(--accent);
    }

    .split-dyn-card.split-card-movie-pulp-fiction {
      min-width: 255px;
      max-width: 255px;
      height: 285px;
      grid-template-columns: 1fr;
      align-items: end;
      padding: 0;
      color: #fff;
    }
    .split-dyn-card.split-card-movie-pulp-fiction .split-banner-img {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      border-radius: 22px;
    }
    .split-dyn-card.split-card-movie-pulp-fiction .split-card-body {
      width: 100%;
      padding: 16px;
      background: linear-gradient(to top, rgba(2, 6, 23, 0.9), rgba(2, 6, 23, 0.25));
    }

    /* ==================== 10 KIỂU SLIDE (slideType / styleslide) ==================== */
    .split-dyn-card.split-slide-parallax-banner.is-active .split-banner-img {
      transform: scale(1.08) translateX(6px);
    }
    .split-dyn-card.split-slide-center-zoom.is-active { transform: scale(1.05); }
    .split-dyn-card.split-slide-coverflow-3d { transform: rotateY(-8deg) scale(0.96); opacity: 0.88; }
    .split-dyn-card.split-slide-coverflow-3d.is-active { transform: rotateY(0deg) scale(1.03); opacity: 1; }
    .split-dyn-card.split-slide-fade-cross.is-dim { opacity: 0.55; }
    .split-dyn-card.split-slide-cards-stack.is-active { transform: translateY(-5px) scale(1.02); }
    .split-dyn-card.split-slide-cube-rotate.is-active .split-banner-img { transform: rotateY(360deg); }
    .split-dyn-card.split-slide-flip-card.is-active { transform: rotateY(8deg); }
    .split-dyn-card.split-slide-vertical-ticker.is-tick-up { transform: translateY(-4px); }
    .split-dyn-card.split-slide-vertical-ticker.is-tick-down { transform: translateY(2px); }
  </style>

  <div class="kp-sec-split-head" id="split-header-trigger">
    <div>
      <h2 id="split-sec-title" style="font-size:1.25rem;"></h2>
      <p id="split-sec-desc" style="font-size:0.84rem;color:var(--text-secondary);"></p>
    </div>
    <span style="font-size:0.8rem;color:var(--accent);font-weight:600;">Xem tất cả <i class="fa-solid fa-chevron-right"></i></span>
  </div>

  <div class="kp-sec-split-track" id="split-cards-track"></div>

  <script>
    (async function renderSplitBannerSection() {
      const res = await fetch("Tabs/sec_SplitBannerCards.json?t=" + Date.now());
      const secData = await res.json();

      document.getElementById("split-sec-title").textContent = secData.sectionTitle || "";
      document.getElementById("split-sec-desc").textContent = secData.sectionDescription || "";
      document.getElementById("split-header-trigger").onclick = () => KPazzApp.openSectionAllModal(secData);

      const validCards = [
        "split-banner-card",
        "appstore-card",
        "container-query-product",
        "glassmorphism-profile-info",
        "movie-pulp-fiction"
      ];
      const rawCard = (secData.stylesection || secData.stylecard || "split-banner-card").trim();
      const cardStyle = validCards.includes(rawCard) ? rawCard : "split-banner-card";

      const validSlides = [
        "parallax-banner",
        "horizontal-scroll",
        "coverflow-3d",
        "fade-cross",
        "cards-stack",
        "cube-rotate",
        "flip-card",
        "center-zoom",
        "vertical-ticker",
        "smooth-marquee"
      ];
      const rawSlide = (secData.slideType || secData.styleslide || "parallax-banner").trim();
      const slideType = validSlides.includes(rawSlide) ? rawSlide : "parallax-banner";

      const items = (secData.items || []).slice(0, 20);
      const track = document.getElementById("split-cards-track");
      const isMovie = cardStyle === "movie-pulp-fiction";
      const isProfile = cardStyle === "glassmorphism-profile-info";

      track.innerHTML = items.map((item) => {
        const mediaSrc = isProfile ? (item.icon || item.banner) : (item.banner || item.icon);
        return `
          <article class="split-dyn-card liquid-glass split-card-${cardStyle} split-slide-${slideType}"
                   onclick='KPazzApp.openItemDetail(${JSON.stringify(item).replace(/'/g, "&apos;")})'>
            <img class="split-banner-img" src="${mediaSrc}" alt="${item.title}" />
            <div class="split-card-body">
              <span style="font-size:0.72rem;color:${isMovie ? "#38bdf8" : "var(--accent)"};font-weight:700;">
                <i class="fa-solid fa-tag"></i> ${item.category}
              </span>
              <h3 style="font-size:0.94rem;margin:2px 0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;">${item.title}</h3>
              <p style="font-size:0.75rem;color:${isMovie ? "rgba(255,255,255,0.82)" : "var(--text-secondary)"};white-space:nowrap;overflow:hidden;text-overflow:ellipsis;">
                <i class="fa-solid fa-user-pen"></i> ${item.author} • v${item.version}
              </p>
              <div style="font-size:0.72rem;color:${isMovie ? "rgba(255,255,255,0.82)" : "var(--text-secondary)"};margin-top:2px;">
                <i class="fa-regular fa-calendar"></i> ${item.publishDate}
              </div>
              ${item.isApp ? `
                <button class="split-dl-btn" onclick='event.stopPropagation();KPazzApp.openDownloadLinks(${JSON.stringify(item).replace(/'/g, "&apos;")})'>
                  <i class="fa-solid fa-download"></i> Tải (${item.filesize || "IPA"})
                </button>` : ""}
            </div>
          </article>
        `;
      }).join("");

      const cards = Array.from(track.querySelectorAll(".split-dyn-card"));
      if (cards[0] && (slideType === "coverflow-3d" || slideType === "center-zoom" || slideType === "parallax-banner")) {
        cards[0].classList.add("is-active");
      }

      if (secData.autoplay && cards.length > 0) {
        const speed = secData.slideSpeed || (slideType === "smooth-marquee" ? 1800 : 4400);
        let idx = 0;
        let dir = false;

        setInterval(() => {
          idx = (idx + 1) % cards.length;
          dir = !dir;

          cards.forEach((el, i) => {
            el.classList.remove("is-active", "is-dim", "is-tick-up", "is-tick-down");
            if (slideType === "vertical-ticker") {
              const up = i % 2 === 0 ? dir : !dir;
              el.classList.add(up ? "is-tick-up" : "is-tick-down");
            } else if (slideType === "fade-cross") {
              if (i !== idx) el.classList.add("is-dim");
            } else if (i === idx) {
              el.classList.add("is-active");
            }
          });

          const step = (cards[0].offsetWidth || 360) + 16;
          if (track.scrollLeft + track.clientWidth >= track.scrollWidth - 10) {
            if (secData.loop !== false) {
              track.scrollTo({ left: 0, behavior: "smooth" });
            }
          } else {
            track.scrollBy({ left: slideType === "smooth-marquee" ? step * 0.65 : step, behavior: "smooth" });
          }
        }, speed);
      }
    })();
  </script>
</section>
