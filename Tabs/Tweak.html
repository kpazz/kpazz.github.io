                    if (targetCard) {
                        const targetLeft = targetCard.offsetLeft - sliderEl.offsetLeft;
                        if (!useAnimation || slideSpeed <= 0) {
                            sliderEl.scrollLeft = targetLeft;
                        } else {
                            animateHorizontalScroll(sliderEl, targetLeft, slideSpeed);
                        }
                    }
                } else {
                    const targetCard = cards[currentIndex];
                    if (targetCard) {
                        const targetLeft = targetCard.offsetLeft - sliderEl.offsetLeft;
                        if (!useAnimation || slideType === "instant" || slideSpeed <= 0) {
                            sliderEl.scrollLeft = targetLeft;
                        } else {
                            animateHorizontalScroll(sliderEl, targetLeft, slideSpeed);
                        }
                    }
                }

                dots.forEach((d, idx) => d.classList.toggle("active", idx === currentIndex));
            }

            for (let i = 0; i < count; i++) {
                const dot = document.createElement("button");
                dot.type = "button";
                dot.className = "tweak-slider-dot" + (i === 0 ? " active" : "");
                dot.setAttribute("aria-label", `Slide ${i + 1}`);
                dot.addEventListener("click", () => {
                    if (!isModeStillActive(slideType, activeGen)) return;
                    applyActiveState(i, true);
                    restartAutoplay();
                });
                dotsEl.appendChild(dot);
                dots.push(dot);
            }

            if (slideType === "fade") {
                applyActiveState(0, false);
            } else {
                sliderEl.addEventListener("scroll", () => {
                    if (!isModeStillActive(slideType, activeGen)) return;
                    const currentScroll = sliderEl.scrollLeft;
                    let closestIdx = 0;
                    let minDiff = Infinity;

                    cards.forEach((c, idx) => {
                        const diff = Math.abs(c.offsetLeft - sliderEl.offsetLeft - currentScroll);
                        if (diff < minDiff) {
                            minDiff = diff;
                            closestIdx = idx;
                        }
                    });

                    currentIndex = closestIdx;
                    dots.forEach((d, idx) => d.classList.toggle("active", idx === closestIdx));
                }, { passive: true });
            }

            function startAutoplay() {
                if (!autoplay || count <= 1 || !isModeStillActive(slideType, activeGen)) return;
                clearInterval(tweakAutoplayTimer);
                tweakAutoplayTimer = setInterval(() => {
                    if (!isModeStillActive(slideType, activeGen) || isPaused()) return;
                    if (!loop && currentIndex >= count - 1) return;
                    applyActiveState(currentIndex + 1, true);
                }, autoplayInterval);
            }

            function restartAutoplay() {
                startAutoplay();
            }

            startAutoplay();
        }

        async function renderJsonToDom(d) {
            runInnerEnginesCleanup();
            const sectionEl = document.getElementById("tweak-game-section-main");
            syncSectionContrastColors(sectionEl);
            document.getElementById("tweak-sec-title").textContent = "";
            document.getElementById("tweak-sec-subtitle").textContent = "";

            const config = d.sliderConfig || {};
            tweakCurrentSliderConfig = { ...tweakCurrentSliderConfig, ...config };
            const selectedMode = resolveSlideType(tweakCurrentSliderConfig.slideType);
            const activeGen = lockSlideMode(selectedMode);

            await loadTweakJsonPool();

            const sliderEl = document.getElementById("tweak-card-slider");
            const dotsEl = document.getElementById("tweak-slider-dots");
            const rawCards = Array.isArray(d.cards) ? d.cards : (d.card ? [d.card] : []);
            const firstCard = rawCards[0] || {};
            const mergedTweaks = rawCards.reduce((acc, c) => {
                const list = Array.isArray(c.tweaks) ? c.tweaks : (Array.isArray(c.items) ? c.items : (Array.isArray(c.apps) ? c.apps : []));
                return acc.concat(list);
            }, []);
            const cardsData = (mergedTweaks.length > 0 || tweakItemsPool.length > 0)
                ? [{
                    ...firstCard,
                    tag: "TWEAK CHO IPHONE & IPAD JAILBREAK",
                    title: "Tweak Tinh chỉnh cài trên Sileo, Zebra,..",
                    tweaks: mergedTweaks.length > 0 ? mergedTweaks : tweakItemsPool.map((t) => t.item)
                }]
                : rawCards;

            tweakCurrentSectionEntries = cardsData.map((it, idx) => ({ item: it, seedIndex: idx }));

            await loadAllItemsPool(cardsData);

            sliderEl.innerHTML = "";
            sliderEl.classList.toggle("has-multiple", cardsData.length > 1);

            cardsData.forEach((item, idx) => {
                sliderEl.appendChild(buildCardElement(item, idx, selectedMode, activeGen));
            });

            setupSliderController(sectionEl, sliderEl, dotsEl, cardsData, tweakCurrentSliderConfig, selectedMode, activeGen);
            syncSectionContrastColors(sectionEl);
        }

        async function initTweakSlider() {
            const sectionEl = document.getElementById("tweak-game-section-main");
            syncSectionContrastColors(sectionEl);

            if (typeof MutationObserver !== "undefined" && sectionEl) {
                const observer = new MutationObserver(() => {
                    syncSectionContrastColors(sectionEl);
                });
                observer.observe(document.documentElement, { attributes: true, attributeFilter: ["class", "style", "data-theme"] });
                observer.observe(document.body, { attributes: true, attributeFilter: ["class", "style", "data-theme"] });
                if (sectionEl.parentElement) {
                    observer.observe(sectionEl.parentElement, { attributes: true, attributeFilter: ["class", "style", "data-theme"] });
                }
            }

            for (const url of CANDIDATE_URLS) {
                try {
                    const res = await fetch(url, { cache: "no-store" });
                    if (!res.ok) continue;
                    const json = await res.json();
                    await renderJsonToDom(json);
                    return;
                } catch (_) {}
            }

            const fallbackTweaks = await loadTweakJsonPool();
            if (fallbackTweaks.length > 0) {
                await renderJsonToDom({
                    sectionTitle: "",
                    sectionSubtitle: "",
                    cards: [{
                        tag: "TWEAK CHO IPHONE & IPAD JAILBREAK",
                        title: "Tweak Tinh chỉnh cài trên Sileo, Zebra,..",
                        tweaks: fallbackTweaks.map((t) => t.item)
                    }]
                });
                return;
            }

            document.getElementById("tweak-sec-title").textContent = "";
            document.getElementById("tweak-sec-subtitle").textContent = "";
            syncSectionContrastColors(sectionEl);
        }

        initTweakSlider();
    })();
</script>
