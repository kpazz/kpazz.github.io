<meta charset="UTF-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Noto+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">

<style>
    .tweak-game-section {
        --slide-speed: 650ms;
        --sec-text-color: #000000;
        --dot-inactive-color: rgba(0, 0, 0, 0.25);
        --dot-active-color: #000000;
        --tweak-card-bg: #FFFFFF;
        --tweak-card-text: #111111;
        --tweak-card-kicker: #7E7E84;
        --tweak-card-sub: #76767C;
        --tweak-card-ver: #8E8E93;
        --tweak-card-row-hover: rgba(0, 0, 0, 0.035);
        --tweak-card-btn-bg: #EFEFF4;
        --tweak-card-btn-hover: #E2E2EA;
        --tweak-card-shadow: 0 10px 28px rgba(0, 0, 0, 0.08);
        background-color: transparent;
        color: var(--sec-text-color);
        font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Inter", "Noto Sans", "Helvetica Neue", Arial, sans-serif;
        width: 100%;
        max-width: 100%;
        box-sizing: border-box;
        padding: clamp(14px, 3.5vw, 28px) clamp(14px, 4vw, 24px);
        margin: 0;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
        text-rendering: optimizeLegibility;
    }

    .tweak-game-section.is-dark-bg {
        --sec-text-color: #FFFFFF;
        --dot-inactive-color: rgba(255, 255, 255, 0.3);
        --dot-active-color: #FFFFFF;
        --tweak-card-bg: #16181D;
        --tweak-card-text: #F5F5F7;
        --tweak-card-kicker: #98989F;
        --tweak-card-sub: #A1A1A6;
        --tweak-card-ver: #8E8E93;
        --tweak-card-row-hover: rgba(255, 255, 255, 0.05);
        --tweak-card-btn-bg: rgba(255, 255, 255, 0.14);
        --tweak-card-btn-hover: rgba(255, 255, 255, 0.22);
        --tweak-card-shadow: 0 12px 32px rgba(0, 0, 0, 0.45);
    }

    .tweak-game-section *,
    .tweak-game-section *::before,
    .tweak-game-section *::after {
        box-sizing: border-box;
        font-family: inherit;
    }

    .tweak-section-header {
        width: 100%;
        margin-bottom: 12px;
        padding-left: 2px;
        cursor: pointer;
        user-select: none;
        -webkit-tap-highlight-color: transparent;
    }

    .tweak-section-header h2 {
        font-size: clamp(21px, 5.6vw, 28px);
        font-weight: 700;
        line-height: 1.2;
        letter-spacing: -0.025em;
        color: var(--sec-text-color);
        margin: 0 0 3px 0;
    }

    .tweak-section-header p {
        font-size: clamp(13.5px, 3.8vw, 16px);
        font-weight: 400;
        line-height: 1.35;
        letter-spacing: -0.012em;
        color: var(--sec-text-color);
        margin: 0;
    }

    .tweak-card-slider {
        display: flex;
        flex-direction: row;
        gap: 14px;
        width: 100%;
        background-color: transparent;
        box-shadow: none;
        border: none;
        overflow-x: auto;
        scroll-snap-type: x mandatory;
        scroll-behavior: smooth;
        -webkit-overflow-scrolling: touch;
        scrollbar-width: none;
        padding-bottom: 4px;
    }

    .tweak-card-slider::-webkit-scrollbar {
        display: none;
    }

    .tweak-card-slider.slide-type-smooth,
    .tweak-card-slider.slide-type-scroll,
    .tweak-card-slider.slide-type-marquee,
    .tweak-card-slider.slide-type-zoom,
    .tweak-card-slider.slide-type-slide,
    .tweak-card-slider.slide-type-instant {
        scroll-snap-type: none;
    }

    .tweak-card-slider.slide-type-marquee {
        scroll-behavior: auto !important;
        overflow: hidden !important;
    }

    .tweak-game-card {
        flex: 0 0 100%;
        width: 100%;
        max-width: 100%;
        scroll-snap-align: start;
        background-color: var(--tweak-card-bg);
        color: var(--tweak-card-text);
        border-radius: clamp(20px, 4.8vw, 26px);
        padding: clamp(18px, 4.5vw, 24px) clamp(16px, 4.2vw, 22px) clamp(16px, 4vw, 22px);
        overflow: hidden;
        box-shadow: var(--tweak-card-shadow);
        border: none;
        transform: scale(1);
        transform-origin: center center;
        transition: transform 0.2s cubic-bezier(0.22, 1, 0.36, 1),
                    opacity var(--slide-speed) ease,
                    background-color 0.25s ease,
                    color 0.25s ease,
                    box-shadow 0.25s ease;
        -webkit-tap-highlight-color: transparent;
        user-select: none;
        cursor: pointer;
    }

    @media (hover: hover) {
        .tweak-game-card:hover {
            transform: scale(0.975);
        }
    }

    .tweak-game-card.is-pressed {
        transform: scale(0.975) !important;
    }

    .tweak-card-slider.slide-type-fade {
        position: relative;
        display: block;
        overflow: visible;
    }

    .tweak-card-slider.slide-type-fade .tweak-game-card {
        display: block;
        opacity: 1;
        visibility: visible;
    }

    @media (min-width: 640px) {
        .tweak-card-slider:not(.slide-type-fade).has-multiple .tweak-game-card {
            flex: 0 0 calc(92% - 7px);
        }
    }

    @media (min-width: 900px) {
        .tweak-card-slider:not(.slide-type-fade).has-multiple .tweak-game-card {
            flex: 0 0 calc(68% - 7px);
        }
    }

    #tabs-container .tweak-card-slider:not(.slide-type-fade).has-multiple .tweak-game-card {
        flex: 0 0 82%;
        max-width: 82%;
    }

    @media (min-width: 640px) {
        #tabs-container .tweak-card-slider:not(.slide-type-fade).has-multiple .tweak-game-card {
            flex: 0 0 calc(80% - 7px);
            max-width: calc(80% - 7px);
        }
    }

    @media (min-width: 900px) {
        #tabs-container .tweak-card-slider:not(.slide-type-fade).has-multiple .tweak-game-card {
            flex: 0 0 calc(62% - 7px);
            max-width: calc(62% - 7px);
        }
    }

    .tweak-col-head {
        margin-bottom: 16px;
        padding: 0 2px;
    }

    .tweak-col-kicker {
        font-size: clamp(10.5px, 2.8vw, 12px);
        font-weight: 700;
        text-transform: uppercase;
        letter-spacing: 0.04em;
        color: var(--tweak-card-kicker);
        margin-bottom: 4px;
        transition: color 0.25s ease;
    }

    .tweak-col-title {
        font-size: clamp(22px, 6vw, 28px);
        font-weight: 800;
        line-height: 1.15;
        letter-spacing: -0.025em;
        color: var(--tweak-card-text);
        margin: 0;
        white-space: pre-line;
        transition: color 0.25s ease;
    }

    .tweak-col-pages-scroll {
        display: flex;
        flex-direction: row;
        gap: 12px;
        overflow-x: auto;
        scroll-snap-type: x mandatory;
        scroll-behavior: smooth;
        -webkit-overflow-scrolling: touch;
        scrollbar-width: none;
    }

    .tweak-col-pages-scroll::-webkit-scrollbar {
        display: none;
    }

    .tweak-col-pages-scroll.slide-type-smooth,
    .tweak-col-pages-scroll.slide-type-scroll,
    .tweak-col-pages-scroll.slide-type-marquee,
    .tweak-col-pages-scroll.slide-type-zoom,
    .tweak-col-pages-scroll.slide-type-slide,
    .tweak-col-pages-scroll.slide-type-instant {
        scroll-snap-type: none !important;
    }

    .tweak-col-pages-scroll.slide-type-marquee {
        scroll-behavior: auto !important;
        overflow: hidden !important;
        display: block;
    }

    .tweak-marquee-track {
        display: flex;
        flex-direction: row;
        align-items: stretch;
        gap: 12px;
        width: max-content;
        will-change: transform;
    }

    .tweak-col-pages-scroll.slide-type-fade {
        position: relative;
        display: flex;
        flex-direction: row;
        overflow: hidden;
        scroll-snap-type: none !important;
    }

    .tweak-col-pages-scroll.slide-type-fade .tweak-col-page {
        display: flex;
        flex: 0 0 100%;
        width: 100%;
        min-width: 100%;
        opacity: 1;
        visibility: visible;
        transition: opacity var(--slide-speed) ease;
    }

    .tweak-col-pages-scroll.slide-type-fade .tweak-col-page:not(.is-active) {
        opacity: 0.35;
    }

    .tweak-col-pages-scroll.slide-type-zoom .tweak-col-page {
        transition: transform var(--slide-speed) cubic-bezier(0.22, 1, 0.36, 1),
                    opacity var(--slide-speed) ease;
    }

    .tweak-col-pages-scroll.slide-type-zoom .tweak-col-page.is-zooming {
        transform: scale(0.965);
        opacity: 0.78;
    }

    .tweak-col-page {
        flex: 0 0 calc(100% - 26px);
        width: calc(100% - 26px);
        scroll-snap-align: start;
        display: flex;
        flex-direction: column;
        gap: 14px;
    }

    .tweak-col-pages-scroll.slide-type-marquee .tweak-col-page {
        flex: 0 0 280px;
        width: 280px;
    }

    .tweak-col-app-row {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 10px;
        padding: 4px 2px;
        border-radius: 14px;
        transition: background-color 0.15s ease;
    }

    .tweak-col-app-row:hover {
        background-color: var(--tweak-card-row-hover);
    }

    .tweak-col-app-left {
        display: flex;
        align-items: center;
        gap: 10px;
        min-width: 0;
        flex: 1;
    }

    .tweak-col-app-icon {
        width: clamp(44px, 11.2vw, 52px);
        height: clamp(44px, 11.2vw, 52px);
        border-radius: 12px;
        object-fit: cover;
        flex-shrink: 0;
        border: none;
        box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
    }

    .tweak-col-app-text {
        display: flex;
        flex-direction: column;
        min-width: 0;
    }

    .tweak-col-app-name {
        font-size: clamp(14px, 3.7vw, 15.5px);
        font-weight: 700;
        line-height: 1.25;
        letter-spacing: -0.015em;
        color: var(--tweak-card-text);
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
        transition: color 0.25s ease;
    }

    .tweak-col-app-sub {
        font-size: clamp(12px, 3.2vw, 13.5px);
        font-weight: 400;
        line-height: 1.3;
        color: var(--tweak-card-sub);
        margin-top: 2px;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
        transition: color 0.25s ease;
    }

    .tweak-col-app-right {
        display: flex;
        flex-direction: column;
        align-items: center;
        flex-shrink: 0;
    }

    .tweak-col-action-btn {
        background-color: var(--tweak-card-btn-bg);
        color: #0A84FF;
        font-size: clamp(12.5px, 3.4vw, 14px);
        font-weight: 700;
        line-height: 1;
        padding: 8px 16px;
        border: none;
        border-radius: 999px;
        cursor: pointer;
        white-space: nowrap;
        transition: background-color 0.15s ease, transform 0.1s ease;
    }

    .tweak-col-action-btn:hover {
        background-color: var(--tweak-card-btn-hover);
    }

    .tweak-col-action-btn:active {
        transform: scale(0.95);
    }

    .tweak-col-cloud-btn {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        width: 44px;
        height: 32px;
        background-color: var(--tweak-card-btn-bg);
        color: #0A84FF;
        border: none;
        border-radius: 999px;
        cursor: pointer;
        flex-shrink: 0;
        transition: background-color 0.15s ease, transform 0.1s ease;
    }

    .tweak-col-cloud-btn:hover {
        background-color: var(--tweak-card-btn-hover);
    }

    .tweak-col-cloud-btn:active {
        transform: scale(0.95);
    }

    .tweak-col-cloud-btn svg {
        width: 19px;
        height: 19px;
    }

    .tweak-col-ver-note {
        font-size: 9px;
        font-weight: 600;
        color: var(--tweak-card-ver);
        margin-top: 3px;
        line-height: 1.1;
        transition: color 0.25s ease;
    }

    .tweak-slider-dots {
        display: flex;
        justify-content: center;
        align-items: center;
        gap: 7px;
        margin-top: 12px;
        background-color: transparent;
        border: none;
    }

    .tweak-slider-dot {
        width: 7px;
        height: 7px;
        border-radius: 999px;
        background-color: var(--dot-inactive-color);
        border: none;
        padding: 0;
        cursor: pointer;
        transition: width 0.2s ease, background-color 0.2s ease;
    }

    .tweak-slider-dot.active {
        width: 18px;
        background-color: var(--dot-active-color);
    }

    .tweak-popup-backdrop {
        position: fixed;
        inset: 0;
        background: rgba(0, 0, 0, 0.78);
        backdrop-filter: blur(10px);
        -webkit-backdrop-filter: blur(10px);
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 12px;
        z-index: 9999;
        opacity: 0;
        visibility: hidden;
        pointer-events: none;
        transition: opacity 0.28s cubic-bezier(0.22, 1, 0.36, 1),
                    visibility 0.28s cubic-bezier(0.22, 1, 0.36, 1);
        font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Inter", "Noto Sans", "Helvetica Neue", Arial, sans-serif;
    }

    .tweak-popup-backdrop.is-open {
        opacity: 1;
        visibility: visible;
        pointer-events: auto;
    }

    .tweak-popup-backdrop *,
    .tweak-popup-backdrop *::before,
    .tweak-popup-backdrop *::after {
        box-sizing: border-box;
        font-family: inherit;
    }

    .tweak-popup-modal {
        position: relative;
        width: 100%;
        max-width: 440px;
        max-height: 92vh;
        overflow-y: auto;
        scrollbar-width: none;
        background: #050607;
        color: #FFFFFF;
        border: none;
        border-radius: 26px;
        box-shadow: 0 24px 64px rgba(0, 0, 0, 0.9);
        transform: translateY(22px) scale(0.95);
        opacity: 0;
        transition: transform 0.32s cubic-bezier(0.22, 1, 0.36, 1),
                    opacity 0.24s ease;
    }

    .tweak-popup-modal::-webkit-scrollbar {
        display: none;
    }

    .tweak-popup-backdrop.is-open .tweak-popup-modal {
        transform: translateY(0) scale(1);
        opacity: 1;
    }

    .tweak-popup-toast {
        position: fixed;
        left: 50%;
        bottom: 24px;
        transform: translateX(-50%) translateY(12px);
        background: rgba(34, 34, 38, 0.94);
        color: #FFFFFF;
        font-size: 13px;
        font-weight: 600;
        padding: 9px 16px;
        border-radius: 999px;
        border: none;
        box-shadow: 0 10px 28px rgba(0, 0, 0, 0.65);
        z-index: 10002;
        opacity: 0;
        pointer-events: none;
        transition: opacity 0.2s ease, transform 0.2s ease;
    }

    .tweak-popup-toast.is-visible {
        opacity: 1;
        transform: translateX(-50%) translateY(0);
    }

    .tweak-version-picker-backdrop {
        position: fixed;
        inset: 0;
        background: rgba(0, 0, 0, 0.68);
        backdrop-filter: blur(12px);
        -webkit-backdrop-filter: blur(12px);
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 16px;
        z-index: 10001;
        opacity: 0;
        visibility: hidden;
        pointer-events: none;
        transition: opacity 0.24s cubic-bezier(0.22, 1, 0.36, 1),
                    visibility 0.24s cubic-bezier(0.22, 1, 0.36, 1);
        font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Inter", "Noto Sans", "Helvetica Neue", Arial, sans-serif;
    }

    .tweak-version-picker-backdrop.is-open {
        opacity: 1;
        visibility: visible;
        pointer-events: auto;
    }

    .tweak-version-picker-backdrop *,
    .tweak-version-picker-backdrop *::before,
    .tweak-version-picker-backdrop *::after {
        box-sizing: border-box;
        font-family: inherit;
    }

    .tweak-version-picker-modal {
        width: 100%;
        max-width: 390px;
        max-height: 82vh;
        overflow-y: auto;
        scrollbar-width: none;
        background: rgba(22, 24, 29, 0.96);
        color: #FFFFFF;
        border: none;
        border-radius: 24px;
        padding: 16px;
        box-shadow: 0 24px 60px rgba(0, 0, 0, 0.85);
        transform: translateY(16px) scale(0.96);
        opacity: 0;
        transition: transform 0.28s cubic-bezier(0.22, 1, 0.36, 1),
                    opacity 0.22s ease;
    }

    .tweak-version-picker-modal::-webkit-scrollbar {
        display: none;
    }

    .tweak-version-picker-backdrop.is-open .tweak-version-picker-modal {
        transform: translateY(0) scale(1);
        opacity: 1;
    }

    .tweak-version-picker-head {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 10px;
        margin-bottom: 12px;
    }

    .tweak-version-picker-app {
        display: flex;
        align-items: center;
        gap: 10px;
        min-width: 0;
    }

    .tweak-version-picker-icon {
        width: 42px;
        height: 42px;
        border-radius: 10px;
        object-fit: cover;
        flex-shrink: 0;
        border: none;
    }

    .tweak-version-picker-title {
        font-size: 16px;
        font-weight: 700;
        line-height: 1.2;
        color: #FFFFFF;
        margin: 0;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
    }

    .tweak-version-picker-sub {
        font-size: 12px;
        color: #98989F;
        margin: 2px 0 0 0;
    }

    .tweak-version-picker-close {
        width: 30px;
        height: 30px;
        border-radius: 999px;
        border: none;
        background: rgba(255, 255, 255, 0.12);
        color: #FFFFFF;
        font-size: 16px;
        line-height: 1;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        cursor: pointer;
        flex-shrink: 0;
    }

    .tweak-version-picker-close:hover {
        background: rgba(255, 255, 255, 0.2);
    }

    .tweak-version-picker-list {
        display: flex;
        flex-direction: column;
        gap: 8px;
    }

    .tweak-rec-search-wrap {
        position: sticky;
        top: 0;
        z-index: 5;
        margin-bottom: 10px;
        background: rgba(22, 24, 29, 0.96);
        padding-bottom: 2px;
    }

    .tweak-rec-search-wrap svg {
        position: absolute;
        left: 11px;
        top: 50%;
        transform: translateY(-50%);
        width: 15px;
        height: 15px;
        color: #8E8E93;
        pointer-events: none;
    }

    .tweak-rec-search-input {
        width: 100%;
        height: 38px;
        padding: 0 12px 0 34px;
        border-radius: 12px;
        border: none;
        background: rgba(255, 255, 255, 0.08);
        color: #FFFFFF;
        font-size: 16px;
        line-height: 1.2;
        -webkit-text-size-adjust: 100%;
        touch-action: manipulation;
        outline: none;
        transition: border-color 0.15s ease, background-color 0.15s ease;
    }

    .tweak-rec-search-input::placeholder {
        color: #8E8E93;
        font-size: 14px;
    }

    .tweak-rec-search-input:focus {
        background: rgba(255, 255, 255, 0.12);
    }

    .tweak-version-option {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 10px;
        width: 100%;
        padding: 11px 13px;
        border-radius: 14px;
        border: none;
        background: rgba(255, 255, 255, 0.05);
        color: #FFFFFF;
        text-align: left;
        cursor: pointer;
        transition: background-color 0.15s ease, border-color 0.15s ease;
    }

    .tweak-version-option:hover {
        background: rgba(10, 132, 255, 0.18);
    }

    .tweak-version-option-info {
        display: flex;
        flex-direction: column;
        min-width: 0;
        flex: 1;
    }

    .tweak-version-option-name {
        font-size: 14px;
        font-weight: 700;
        color: #FFFFFF;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
    }

    .tweak-version-option-meta {
        font-size: 11.5px;
        color: #98989F;
        margin-top: 2px;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
    }

    .tweak-version-option-cta {
        background: #0A84FF;
        color: #FFFFFF;
        font-size: 12px;
        font-weight: 700;
        padding: 6px 12px;
        border-radius: 999px;
        white-space: nowrap;
        flex-shrink: 0;
    }

    .tweak-version-picker-empty {
        font-size: 13px;
        color: #98989F;
        text-align: center;
        padding: 14px 8px;
        margin: 0;
    }

    .tweak-popup-sticky-bar {
        position: sticky;
        top: 0;
        z-index: 20;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 10px;
        padding: 10px 14px;
        background: rgba(24, 24, 26, 0.78);
        backdrop-filter: blur(22px) saturate(165%);
        -webkit-backdrop-filter: blur(22px) saturate(165%);
        border-bottom: 0.5px solid rgba(255, 255, 255, 0.14);
        opacity: 0;
        visibility: hidden;
        pointer-events: none;
        transform: translateY(-16px);
        transition: opacity 0.5s cubic-bezier(0.22, 1, 0.36, 1),
                    transform 0.56s cubic-bezier(0.22, 1, 0.36, 1),
                    visibility 0.5s linear;
        margin-bottom: -54px;
    }

    .tweak-popup-sticky-bar.is-visible {
        opacity: 1;
        visibility: visible;
        pointer-events: auto;
        transform: translateY(0);
    }

    .tweak-popup-sticky-bar #tweak-popup-sticky-download {
        opacity: 0;
        transform: translateY(-10px) scale(0.64);

<script>
    (function () {
        const CANDIDATE_URLS = ["Tabs/Tweak.json", "Tweak.json"];
        const TWEAK_JSON_URLS = ["Tabs/Tweak.json", "Tweak.json"];
        const EXTRA_JSON_URLS = ["Tabs/Tweak.json", "Tweak.json", "Tabs/Appios.json", "Appios.json", "Tabs/Apps.json", "Apps.json"];
        /*
         * slideType hỗ trợ (tất cả đều có vòng lặp mặc định loop !== false):
         * - "snap"    : Trượt ngang bắt dính từng trang/card (mặc định speed: 420ms, set bằng "slideSpeed": 420)
         * - "smooth"  : Trượt ngang mượt có gia tốc (mặc định speed: 850ms, set bằng "slideSpeed": 850)
         * - "fade"    : Mờ dần qua lại (mặc định speed: 700ms, set bằng "slideSpeed": 700)
         * - "scroll"  : Cuộn ngang dài có vòng lặp (mặc định speed: 1600ms, set bằng "slideSpeed": 1600)
         * - "marquee" : Cuộn đều liên tục vòng lặp vô hạn (mặc định speed: 38 px/s, set bằng "marqueeSpeed": 38 hoặc "slideSpeed")
         * - "zoom"    : Phóng nhẹ/thu nhẹ khi chuyển (mặc định speed: 750ms, set bằng "slideSpeed": 750)
         * - "slide"   : Trượt nhanh dứt khoát (mặc định speed: 300ms, set bằng "slideSpeed": 300)
         * - "instant" : Nhảy chuyển ngay lập tức (mặc định speed: 0ms, set bằng "slideSpeed": 0)
         */
        const ALLOWED_SLIDE_TYPES = new Set(["snap", "smooth", "fade", "scroll", "marquee", "zoom", "slide", "instant"]);
        const DEFAULT_SLIDE_SPEED_BY_TYPE = {
            snap: 420,
            smooth: 850,
            fade: 700,
            scroll: 1600,
            marquee: 1200,
            zoom: 750,
            slide: 300,
            instant: 0
        };
        const DEFAULT_MARQUEE_PX_PER_SEC = 38;
        const TOUCH_RESUME_DELAY_MS = 4500;
        let tweakAutoplayTimer = null;
        let tweakMarqueeRafId = null;
        let tweakSliderResumeTimer = null;
        let tweakPopupGalleryTimer = null;
        let tweakPopupGalleryRafId = null;
        let tweakPopupGalleryResumeTimer = null;
        let tweakToastTimer = null;
        let tweakCurrentSliderConfig = {};
        let tweakCurrentSectionEntries = [];
        let tweakAllItemsPool = [];
        let tweakItemsPool = [];
        let tweakCurrentPopupIsApp = true;
        let tweakCurrentAllAuthorEntries = [];
        let tweakCurrentAllLikeEntries = [];
        let tweakActiveRecModalEntries = [];
        let tweakActiveSlideMode = "snap";
        let tweakModeGeneration = 0;
        const tweakInnerCleanupRegistry = new Set();

        function lockSlideMode(nextMode) {
            tweakModeGeneration += 1;
            tweakActiveSlideMode = resolveSlideType(nextMode);
            if (tweakAutoplayTimer) {
                clearInterval(tweakAutoplayTimer);
                tweakAutoplayTimer = null;
            }
            if (tweakMarqueeRafId) {
                cancelAnimationFrame(tweakMarqueeRafId);
                tweakMarqueeRafId = null;
            }
            if (tweakSliderResumeTimer) {
                clearTimeout(tweakSliderResumeTimer);
                tweakSliderResumeTimer = null;
            }
            return tweakModeGeneration;
        }

        function isModeStillActive(expectedMode, expectedGen) {
            return tweakActiveSlideMode === expectedMode && tweakModeGeneration === expectedGen;
        }

        function registerInnerEngineCleanup(fn) {
            if (typeof fn === "function") {
                tweakInnerCleanupRegistry.add(fn);
            }
        }

        function runInnerEnginesCleanup() {
            tweakInnerCleanupRegistry.forEach((fn) => {
                try { fn(); } catch (_) {}
            });
            tweakInnerCleanupRegistry.clear();
        }

        function resolveSlideSpeed(config, slideType) {
            const type = resolveSlideType(slideType);
            if (config && config.slideSpeed !== undefined && config.slideSpeed !== null && config.slideSpeed !== "") {
                const parsed = Number(config.slideSpeed);
                if (!Number.isNaN(parsed) && parsed >= 0) return parsed;
            }
            return DEFAULT_SLIDE_SPEED_BY_TYPE[type] ?? 650;
        }

        function resolveMarqueeSpeed(config) {
            if (config && config.marqueeSpeed !== undefined && config.marqueeSpeed !== null && config.marqueeSpeed !== "") {
                const parsed = Number(config.marqueeSpeed);
                if (!Number.isNaN(parsed) && parsed > 0) return parsed;
            }
            if (config && config.slideSpeed !== undefined && config.slideSpeed !== null && config.slideSpeed !== "") {
                const fromSlideSpeed = Number(config.slideSpeed);
                if (!Number.isNaN(fromSlideSpeed) && fromSlideSpeed > 0) {
                    return fromSlideSpeed > 150 ? Math.max(12, Math.round(fromSlideSpeed / 25)) : fromSlideSpeed;
                }
            }
            return DEFAULT_MARQUEE_PX_PER_SEC;
        }

        function resolveAssetSrc(rawSrc, fallbackSvg) {
            const clean = String(rawSrc || "").trim();
            if (!clean) return fallbackSvg;
            if (/^(?:https?:\/\/|data:|blob:|\/)/i.test(clean)) return clean;

            const pathname = window.location.pathname || "/";
            const isInsideTabsFolder = /\/tabs\/[^/]*$/i.test(pathname);
            if (isInsideTabsFolder) {
                return clean;
            }

            const stripped = clean.replace(/^\.\//, "");
            if (/^tabs\//i.test(stripped)) {
                return stripped;
            }
            return `Tabs/${stripped}`;
        }

        function bindImageFallback(imgEl, fallbackSrc) {
            if (!imgEl || !fallbackSrc) return;
            imgEl.addEventListener("error", () => {
                if (imgEl.src !== fallbackSrc) {
                    imgEl.src = fallbackSrc;
                }
            }, { once: true });
        }

        function parseCssColor(rawColor) {
            if (!rawColor || typeof rawColor !== "string") return null;
            const trimmed = rawColor.trim().toLowerCase();
            if (trimmed === "transparent" || trimmed === "rgba(0, 0, 0, 0)") {
                return { r: 0, g: 0, b: 0, a: 0 };
            }
            const rgbaMatch = trimmed.match(/^rgba?\(\s*([\d.]+)\s*,\s*([\d.]+)\s*,\s*([\d.]+)(?:\s*,\s*([\d.]+))?\s*\)$/);
            if (rgbaMatch) {
                return {
                    r: Math.min(255, Math.max(0, Number(rgbaMatch[1]))),
                    g: Math.min(255, Math.max(0, Number(rgbaMatch[2]))),
                    b: Math.min(255, Math.max(0, Number(rgbaMatch[3]))),
                    a: rgbaMatch[4] !== undefined ? Math.min(1, Math.max(0, Number(rgbaMatch[4]))) : 1
                };
            }
            return null;
        }

        function detectSectionBackgroundDark(sectionEl) {
            if (!sectionEl) return false;

            const themeAttr = (
                sectionEl.getAttribute("data-theme") ||
                document.documentElement.getAttribute("data-theme") ||
                document.body.getAttribute("data-theme") ||
                ""
            ).toLowerCase();
            if (themeAttr.includes("dark")) return true;
            if (themeAttr.includes("light")) return false;

            const classStr = `${sectionEl.className || ""} ${document.body.className || ""} ${document.documentElement.className || ""}`.toLowerCase();
            if (/\b(dark|dark-mode|theme-dark|bg-dark)\b/.test(classStr)) return true;
            if (/\b(light|light-mode|theme-light|bg-light|bg-white)\b/.test(classStr)) return false;

            let rComp = 255;
            let gComp = 255;
            let bComp = 255;

            const chain = [];
            let el = sectionEl;
            while (el && el !== document.documentElement) {
                chain.push(el);
                el = el.parentElement;
            }
            chain.push(document.documentElement);

            for (let i = chain.length - 1; i >= 0; i--) {
                const parsed = parseCssColor(window.getComputedStyle(chain[i]).backgroundColor);
                if (parsed && parsed.a > 0) {
                    const alpha = parsed.a;
                    rComp = parsed.r * alpha + rComp * (1 - alpha);
                    gComp = parsed.g * alpha + gComp * (1 - alpha);
                    bComp = parsed.b * alpha + bComp * (1 - alpha);
                }
            }

            const luminance = (0.2126 * rComp + 0.7152 * gComp + 0.0722 * bComp) / 255;
            return luminance < 0.45;
        }

        function syncSectionContrastColors(sectionEl) {
            if (!sectionEl) return;
            const isDark = detectSectionBackgroundDark(sectionEl);
            sectionEl.classList.toggle("is-dark-bg", isDark);
        }

        function svgToDataUrl(svgString) {
            return "data:image/svg+xml;charset=utf-8," + encodeURIComponent(svgString.trim());
        }

        function createGameBannerSvg(seed = 0) {
            const palettes = [
                { glow: "#3a5938", mid: "#1d2f20", accent: "#8cc63f", beard: "#ff8c24" },
                { glow: "#28466b", mid: "#142236", accent: "#4ea8de", beard: "#f4a261" },
                { glow: "#5a2b4d", mid: "#281323", accent: "#e056fd", beard: "#ff9f1c" }
            ];
            const p = palettes[seed % palettes.length];

            return svgToDataUrl(`
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 870" width="800" height="870">
                <defs>
                    <radialGradient id="tweakCaveGlow" cx="62%" cy="26%" r="68%">
                        <stop offset="0%" stop-color="${p.glow}"/>
                        <stop offset="55%" stop-color="${p.mid}"/>
                        <stop offset="100%" stop-color="#0a0e0b"/>
                    </radialGradient>
                    <linearGradient id="tweakArmorGrad" x1="0%" y1="0%" x2="100%" y2="100%">
                        <stop offset="0%" stop-color="#9aa7b2"/>
                        <stop offset="55%" stop-color="#5a6570"/>
                        <stop offset="100%" stop-color="#2c333a"/>
                    </linearGradient>
                    <linearGradient id="tweakBeardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
                        <stop offset="0%" stop-color="${p.beard}"/>
                        <stop offset="100%" stop-color="#7c2804"/>
                    </linearGradient>
                    <linearGradient id="tweakBugShell" x1="0%" y1="0%" x2="100%" y2="100%">
                        <stop offset="0%" stop-color="${p.accent}"/>
                        <stop offset="100%" stop-color="#1d2b15"/>
                    </linearGradient>
                </defs>
                <rect width="800" height="870" fill="url(#tweakCaveGlow)"/>
                <path d="M0 0 L800 0 L800 220 Q610 150 430 210 Q220 270 0 160 Z" fill="#121e15" opacity="0.75"/>
                <circle cx="660" cy="185" r="190" fill="${p.beard}" opacity="0.1"/>
                <path d="M-40 240 Q120 170 250 280 Q330 350 290 470 Q230 560 90 540 L-40 500 Z" fill="url(#tweakBugShell)"/>
                <circle cx="215" cy="315" r="24" fill="#182210"/>
                <circle cx="222" cy="310" r="10" fill="#ffdf4d"/>
                <path d="M185 385 Q285 380 345 455 Q290 465 215 435 Z" fill="#e8d5a7"/>
                <path d="M475 430 Q630 360 820 410 L820 690 L430 690 Z" fill="url(#tweakArmorGrad)"/>
                <ellipse cx="665" cy="255" rx="92" ry="86" fill="#e59b78"/>
                <path d="M575 275 Q545 365 605 430 Q675 465 755 415 Q795 365 765 280 Q715 310 668 288 Q620 310 575 275 Z" fill="url(#tweakBeardGrad)"/>
                <g transform="translate(360, 445) rotate(-14)">
                    <rect x="0" y="28" width="440" height="105" rx="14" fill="#6d7780" stroke="#1d2226" stroke-width="5"/>
                    <rect x="215" y="70" width="115" height="22" rx="4" fill="#f2b705"/>
                </g>
            </svg>
            `);
        }

        function createGameIconSvg(seed = 0) {
            const icons = [
                { bg: "#4b2d1b", title: "DEEP ROCK", sub: "SURVIVOR", accent: "#f7b71d" },
                { bg: "#1b364b", title: "STARFIELD", sub: "OUTPOST", accent: "#72efdd" },
                { bg: "#3d1b4b", title: "NEBULA", sub: "ORBIT OPS", accent: "#ff70a6" }
            ];
            const ic = icons[seed % icons.length];

            return svgToDataUrl(`
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="240" height="240">
                <rect width="240" height="240" fill="${ic.bg}"/>
                <circle cx="120" cy="92" r="44" fill="#e69d7a"/>
                <path d="M78 105 Q120 135 162 105 Q155 152 120 162 Q85 152 78 105 Z" fill="#e06d24"/>
                <rect x="0" y="162" width="240" height="78" fill="rgba(10, 12, 11, 0.88)"/>
                <text x="120" y="192" text-anchor="middle" fill="${ic.accent}" font-family="Inter, Arial, sans-serif" font-size="22" font-weight="800" letter-spacing="1.4">${ic.title}</text>
                <text x="120" y="220" text-anchor="middle" fill="#ffffff" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="800" letter-spacing="2">${ic.sub}</text>
            </svg>
            `);
        }

        function escapeHtmlText(str) {
            return String(str || "")
                .replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;")
                .replace(/"/g, "&quot;")
                .replace(/'/g, "&#39;");
        }

        function formatShortLinkLabel(rawUrl) {
            try {
                const parsed = new URL(rawUrl);
                let host = parsed.hostname.replace(/^www\./i, "");
                const parts = host.split(".").filter(Boolean);
                if (parts.length === 2) {
                    return parts[0];
                }
                return host;
            } catch (_) {
                const cleaned = String(rawUrl || "").replace(/^https?:\/\//i, "").split("/")[0];
                return cleaned || rawUrl;
            }
        }

        function isDirectImageUrl(rawUrl) {
            const clean = String(rawUrl || "").split(/[?#]/)[0];
            return /\.(?:jpe?g|png|webp|gif|avif|bmp|svg)$/i.test(clean);
        }

        function renderDescriptionWithShortLinks(containerEl, rawText, allowInlineImages = false) {
            if (!containerEl) return;
            const text = String(rawText || "");
            const tokenRegex = allowInlineImages
                ? /(\{\{\s*(?:img|image)\s*:\s*[^}\s]+\s*\}\}|https?:\/\/[^\s<]+)/gi
                : /(https?:\/\/[^\s<]+)/gi;

            let lastIndex = 0;
            let html = "";
            let match;

            while ((match = tokenRegex.exec(text)) !== null) {
                const matchedToken = match[0];
                const start = match.index;
                html += escapeHtmlText(text.slice(lastIndex, start));

                const tagMatch = allowInlineImages
                    ? matchedToken.match(/^\{\{\s*(?:img|image)\s*:\s*([^}\s]+)\s*\}\}$/i)
                    : null;

                if (tagMatch) {
                    const imgUrl = tagMatch[1].trim();
                    if (/^https?:\/\//i.test(imgUrl) || /^data:image\//i.test(imgUrl) || /^\//i.test(imgUrl)) {
                        html += `<img class="tweak-inline-content-img" src="${escapeHtmlText(imgUrl)}" alt="Ảnh nội dung" loading="lazy">`;
                    } else {
                        html += escapeHtmlText(matchedToken);
                    }
                } else {
                    let cleanUrl = matchedToken;
                    let trailing = "";
                    const trailMatch = cleanUrl.match(/([.,!?;:]+)$/);
                    if (trailMatch) {
                        trailing = trailMatch[1];
                        cleanUrl = cleanUrl.slice(0, -trailing.length);
                    }

                    if (allowInlineImages && isDirectImageUrl(cleanUrl)) {
                        html += `<img class="tweak-inline-content-img" src="${escapeHtmlText(cleanUrl)}" alt="Ảnh nội dung" loading="lazy">${escapeHtmlText(trailing)}`;
                    } else {
                        const label = formatShortLinkLabel(cleanUrl);
                        html += `<a class="tweak-desc-link" href="${escapeHtmlText(cleanUrl)}" target="_blank" rel="noopener noreferrer">${escapeHtmlText(label)}</a>${escapeHtmlText(trailing)}`;
                    }
                }

                lastIndex = start + matchedToken.length;
            }

            html += escapeHtmlText(text.slice(lastIndex));
            containerEl.innerHTML = html;
        }

        function extractDownloadOptions(item) {
            if (!item || typeof item !== "object") return [];
            const rawList =
                item.downloads ||
                item.versions ||
                item.downloadLinks ||
                item.links ||
                item.mirrors ||
                item.downloadOptions ||
                item.options;

            const prefix = String(
                item.downloadOptionPrefix ||
                item.optionPrefix ||
                tweakCurrentSliderConfig.downloadOptionPrefix ||
                "Link tải"
            ).trim();
            const useVersionText = item.useVersionInPicker === true && isAppEntry(item);

            const options = [];
            if (Array.isArray(rawList)) {
                rawList.forEach((entry, idx) => {
                    const defaultName = `${prefix} ${idx + 1}`;
                    if (typeof entry === "string" && entry.trim() && entry.trim() !== "#") {
                        const label = useVersionText && item.version && idx === 0
                            ? String(item.version).trim()
                            : defaultName;
                        options.push({
                            label,
                            meta: [item.fileFormat, item.fileSize].filter(Boolean).join(" • "),
                            url: entry.trim()
                        });
                    } else if (entry && typeof entry === "object") {
                        const url = String(entry.url || entry.link || entry.href || entry.downloadUrl || "").trim();
                        if (!url || url === "#") return;
                        const explicitLabel = entry.label || entry.name || entry.title;
                        const label = explicitLabel
                            ? String(explicitLabel).trim()
                            : (useVersionText && entry.version
                                ? String(entry.version).trim()
                                : defaultName);
                        const metaParts = [
                            entry.note || entry.desc || entry.description || "",
                            (!useVersionText && entry.version && isAppEntry(item)) ? String(entry.version).trim() : "",
                            entry.format || entry.fileFormat || item.fileFormat || "",
                            entry.size || entry.fileSize || item.fileSize || ""
                        ].filter((x) => x && String(x).trim());
                        options.push({
                            label,
                            meta: metaParts.join(" • "),
                            url
                        });
                    }
                });
            }

            if (options.length > 0) return options;

            const singleUrl = String(item.buttonUrl || item.downloadUrl || item.url || "").trim();
            if (singleUrl && singleUrl !== "#") {
                const singleLabel = useVersionText && item.version
                    ? String(item.version).trim()
                    : `${prefix} 1`;
                return [{
                    label: singleLabel,
                    meta: [item.fileFormat, item.fileSize].filter(Boolean).join(" • ") || "Tải trực tiếp",
                    url: singleUrl
                }];
            }

            return [];
        }

        function closeVersionPickerPopup() {
            const pickerBackdrop = document.getElementById("tweak-version-picker-popup");
            if (!pickerBackdrop) return;
            pickerBackdrop.classList.remove("is-open");
            pickerBackdrop.setAttribute("aria-hidden", "true");
        }

        function normalizeSearchText(str) {
            return String(str || "")
                .toLowerCase()
                .normalize("NFD")
                .replace(/[\u0300-\u036f]/g, "")
                .replace(/đ/g, "d")
                .trim();
        }

        function filterRecModalList(rawKeyword) {
            const listEl = document.getElementById("tweak-rec-all-list");
            const subEl = document.getElementById("tweak-rec-all-sub");
            if (!listEl) return;

            const keyword = normalizeSearchText(rawKeyword);
            const filtered = !keyword
                ? tweakActiveRecModalEntries
                : tweakActiveRecModalEntries.filter(({ item }) => {
                    const haystack = normalizeSearchText(
                        [
                            item.appName,
                            item.title,
                            item.description,
                            item.genre,
                            item.author,
                            item.tag
                        ].filter(Boolean).join(" ")
                    );
                    return haystack.includes(keyword);
                });

            if (subEl) {
                subEl.textContent = keyword
                    ? `Tìm thấy ${filtered.length} / ${tweakActiveRecModalEntries.length} nội dung`
                    : `${tweakActiveRecModalEntries.length} nội dung`;
            }

            renderRecommendationList(
                listEl,
                filtered,
                keyword ? "Không tìm thấy nội dung phù hợp." : "Chưa có nội dung phù hợp."
            );
        }

        function closeAllRecPopup() {
            const recBackdrop = document.getElementById("tweak-rec-all-popup");
            if (!recBackdrop) return;
            recBackdrop.classList.remove("is-open");
            recBackdrop.setAttribute("aria-hidden", "true");
        }

        function openAllRecPopup(headingTitle, entries) {
            const recBackdrop = document.getElementById("tweak-rec-all-popup");
            const titleEl = document.getElementById("tweak-rec-all-title");
            const searchInput = document.getElementById("tweak-rec-all-search");
            if (!recBackdrop) return;

            tweakActiveRecModalEntries = Array.isArray(entries) ? entries : [];

            if (titleEl) {
                titleEl.textContent = headingTitle || "Tất cả đề xuất";
            }
            if (searchInput) {
                searchInput.value = "";
            }

            filterRecModalList("");
            recBackdrop.classList.add("is-open");
            recBackdrop.setAttribute("aria-hidden", "false");
        }

        function openVersionPickerPopup(item, iconSrc, seedIndex = 0) {
            const pickerBackdrop = document.getElementById("tweak-version-picker-popup");
            const listEl = document.getElementById("tweak-version-picker-list");
            const titleEl = document.getElementById("tweak-version-picker-title");
            const subEl = document.getElementById("tweak-version-picker-sub");
            const iconEl = document.getElementById("tweak-version-picker-icon");
            if (!pickerBackdrop || !listEl) return;

            const appName = (item && (item.appName || item.title)) || "Ứng dụng";
            const fallbackIcon = createGameIconSvg(seedIndex);
            const resolvedIcon = resolveAssetSrc(
                (iconSrc && iconSrc.trim()) || (item && (item.icon || item.img)),
                fallbackIcon
            );
            const options = extractDownloadOptions(item);

        function resolveItemShareUrl(item) {
            const opts = extractDownloadOptions(item);
            if (opts.length > 0) {
                try {
                    return new URL(opts[0].url, window.location.href).href;
                } catch (_) {
                    return opts[0].url;
                }
            }
            const slug = encodeURIComponent((item && (item.appName || item.title)) || "item");
            const base = window.location.href.split("#")[0];
            return `${base}#${slug}`;
        }

        async function shareCurrentItem(item) {
            const title = (item && (item.appName || item.title)) || "Ứng dụng";
            const text = (item && item.description) || title;
            const url = resolveItemShareUrl(item);

            if (navigator.share) {
                try {
                    await navigator.share({ title, text, url });
                    return;
                } catch (err) {
                    if (err && err.name === "AbortError") return;
                }
            }

            try {
                if (navigator.clipboard && navigator.clipboard.writeText) {
                    await navigator.clipboard.writeText(url);
                } else {
                    const tmp = document.createElement("textarea");
                    tmp.value = url;
                    document.body.appendChild(tmp);
                    tmp.select();
                    document.execCommand("copy");
                    document.body.removeChild(tmp);
                }
                showPopupToast("Đã sao chép liên kết");
            } catch (_) {
                showPopupToast(url);
            }
        }

        function toEmbedVideoUrl(rawUrl) {
            const url = String(rawUrl || "").trim();
            if (!url) return "";
            const ytMatch = url.match(/(?:youtube\.com\/(?:watch\?v=|embed\/|shorts\/)|youtu\.be\/)([A-Za-z0-9_-]{6,})/);
            if (ytMatch) {
                return `https://www.youtube.com/embed/${ytMatch[1]}`;
            }
            const vimeoMatch = url.match(/vimeo\.com\/(?:video\/)?(\d+)/);
            if (vimeoMatch) {
                return `https://player.vimeo.com/video/${vimeoMatch[1]}`;
            }
            return url;
        }

        function isIframeVideoUrl(rawUrl) {
            const url = String(rawUrl || "").trim();
            return /(?:youtube\.com|youtu\.be|vimeo\.com|player\.vimeo\.com)/i.test(url);
        }

        function buildMediaEntryHtml(entry, idx) {
            if (entry && typeof entry === "object" && entry.type === "video" && entry.src) {
                if (isIframeVideoUrl(entry.src)) {
                    const embedSrc = toEmbedVideoUrl(entry.src);
                    return `<iframe src="${embedSrc}" title="Video ${idx + 1}" allow="autoplay; encrypted-media; picture-in-picture" allowfullscreen></iframe>`;
                }
                return `<video src="${entry.src}" controls playsinline preload="metadata"></video>`;
            }
            const rawImgSrc = typeof entry === "string" ? entry : (entry && entry.src) || "";
            const fallbackBanner = createGameBannerSvg(idx);
            const imgSrc = resolveAssetSrc(rawImgSrc, fallbackBanner);
            return `<img src="${imgSrc}" alt="Ảnh ${idx + 1}" onerror="if(this.src!==decodeURIComponent('${encodeURIComponent(fallbackBanner)}')){this.src=decodeURIComponent('${encodeURIComponent(fallbackBanner)}');}">`;
        }

        function isAppEntry(item) {
            if (!item || typeof item !== "object") return false;
            if (typeof item.isApp === "boolean") return item.isApp;
            return true;
        }

        function shuffleArray(arr) {
            const copy = arr.slice();
            for (let i = copy.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [copy[i], copy[j]] = [copy[j], copy[i]];
            }
            return copy;
        }

        function extractItemsFromJson(json) {
            if (!json) return [];
            if (Array.isArray(json)) return json;
            if (Array.isArray(json.apps)) return json.apps;
            if (Array.isArray(json.tweaks)) return json.tweaks;
            if (Array.isArray(json.items)) return json.items;
            if (Array.isArray(json.cards)) return json.cards;
            if (json.card && typeof json.card === "object") return [json.card];
            return [];
        }

        async function loadTweakJsonPool() {
            const seen = new Set();
            const list = [];
            for (const url of TWEAK_JSON_URLS) {
                try {
                    const res = await fetch(url, { cache: "no-store" });
                    if (!res.ok) continue;
                    const json = await res.json();
                    if (json && typeof json === "object" && !Array.isArray(json) && json.sliderConfig && typeof json.sliderConfig === "object") {
                        tweakCurrentSliderConfig = { ...json.sliderConfig, ...tweakCurrentSliderConfig };
                    }
                    const rawItems = extractItemsFromJson(json);
                    rawItems.forEach((it, idx) => {
                        if (!it || typeof it !== "object") return;
                        const name = it.appName || it.title || it.name || `Tweak ${idx + 1}`;
                        const key = `${name}__${idx}`;
                        if (!seen.has(key)) {
                            seen.add(key);
                            list.push({
                                item: {
                                    ...it,
                                    appName: it.appName || it.title || it.name || "",
                                    description: it.description || it.subtitle || it.genre || "",
                                    isApp: typeof it.isApp === "boolean" ? it.isApp : true
                                },
                                seedIndex: idx
                            });
                        }
                    });
                    if (list.length > 0) break;
                } catch (_) {}
            }
            tweakItemsPool = list;
            return list;
        }

        async function loadAllItemsPool(currentCards) {
            const seen = new Set();
            const pool = [];

            const addItems = (list) => {
                if (!Array.isArray(list)) return;
                list.forEach((it, idx) => {
                    if (!it || typeof it !== "object") return;
                    const key = `${it.appName || it.title || ""}__${isAppEntry(it) ? "app" : "nonapp"}__${idx}`;
                    if (!seen.has(key)) {
                        seen.add(key);
                        pool.push({ item: it, seedIndex: idx });
                    }
                });
            };

            addItems(currentCards);
            addItems(tweakItemsPool.map((t) => t.item));

            for (const url of EXTRA_JSON_URLS) {
                try {
                    const res = await fetch(url, { cache: "no-store" });
                    if (!res.ok) continue;
                    const json = await res.json();
                    const list = extractItemsFromJson(json);
                    list.forEach((it, idx) => {
                        const itemName = it.appName || it.title || it.name || "";
                        const exists = pool.some(
                            (entry) =>
                                (entry.item.appName || entry.item.title) === itemName &&
                                isAppEntry(entry.item) === isAppEntry(it)
                        );
                        if (!exists) {
                            pool.push({ item: it, seedIndex: pool.length + idx });
                        }
                    });
                } catch (_) {}
            }

            tweakAllItemsPool = pool;
        }

        function populateRecommendations(currentItem) {
            const authorSection = document.getElementById("tweak-rec-author-section");
            const authorHeading = document.getElementById("tweak-rec-author-heading");
            const authorListEl = document.getElementById("tweak-rec-author-list");
            const likeHeading = document.getElementById("tweak-rec-like-heading");
            const likeListEl = document.getElementById("tweak-rec-like-list");

            const currentName = currentItem.appName || currentItem.title || "";
            const currentAuthor = (currentItem.author && currentItem.author.trim()) || "";
            const targetIsApp = isAppEntry(currentItem);

            const matchingPool = tweakAllItemsPool.filter(({ item }) => isAppEntry(item) === targetIsApp);

            const allSameAuthorItems = matchingPool.filter(({ item }) => {
                const name = item.appName || item.title || "";
                const auth = (item.author && item.author.trim()) || "";
                return name !== currentName && currentAuthor && auth === currentAuthor;
            });
            tweakCurrentAllAuthorEntries = allSameAuthorItems;

            const sameAuthorItems = shuffleArray(allSameAuthorItems).slice(0, 3);

            if (currentAuthor && sameAuthorItems.length > 0) {
                authorSection.style.display = "";
                authorHeading.textContent = targetIsApp
                    ? `Ứng Dụng Khác Của ${currentAuthor}`
                    : `Nội Dung Khác Của ${currentAuthor}`;
                renderRecommendationList(
                    authorListEl,
                    sameAuthorItems,
                    targetIsApp ? "Chưa có đề xuất APP phù hợp." : "Chưa có nội dung liên quan phù hợp."
                );
            } else {
                authorSection.style.display = "none";
            }

            const usedNames = new Set([currentName, ...sameAuthorItems.map((e) => e.item.appName || e.item.title || "")]);
            const allOtherItems = matchingPool.filter(({ item }) => {
                const name = item.appName || item.title || "";
                return name !== currentName;
            });
            tweakCurrentAllLikeEntries = allOtherItems;

            const otherItems = shuffleArray(
                matchingPool.filter(({ item }) => {
                    const name = item.appName || item.title || "";
                    return !usedNames.has(name);
                })
            ).slice(0, 3);

            if (likeHeading) {
                likeHeading.textContent = targetIsApp ? "Có Thể Bạn Cũng Thích" : "Nội Dung Liên Quan";
            }
            renderRecommendationList(
                likeListEl,
                otherItems,
                targetIsApp ? "Chưa có đề xuất APP phù hợp." : "Chưa có nội dung không phải APP phù hợp."
            );
        }

        function stopPopupGalleryAutoplay() {
            if (tweakPopupGalleryTimer) {
                clearInterval(tweakPopupGalleryTimer);
                tweakPopupGalleryTimer = null;
            }
            if (tweakPopupGalleryRafId) {
                cancelAnimationFrame(tweakPopupGalleryRafId);
                tweakPopupGalleryRafId = null;
            }
            if (tweakPopupGalleryResumeTimer) {
                clearTimeout(tweakPopupGalleryResumeTimer);
                tweakPopupGalleryResumeTimer = null;
            }
        }

        function bindHoldAndSwipePause(targetEl, getState, setState, getTimer, setTimer) {
            const pauseNow = () => {
                const st = getState();
                st.isHolding = true;
                st.isResumeDelayed = false;
                const existingTimer = getTimer();
                if (existingTimer) {
                    clearTimeout(existingTimer);
                    setTimer(null);
                }
            };

            const delayResume = () => {
                const st = getState();
                st.isHolding = false;
                st.isResumeDelayed = true;
                const existingTimer = getTimer();
                if (existingTimer) {
                    clearTimeout(existingTimer);
                }
                const nextTimer = setTimeout(() => {
                    st.isResumeDelayed = false;
                    setTimer(null);
                }, TOUCH_RESUME_DELAY_MS);
                setTimer(nextTimer);
            };

            targetEl.addEventListener("mouseenter", () => {
                getState().isHovering = true;
            });
            targetEl.addEventListener("mouseleave", () => {
                getState().isHovering = false;
            });
            targetEl.addEventListener("pointerdown", pauseNow, { passive: true });
            targetEl.addEventListener("pointerup", delayResume, { passive: true });
            targetEl.addEventListener("pointercancel", delayResume, { passive: true });
            targetEl.addEventListener("touchstart", pauseNow, { passive: true });
            targetEl.addEventListener("touchmove", pauseNow, { passive: true });
            targetEl.addEventListener("touchend", delayResume, { passive: true });
            targetEl.addEventListener("touchcancel", delayResume, { passive: true });
            targetEl.addEventListener("scroll", () => {
                if (getState().isHolding) {
                    pauseNow();
                } else {
                    delayResume();
                }
            }, { passive: true });
        }

        function setupPopupGallery(galleryEl, mediaList, config) {
            stopPopupGalleryAutoplay();
            galleryEl.innerHTML = "";
            if (!Array.isArray(mediaList) || mediaList.length === 0) return;

            mediaList.forEach((entry, idx) => {
                const itemEl = document.createElement("div");
                itemEl.className = "tweak-popup-gallery-item";
                itemEl.innerHTML = buildMediaEntryHtml(entry, idx);
                galleryEl.appendChild(itemEl);
            });

            if (mediaList.length <= 1) return;

            const autoplay = config.autoplay !== false;
            if (!autoplay) return;

            const slideType = resolveSlideType(config.slideType);
            const expectedGen = tweakModeGeneration;
            const slideSpeed = resolveSlideSpeed(config, slideType);
            const marqueeSpeedPxPerSec = resolveMarqueeSpeed(config);
            const loop = config.loop !== false;
            const autoplayInterval = Number(config.autoplayInterval) >= 1000 ? Number(config.autoplayInterval) : 4000;

            const pauseState = {
                isHolding: false,
                isHovering: false,
                isResumeDelayed: false
            };
            const isPaused = () => pauseState.isHolding || pauseState.isHovering || pauseState.isResumeDelayed;

            bindHoldAndSwipePause(
                galleryEl,
                () => pauseState,
                (next) => { Object.assign(pauseState, next); },
                () => tweakPopupGalleryResumeTimer,
                (t) => { tweakPopupGalleryResumeTimer = t; }
            );

            if (slideType === "marquee") {
                galleryEl.style.scrollBehavior = "auto";
                galleryEl.style.scrollSnapType = "none";
                galleryEl.style.overflow = "hidden";

                const track = document.createElement("div");
                track.className = "tweak-marquee-track";
                const origItems = Array.from(galleryEl.children);
                origItems.forEach((origItem) => {
                    origItem.style.flex = "0 0 240px";
                    origItem.style.flexShrink = "0";
                    track.appendChild(origItem);
                });
                mediaList.forEach((entry, idx) => {
                    const clone = document.createElement("div");
                    clone.className = "tweak-popup-gallery-item";
                    clone.style.flex = "0 0 240px";
                    clone.style.flexShrink = "0";
                    clone.innerHTML = buildMediaEntryHtml(entry, idx);
                    track.appendChild(clone);
                });
                galleryEl.appendChild(track);

                let offsetPx = 0;
                let lastTime = performance.now();
                function tick(now) {
                    if (!isModeStillActive("marquee", expectedGen)) {
                        tweakPopupGalleryRafId = null;
                        return;
                    }
                    const dt = Math.min((now - lastTime) / 1000, 0.1);
                    lastTime = now;
                    if (!isPaused()) {
                        const cycleWidth = track.scrollWidth / 2;
                        if (cycleWidth > 1) {
                            offsetPx += marqueeSpeedPxPerSec * dt;
                            if (offsetPx >= cycleWidth) {
                                offsetPx -= cycleWidth;
                            }
                            track.style.transform = `translate3d(${-offsetPx}px, 0, 0)`;
                        }
                    }
                    tweakPopupGalleryRafId = requestAnimationFrame(tick);
                }
                tweakPopupGalleryRafId = requestAnimationFrame(tick);
                return;
            }

            let idx = 0;
            tweakPopupGalleryTimer = setInterval(() => {
                if (!isModeStillActive(slideType, expectedGen) || isPaused()) return;
                const items = Array.from(galleryEl.children);
                if (items.length <= 1) return;
                if (loop) {
                    idx = (idx + 1) % items.length;
                } else if (idx < items.length - 1) {
                    idx += 1;
                } else {
                    return;
                }
                const target = items[idx];
                animateHorizontalScroll(galleryEl, target.offsetLeft - galleryEl.offsetLeft, slideSpeed);
            }, autoplayInterval);
        }

        function setStickyDownloadVisible(stickyBar, stickyDownloadBtn, shouldShow) {
            if (!stickyBar) return;
            if (stickyDownloadBtn) {
                stickyDownloadBtn.style.display = tweakCurrentPopupIsApp ? "" : "none";
            }
            const nextVisible = Boolean(tweakCurrentPopupIsApp && shouldShow);
            const currentlyVisible = stickyBar.classList.contains("is-visible");
            if (nextVisible === currentlyVisible) return;

            if (nextVisible) {
                stickyBar.style.visibility = "visible";
                requestAnimationFrame(() => {
                    requestAnimationFrame(() => {
                        stickyBar.classList.add("is-visible");
                    });
                });
            } else {
                stickyBar.classList.remove("is-visible");
            }
        }

            const authorText = (item.author && item.author.trim()) || "Đang cập nhật";

            const versionText = tweakCurrentPopupIsApp

            document.getElementById("tweak-popup-title").textContent = resolvedTitle;

        function attachInnerPagesAutoplay(pagesScrollEl, pageCount, config, activeMode, activeGen) {
            if (!pagesScrollEl || pageCount <= 1) return;

            if (!autoplay) return;

            const slideType = resolveSlideType(activeMode || config.slideType);
            const slideSpeed = resolveSlideSpeed(config, slideType);
            const marqueeSpeedPxPerSec = resolveMarqueeSpeed(config);
            const loop = config.loop !== false;

            pagesScrollEl.style.setProperty("--slide-speed", `${slideSpeed}ms`);
            pagesScrollEl.classList.remove(
                "slide-type-snap",
                "slide-type-smooth",
                "slide-type-fade",
                "slide-type-scroll",
                "slide-type-marquee",
                "slide-type-zoom",
                "slide-type-slide",
                "slide-type-instant"
            );
            pagesScrollEl.classList.add(`slide-type-${slideType}`);

            let resumeTimer = null;
            let innerInterval = null;
            let innerRaf = null;
            let stopped = false;
            const pauseState = { isHolding: false, isHovering: false, isResumeDelayed: false };
            const isPaused = () => pauseState.isHolding || pauseState.isHovering || pauseState.isResumeDelayed;

            const cleanupInner = () => {
                stopped = true;
                if (innerInterval) {
                    clearInterval(innerInterval);
                    innerInterval = null;
                }
                if (innerRaf) {
                    cancelAnimationFrame(innerRaf);
                    innerRaf = null;
                }
                if (resumeTimer) {
                    clearTimeout(resumeTimer);
                    resumeTimer = null;
                }
            };
            registerInnerEngineCleanup(cleanupInner);

            bindHoldAndSwipePause(
                pagesScrollEl,
                () => pauseState,
                (next) => { Object.assign(pauseState, next); },
                () => resumeTimer,
                (t) => { resumeTimer = t; }
            );

            if (slideType === "marquee") {
                pagesScrollEl.style.scrollBehavior = "auto";
                pagesScrollEl.style.scrollSnapType = "none";
                pagesScrollEl.style.overflow = "hidden";

                const track = document.createElement("div");
                track.className = "tweak-marquee-track";

                const origPages = Array.from(pagesScrollEl.children);
                origPages.forEach((p) => {
                    p.style.flex = "0 0 280px";
                    p.style.width = "280px";
                    p.style.flexShrink = "0";
                    track.appendChild(p);
                });

                origPages.forEach((p) => {
                    const clone = p.cloneNode(true);
                    clone.style.flex = "0 0 280px";
                    clone.style.width = "280px";
                    clone.style.flexShrink = "0";
                    clone.querySelectorAll(".tweak-col-app-row").forEach((row, rIdx) => {
                        const actionBtn = row.querySelector(".tweak-col-action-btn, .tweak-col-cloud-btn");
                        if (actionBtn) {
                            actionBtn.addEventListener("click", (e) => {
                                e.stopPropagation();
                                const nameEl = row.querySelector(".tweak-col-app-name");
                                const found = tweakItemsPool.find((t) => (t.item.appName || t.item.title) === (nameEl && nameEl.textContent));
                                openVersionPickerPopup(found ? found.item : {}, row.querySelector("img") && row.querySelector("img").src, rIdx);
                            });
                        }
                        row.addEventListener("click", (e) => {
                            e.stopPropagation();
                            const nameEl = row.querySelector(".tweak-col-app-name");
                            const found = tweakItemsPool.find((t) => (t.item.appName || t.item.title) === (nameEl && nameEl.textContent));
                            const targetItem = found ? found.item : {};
                            openCardPopup(targetItem, targetItem.banner, row.querySelector("img") && row.querySelector("img").src, rIdx);
                        });
                    });
                    track.appendChild(clone);
                });

                pagesScrollEl.innerHTML = "";
                pagesScrollEl.appendChild(track);

                let offsetPx = 0;
                let lastTime = performance.now();

                function tickMarquee(now) {
                    if (stopped || !isModeStillActive("marquee", activeGen)) {
                        innerRaf = null;
                        return;
                    }
                    const dt = Math.min((now - lastTime) / 1000, 0.1);
                    lastTime = now;
                    if (!isPaused()) {
                        const cycleWidth = track.scrollWidth / 2;
                        if (cycleWidth > 1) {
                            offsetPx += marqueeSpeedPxPerSec * dt;
                            if (offsetPx >= cycleWidth) {
                                offsetPx -= cycleWidth;
                            }
                            track.style.transform = `translate3d(${-offsetPx}px, 0, 0)`;
                        }
                    }
                    innerRaf = requestAnimationFrame(tickMarquee);
                }
                innerRaf = requestAnimationFrame(tickMarquee);
                return;
            }

            let pageIdx = 0;
            const pages = Array.from(pagesScrollEl.children);

            if (slideType === "fade") {
                pages.forEach((p, idx) => {
                    p.style.opacity = "1";
                    p.classList.toggle("is-active", idx === 0);
                });
                innerInterval = setInterval(() => {
                    if (stopped || !isModeStillActive(slideType, activeGen) || isPaused()) return;
                    if (loop) {
                        pageIdx = (pageIdx + 1) % pages.length;
                    } else if (pageIdx < pages.length - 1) {
                        pageIdx += 1;
                    } else {
                        return;
                    }
                    pages.forEach((p, idx) => {
                        p.classList.toggle("is-active", idx === pageIdx);
                        p.style.opacity = idx === pageIdx ? "1" : "0.35";
                    });
                    const activePage = pages[pageIdx];
                    if (activePage) {
                        animateHorizontalScroll(pagesScrollEl, activePage.offsetLeft - pagesScrollEl.offsetLeft, slideSpeed);
                    }
                }, autoplayInterval);
                return;
            }

            pagesScrollEl.addEventListener("scroll", () => {
                if (!isModeStillActive(slideType, activeGen)) return;
                let closest = 0;
                let minDiff = Infinity;
                pages.forEach((p, idx) => {
                    const diff = Math.abs(p.offsetLeft - pagesScrollEl.offsetLeft - pagesScrollEl.scrollLeft);
                    if (diff < minDiff) {
                        minDiff = diff;
                        closest = idx;
                    }
                });
                pageIdx = closest;
            }, { passive: true });

            innerInterval = setInterval(() => {
                if (stopped || !isModeStillActive(slideType, activeGen) || isPaused()) return;
                if (pages.length <= 1) return;
                if (loop) {
                    pageIdx = (pageIdx + 1) % pages.length;
                } else if (pageIdx < pages.length - 1) {
                    pageIdx += 1;
                } else {
                    return;
                }
                const target = pages[pageIdx];
                if (target) {
                    const targetLeft = target.offsetLeft - pagesScrollEl.offsetLeft;
                    if (slideType === "instant" || slideSpeed <= 0) {
                        pagesScrollEl.scrollLeft = targetLeft;
                    } else if (slideType === "zoom") {
                        pages.forEach((p) => p.classList.add("is-zooming"));
                        animateHorizontalScroll(pagesScrollEl, targetLeft, slideSpeed);
                        setTimeout(() => {
                            pages.forEach((p) => p.classList.remove("is-zooming"));
                        }, Math.min(slideSpeed, 600));
                    } else {
                        animateHorizontalScroll(pagesScrollEl, targetLeft, slideSpeed);
                    }
                }
            }, autoplayInterval);
        }

        function animateHorizontalScroll(sliderEl, targetLeft, durationMs) {
            const startLeft = sliderEl.scrollLeft;
            const maxScroll = Math.max(0, sliderEl.scrollWidth - sliderEl.clientWidth);
            const clampedTarget = Math.max(0, Math.min(targetLeft, maxScroll));
            const distance = clampedTarget - startLeft;
            if (Math.abs(distance) < 1 || durationMs <= 0) {
                sliderEl.scrollLeft = clampedTarget;
                return;
            }

            if (sliderEl._tweakScrollRafId) {
                cancelAnimationFrame(sliderEl._tweakScrollRafId);
                sliderEl._tweakScrollRafId = null;
            }

            const startTime = performance.now();
            const prevBehavior = sliderEl.style.scrollBehavior;
            const prevSnapType = sliderEl.style.scrollSnapType;
            sliderEl.style.scrollBehavior = "auto";
            sliderEl.style.scrollSnapType = "none";

            function finish() {
                sliderEl.style.scrollBehavior = prevBehavior;
                sliderEl.style.scrollSnapType = prevSnapType;
                sliderEl._tweakScrollRafId = null;
            }

            function step(now) {
                const elapsed = now - startTime;
                const progress = Math.min(elapsed / durationMs, 1);
                const ease = progress < 0.5
                    ? 4 * progress * progress * progress
                    : 1 - Math.pow(-2 * progress + 2, 3) / 2;
                sliderEl.scrollLeft = startLeft + distance * ease;

                if (progress < 1) {
                    sliderEl._tweakScrollRafId = requestAnimationFrame(step);
                } else {
                    sliderEl.scrollLeft = clampedTarget;
                    finish();
                }
            }

            sliderEl._tweakScrollRafId = requestAnimationFrame(step);
        }
