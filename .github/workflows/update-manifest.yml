name: Update Tabs Manifest

on:
  push:
    paths:
      - "Tabs/**.html"
      - "tabs/**.html"
      - "update_manifest.py"

permissions:
  contents: write

jobs:
  build-manifest:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Run update_manifest.py
        run: python update_manifest.py

      - name: Commit and push if manifest changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [ -f "Tabs/manifest.json" ]; then
            git add -f Tabs/manifest.json
          elif [ -f "tabs/manifest.json" ]; then
            git add -f tabs/manifest.json
          fi
          git status --short
          if ! git diff --staged --quiet; then
            git commit -m "chore: update Tabs manifest.json"
            git push origin HEAD:main
          else
            echo "Không có thay đổi trên manifest.json"
          fi
