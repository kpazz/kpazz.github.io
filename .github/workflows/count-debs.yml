name: Auto Count Debs

on:
  push:
    paths:
      - 'debs/**' # Lắng nghe bất cứ khi nào có thay đổi trong thư mục debs

jobs:
  count:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure Git Identity
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

      - name: Count files and save to static/deb-count.json
        run: |
          # Tạo thư mục static nếu chưa tồn tại
          mkdir -p static
          
          # Đếm chính xác số lượng file .deb (hỗ trợ cả thư mục con)
          COUNT=$(find debs -name "*.deb" | wc -l)
          
          # Ghi số lượng ra file JSON
          echo "{\"count\": $COUNT}" > static/deb-count.json
          
          # Kiểm tra và push thay đổi lên nhánh gh-pages (hoặc nhánh hiện tại)
          git status
          git add static/deb-count.json
          git commit -m "Auto-update deb count to $COUNT" || echo "No changes to commit"
          git push
