name: Auto Count Debs

on:
  push:
    branches:
      - gh-pages # Lắng nghe sự kiện khi bạn đẩy code trực tiếp lên nhánh gh-pages
    paths:
      - 'debs/**'

jobs:
  count:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: gh-pages # Bắt buộc checkout thẳng vào nhánh gh-pages

      - name: Configure Git Identity
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

      - name: Count files and save to static/deb-count.json
        run: |
          # Đếm số lượng file .deb trong thư mục debs
          COUNT=$(find debs -name "*.deb" | wc -l)
          
          # Đảm bảo có thư mục static và tạo file JSON trong đó
          mkdir -p static
          echo "{\"count\": $COUNT}" > static/deb-count.json
          
          # Đưa file vào git
          git add static/deb-count.json

      - name: Commit and push changes
        run: |
          git diff --quiet && git diff --staged --quiet || (git commit -m "Update deb count to $COUNT on gh-pages [skip ci]" && git push origin gh-pages)
