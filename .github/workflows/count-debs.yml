name: Auto Count Debs

on:
  push:
    branches:
      - gh-pages # Lắng nghe sự kiện khi bạn đẩy code trực tiếp lên nhánh gh-pages
    paths:
      - 'debs/**'

jobs:
  count:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: gh-pages # Bắt buộc checkout thẳng vào nhánh gh-pages

      - name: Configure Git Identity
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

      - name: Count files and save to static/deb-count.json
        run: |
          # Tạo thư mục static nếu chưa có
          mkdir -p static
          
          # Đếm chính xác số lượng file .deb (hỗ trợ cả tìm kiếm trong thư mục con)
          COUNT=$(find debs -name "*.deb" | wc -l)
          
          # Ghi kết quả ra file JSON
          echo "{\"count\": $COUNT}" > static/deb-count.json
          
          # Kiểm tra git status và commit/push nếu có thay đổi
          git status
          git add static/deb-count.json
          git commit -m "Auto-update deb count to $COUNT" || echo "No changes to commit"
          git push
